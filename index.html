const ABA_DESPESAS = CFG.abaDespesas || "DESPESAS TOTAIS";

// Categorias tratadas diretamente em normCat() abaixo

function normCat(catRaw, descRaw) {
  const cat  = (catRaw  || "").trim();
  const desc = (descRaw || "").trim();
  if(!cat && !desc) return "Outros";
  const catU = cat.toUpperCase();
  const descU = desc.toUpperCase();
  // Never classify retirada/aporte entries as despesas
  if(catU.includes("RETIRA") || descU.includes("RETIRA SOC")) return null;
  if(catU.includes("AFAC") || descU.startsWith("AFAC")) return null;
  // Exclude only retiradas de sócios — permuta e outros ficam nas despesas
  const catL = cat.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(catL.includes('retira') || catL.includes('afac')) return null;
  // Permuta paga entra nas despesas normalmente
  if(catL.includes('permut')) return 'Permuta';
  // Map exact spreadsheet categories to canonical names
  if(catL.includes('aquisicao de materiais') || catL.includes('fornecedor - aquisicao')) return 'Aquisição de Materiais';
  if(catL.includes('comissao corretor') || catL.includes('comissao de corretor')) return 'Comissão Corretor';
  if(catL.includes('cartorio') && catL.includes('terreno')) return 'Cartório - Aquisição Terreno';
  if(catL.includes('taxa') || catL.includes('licenca') || catL.includes('alvara')) return 'Taxas/Licenças/Alvará';
  if(catL.includes('tarifa bancaria') || catL.includes('tarifas bancarias')) return 'Tarifas Bancárias';
  if(catL.includes('escritorio') || catL.includes('funcionarios') || catL.includes('material de escri')) return 'Escritório/Administrativo';
  if(catL.includes('diversos') || catL.includes('impressoes') || catL.includes('correios') || catL.includes('combustivel')) return 'Diversos';
  if(catL.includes('limpeza') || catL.includes('desmatamento') || catL.includes('entulho')) return 'Limpeza/Terraplanagem';
  if(catL.includes('projeto') && catL.includes('arquitetura')) return 'Projetos de Arquitetura';
  if(catL.includes('imposto') || catL.includes('tribut')) return 'Impostos/Tributos';
  // Return category as-is if present (trust the spreadsheet)
  if(cat && cat.length > 2) return cat;

  // Aluguel de equipamentos / locação
  if(cat.includes("ALUGUEL") || cat.includes("LOCAÇÃO") || cat.includes("LOCACAO") ||
     cat.includes("ALUGEL")) // typo na planilha
    return "Aluguel de Equipamentos";

  // Alimentação / canteiro
  if(cat.includes("ALIMENTAÇÃO") || cat.includes("ALIMENTACAO") ||
     cat.includes("CANTEIRO") || cat.includes("REFEITÓRIO"))
    return "Canteiro e Alimentação";

  // Categoria composta — desambigua pela descrição
  if(cat.includes("SEGURANÇA") || cat.includes("SEGURANCA") ||
     cat.includes("VIGIA") || cat.includes("MANTEIRO") ||
     cat.includes("MANUTENCAO") || cat.includes("MANUTENÇÃO") ||
     cat.includes("SERV EXTRA")) {
    if(desc.includes("MANTEIRO") || desc.includes("MANUTENÇÃO CONTA") || 
       desc.includes("MANUTENCAO CONTA"))
      return "Mão de Obra";
    if(desc.includes("MANUTENÇÃO") || desc.includes("MANUTENCAO") ||
       desc.includes("TROCA") || desc.includes("CONSERTO") || desc.includes("REPARO"))
      return "Manutenção";
    if(desc.includes("SERV EXTRA") || desc.includes("SERVIÇO EXTRA") ||
       desc.includes("SERVICO EXTRA") || desc.includes("EXTRA"))
      return "Serviços Extras";
    // Default: segurança/vigia
    return "Segurança e Vigilância";
  }

  // Mão de obra
  if(cat.includes("MÃO DE OBRA") || cat.includes("MAO DE OBRA"))
    return "Mão de Obra";

  // Materiais
  if(cat.includes("AQUISIÇÃO") || cat.includes("AQUISICAO") ||
     cat.includes("FORNECEDOR"))
    return "Material de Construção";

  // Terrenos
  if(cat.includes("TERRENO")) return "Terrenos";

  // Projetos e licenças
  if(cat.includes("PROJETO") || cat.includes("LICENÇA") || cat.includes("LICENCA"))
    return "Projetos e Licenças";

  // Taxas e impostos
  if(cat.includes("IMPOSTO") || cat.includes("TAXA") || cat.includes("CARTÓRIO") ||
     cat.includes("CARTORIO") || cat.includes("REGISTRO"))
    return "Taxas e Impostos";

  // Administrativo
  if(cat.includes("ADM") || cat.includes("ADMINISTR"))
    return "Administração";

  // Manutenção (categoria própria)
  if(cat.includes("MANUTENCAO") || cat.includes("MANUTENÇÃO"))
    return "Manutenção";

  // Serviços extras (categoria própria)
  if(cat.includes("SERV EXTRA") || cat.includes("SERVIÇO EXTRA"))
    return "Serviços Extras";

  // Fallback: usa o texto original capitalizado, limitado a 30 chars
  const clean = catRaw.trim();
  return clean.length > 30
    ? clean.slice(0,28)+"…"
    : clean.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");
}

// Simplifica descrições longas
function normDesc(raw) {
  if(!raw) return "—";
  const s = raw.trim();
  if(/PAGTO?\s+MÃO\s+DE\s+OBRA|PAGTO?\s+MAO\s+DE\s+OBRA/i.test(s)) {
    const folha = s.match(/FOLHA\s+(\d+)/i);
    return folha ? `Folha de Pagamento nº ${folha[1]}` : "Folha de Pagamento";
  }
  if(/PORCELANATO|CERÂMICA|CERAMICA/i.test(s)) return "Material — Revestimento";
  if(/ESQUADRIA|PORTA|JANELA/i.test(s)) return "Material — Esquadrias";
  if(/GUARDA.CORPO/i.test(s)) return "Material — Guarda-corpo";
  if(/MATERIAL\s+KRONA|TUBO|CONEXÃO|CONEXAO/i.test(s)) return "Material — Tubos e Conexões";
  if(/ELÉTRIC|ELETRIC/i.test(s)) return "Material — Elétrico";
  if(/CESSÃO\s+DE\s+POSSE|CESSAO\s+DE\s+POSSE/i.test(s)) return "Cessão de Posse";
  if(/PALLET|PALLETS/i.test(s)) return "Material — Pallets";
  // Trunca descrições muito longas
  return s.length > 60 ? s.slice(0,57)+"…" : s;
}

let _DESPESAS = [];

// Detecta o mapa de colunas pelo cabeçalho — robusto a layouts diferentes
// (export ERP de 32 colunas OU aba curada de ~7 colunas)
function detectCols(allRows, tipo) {
  // fallback: layout ERP clássico
  const fb = tipo === "rec"
    ? { quem:1, data:3, dataVenc:4, desc:8, origem:9, situ:10, valOrig:12, valReceb:14, valTot:18, conta:24, obs:27, cat:28, hdr:-1 }
    : { quem:1, data:3, desc:8, val:18, conta:24, obs:27, cat:28, hdr:-1 };
  for (let i = 0; i < Math.min(6, allRows.length); i++) {
    const row = allRows[i];
    const temData = parseDate(normalizeDate(String(row[3]||"").trim())) || parseDate(normalizeDate(String(row[1]||"").trim()));
    const cells = row.map(c => _audNorm(String(c||"")));
    if (temData) continue;
    const achou = (kws, naoKws) => {
      for (let j = 0; j < cells.length; j++) {
        if (kws.some(k=>cells[j].includes(k)) && !(naoKws||[]).some(k=>cells[j].includes(k))) return j;
      } return -1;
    };
    const quem = achou(["FORNECEDOR","CLIENTE"], ["IDENTIFICADOR","CODIGO"]);
    if (quem < 0) continue; // não é cabeçalho
    const m = { hdr:i };
    m.quem = quem;
    m.data = achou(["DATA DE COMPETENCIA","COMPETENCIA"],[]) >= 0 ? achou(["DATA DE COMPETENCIA","COMPETENCIA"],[]) : achou(["DATA"],["VENCIMENTO","PREVISTA","ULTIMO","PAGAMENTO"]);
    m.desc = achou(["DESCRICAO"],[]);
    m.cat  = achou(["CATEGORIA"],["VALOR NA","CENTRO"]);
    m.obs  = achou(["OBSERVA"],[]);
    if (tipo === "rec") {
      m.origem   = achou(["ORIGEM"],[]);
      m.situ     = achou(["SITUACAO"],[]);
      m.valOrig  = achou(["VALOR ORIGINAL"],[]);
      m.valReceb = achou(["VALOR RECEBIDO"],["TOTAL"]);
      m.valTot   = achou(["VALOR TOTAL RECEBIDO"],[]);
      if (m.valTot < 0) m.valTot = achou(["(R$)","VALOR (R$)"],["ORIGINAL","ABERTO","CATEGORIA","CENTRO"]);
      if (m.valReceb < 0) m.valReceb = m.valTot;
      if (m.valOrig < 0) m.valOrig = m.valTot;
    } else {
      m.val = achou(["VALOR TOTAL PAGO"],[]);
      if (m.val < 0) m.val = achou(["(R$)","VALOR (R$)","VALOR PAGO","VALOR"],["ORIGINAL","ABERTO","CATEGORIA","CENTRO","JUROS","MULTA","DESCONTO"]);
    }
    // aceita só se achou o essencial
    if (m.data >= 0 && m.desc >= 0 && (tipo==="rec" ? m.valReceb>=0 : m.val>=0)) {
      Object.keys(fb).forEach(k => { if (m[k]===undefined || m[k]<0) m[k]=fb[k]; });
      return m;
    }
  }
  return fb;
}

// Parser reutilizável — usado pelo painel atual e pela auditoria comparativa entre obras
function parseDespesasRows(allRows) {
  const M = detectCols(allRows, "desp");
  const rows = allRows.slice(M.hdr + 1);
  return rows
    .map(r => {
      const fornecedor = String(r[M.quem]  || "").trim();
      const data       = normalizeDate(String(r[M.data]  || "").trim());
      const descRaw    = String(r[M.desc]  || "").trim();
      const valor      = Math.abs(parseVal(r[M.val]));
      const obs        = M.obs>=0 ? String(r[M.obs] || "").trim() : "";
      const catRaw     = String(r[M.cat] || "").trim();
      let categoria  = normCat(catRaw, descRaw);
      let reclassDe = null;
      // Regras POR FORNECEDOR confirmadas pelo financeiro — aplicadas aos números
      // do painel (a planilha continua a fonte; o rastro fica na Auditoria)
      if (categoria) {
        const fU = _audNorm(fornecedor);
        if (fU.includes("RAFAEL SANTOS") && !_audNorm(categoria).includes("MAO DE OBRA")) {
          reclassDe = categoria; categoria = "Mão de obra - Terceiros";
        }
      }
      return { fornecedor: fornecedor || "—", data, descricao: normDesc(descRaw),
               descOriginal: descRaw || "—", valor, categoria, obs, reclassDe,
               conta: String(r[M.conta!==undefined?M.conta:24] || "").trim() };
    })
    .filter(r => {
      if (!r.valor || r.valor <= 0) return false;
      if (!r.data || !parseDate(r.data)) return false;
      if (r.categoria === null) return false;
      const desc = (r.descOriginal || "").toUpperCase();
      const cat  = (r.categoria   || "").toUpperCase();
      if (desc.includes("BLOQUEIO SALDO") || desc.includes("BLOQUEIO DE SALDO")) return false;
      if (desc.includes("RETIRA SOC") || desc.startsWith("AFAC")) return false;
      if (cat.includes("RETIRA") || cat.startsWith("AFAC")) return false;
      return true;
    });
}

let _DESP_RETIRADAS = [];
function extractRetiradas(allRows) {
  const M = detectCols(allRows, "desp");
  // Linhas de despesa que são fluxo de sócio: Retirada Sócios / Devolução de AFAC
  return allRows.map(r => {
      const cat = _audNorm(String(r[M.cat]||""));
      const ehFluxoSocio = cat.includes("RETIRADA") || cat.includes("EQUILIBRIO") ||
                           cat.includes("GRATIFICA") || (cat.includes("DEVOLU") && cat.includes("AFAC"));
      if (!ehFluxoSocio) return null;
      return {
        socio: normalizeSocio(String(r[M.quem]||"").trim()),
        data:  normalizeDate(String(r[M.data]||"").trim()),
        valor: Math.abs(parseVal(r[M.val])),
        cat:   cat.includes("DEVOLU") ? "Devolução de AFAC" :
               cat.includes("EQUILIBRIO") ? "Equilíbrio de Aportes" :
               cat.includes("GRATIFICA") ? "Gratificação" : "Retirada Sócios",
      };
    })
    .filter(r => r && r.socio && r.data && r.valor > 0 && parseDate(r.data));
}
window._qualidade = { despDescartadas: [], recDescartadas: [], socioNulo: [] };

let _despFiltros = {
  categoria: "todas",
  fornecedor: "todos",
  ordenacao: "valor_desc",
  busca: "",
  evolucao: "",  // % evolução da obra para estimativa
};

function despFiltered() {
  let arr = [..._DESPESAS];
  if(_despFiltros.categoria !== "todas")
    arr = arr.filter(r => r.categoria === _despFiltros.categoria);
  if(_despFiltros.fornecedor !== "todos")
    arr = arr.filter(r => r.fornecedor === _despFiltros.fornecedor);
  if(_despFiltros.busca) {
    const q = _despFiltros.busca.toLowerCase();
    arr = arr.filter(r =>
      r.fornecedor.toLowerCase().includes(q) ||
      r.descricao.toLowerCase().includes(q) ||
      r.categoria.toLowerCase().includes(q)
    );
  }
  // Ordenação
  const ord = _despFiltros.ordenacao;
  arr.sort((a,b) => {
    if(ord==="valor_desc") return b.valor - a.valor;
    if(ord==="valor_asc")  return a.valor - b.valor;
    if(ord==="data_desc")  return parseDate(b.data) - parseDate(a.data);
    if(ord==="data_asc")   return parseDate(a.data) - parseDate(b.data);
    if(ord==="forn_az")    return a.fornecedor.localeCompare(b.fornecedor,"pt-BR");
    if(ord==="cat_az")     return a.categoria.localeCompare(b.categoria,"pt-BR");
    return 0;
  });
  return arr;
}

// ── Funções de controle dos filtros ──────────────────────────
window.despFiltrarCat = function(v) {

  renderDespesas();
};
window.despFiltrarForn = function(v) {

  renderDespesas();
};
window.despOrdenar = function(v) {

  renderDespesas();
};
window.despSetBusca = function(v) {
  _despFiltros.busca = v;
  clearTimeout(window._despBuscaT);
  window._despBuscaT = setTimeout(() => {
    const sy = window.scrollY;
    renderDespesas();
    const inp = document.getElementById('despBusca');
    if (inp) { const fim = inp.value.length; inp.focus(); try{inp.setSelectionRange(fim, fim);}catch(e){} }
    window.scrollTo(0, sy);
  }, 350);
};
window.despSetEvolucao = function(v) {
  _despFiltros.evolucao = v;
  renderDespesas();
  const inp = document.getElementById("evolucaoInput");

};
window.toggleObs = function(ri) {

  if(row) row.style.display = row.style.display === "none" ? "table-row" : "none";
};

window.despLimparFiltros = function() {
  _despFiltros.categoria  = "todas";
  _despFiltros.fornecedor = "todos";
  _despFiltros.busca      = "";
  renderDespesas();
};


// ════════════════════════════════════════════════════════════════
// MÓDULO CONSOLIDADO — visão dos 3 empreendimentos lado a lado
// ════════════════════════════════════════════════════════════════
window._consolData = null;

// ═══ VOLUME DE COMPRAS — componente didático ═══
let _volGran = 'ano';          // 'ano' | 'mes'
let _volForn = null;           // chave canônica do fornecedor filtrado
const _MESN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function _volFornecedores(R){
  const F={};
  R.forEach(r=>Object.entries(r.porForn||{}).forEach(([fk,v])=>{
    const g=(F[fk]=F[fk]||{nome:v.nome,total:0,n:0,u12:0,obras:{},anos:{},meses:{},pagtos:[]});
    g.total+=v.total; g.n+=v.n; g.u12+=v.u12;
    g.obras[r.key]={nome:r.nome,cor:r.cor,total:v.total};
    (v.pagtos||[]).forEach(p=>g.pagtos.push({...p, obra:r.nome.split(' ')[0], cor:r.cor}));
    Object.entries(v.anos).forEach(([a,x])=>g.anos[a]=(g.anos[a]||0)+x);
    Object.entries(v.meses).forEach(([ym,x])=>g.meses[ym]=(g.meses[ym]||0)+x);
  }));
  return F;
}

window.volSetGran = g => { _volGran = g; volPaint(_volForn); };
window.volSort = c => {
  if (window._volSortF === c) window._volSortDir = -(window._volSortDir||-1);
  else { window._volSortF = c; window._volSortDir = c==='d'||c==='v' ? -1 : 1; }
  volPaint(_volForn);
};
window.volSetForn = fk => {
  _volForn = (fk && fk !== _volForn) ? fk : null;   // 2º clique no mesmo fornecedor OCULTA
  window._volSortF = null;                            // reseta ordenação ao trocar
  volPaint(_volForn);
};

function volPaint(fornKey){
  window._volFornAtual = fornKey || null;
  const R = window._volData; const el = document.getElementById('volCompras');
  if (!R || !el) return;
  const F = window._fornConsol = window._fornConsol && window._volDataRef===R ? window._fornConsol : _volFornecedores(R);
  window._volDataRef = R;
  const g = fornKey ? F[fornKey] : null;
  const tGrupo = R.reduce((s,r)=>s+(r.tDesp||0),0);
  const anoAtual = new Date().getFullYear();

  // séries do escopo (grupo ou fornecedor)
  const anos = {}, meses = {};
  if (g) { Object.assign(anos, g.anos); Object.assign(meses, g.meses); }
  else R.forEach(r=>{ Object.entries(r.porAno||{}).forEach(([a,x])=>anos[a]=(anos[a]||0)+x);
                      Object.entries(r.porMes||{}).forEach(([ym,x])=>meses[ym]=(meses[ym]||0)+x); });
  const totalEscopo = Object.values(anos).reduce((s,v)=>s+v,0);
  const u12 = g ? g.u12 : Object.entries(meses).filter(([ym])=>{
      const d=new Date(Math.floor(ym/100), ym%100-1, 15); return (new Date()-d)<366*86400000;
    }).reduce((s,[,v])=>s+v,0);

  // avisos por obra sem despesas (filtro na planilha)
  const zeradas = R.filter(r=>(r.tDesp||0)===0);

  // barras
  const serie = _volGran==='ano'
    ? Object.keys(anos).sort().map(a=>({label:a, chave:+a, val:anos[a]}))
    : Object.keys(meses).map(Number).sort((a,b)=>a-b).slice(-24).map(ym=>({label:_MESN[ym%100-1]+"/"+String(ym).slice(2,4), chave:ym, val:meses[ym]}));
  const maxV = Math.max(1,...serie.map(s=>s.val));
  const stack = chave => R.map(r=>{
    let v = 0;
    if (g) { const pf = (r.porForn||{})[fornKey]; if (pf) v = ((_volGran==='ano' ? pf.anos[chave] : pf.meses[chave]) || 0); }
    else v = ((_volGran==='ano' ? r.porAno[chave] : r.porMes[chave]) || 0);
    return {cor:r.cor, nome:r.nome, v};
  });

  const b=(l,v,s,c)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}</div><div class="kpi-value" style="color:${c};font-size:20px">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
  const top=Object.entries(F).sort((a,b)=>b[1].total-a[1].total).slice(0,40);

  el.innerHTML = `
    <div class="section-title" style="margin-top:24px">💪 Volume de Compras — Poder de Negociação${hintIcon("Pagamentos a fornecedores das três obras (fluxos de sócio excluídos). Clique num fornecedor para filtrar tudo por ele; alterne entre visão anual e mensal. Fornecedores com grafias diferentes entre obras são unificados.")}</div>
    ${zeradas.length?`<div class="info-box" style="border:1px solid #BF6B6066;background:#BF6B600d;margin-bottom:12px"><span style="color:#BF6B60">⚠</span><div><strong>${zeradas.map(r=>r.nome).join(' e ')}</strong> retornaram ZERO despesas — quase certamente há <strong>filtro ativo</strong> na aba DESPESAS TOTAIS dessa(s) planilha(s). Dados → Remover filtro, depois ↻ Atualizar.</div></div>`:''}

    ${g?`<div class="info-box" style="border:1px solid #6D9E7F66;background:#6D9E7F0d;margin-bottom:12px">
        <span style="color:#6D9E7F;font-size:16px">🔎</span>
        <div style="flex:1"><strong>Filtrado por: ${g.nome}</strong> · presente em ${Object.keys(g.obras).length} obra(s) · ${g.n} pagamentos</div>
        <button onclick="volSetForn(null)" style="background:#21262d;color:#e6edf3;border:1px solid #1A1A1D;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px">✕ limpar</button>
      </div>`:''}

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      ${b(g?'1 · Total com este fornecedor desde o início':'Gasto total do grupo desde o início', fmt(totalEscopo), g?((g.total/tGrupo*100).toFixed(1)+'% de tudo que o grupo compra'):'3 obras somadas', '#6D9E7F')}
      ${b(g?'2 · Com ele em '+anoAtual:'Gasto do grupo em '+anoAtual, fmt(anos[anoAtual]||0), '', '#6C8FB5')}
      ${b('Últimos 12 meses', fmt(u12), 'média '+fmt(u12/12)+'/mês', '#C4A55C')}
    </div>

    <div style="display:flex;gap:8px;margin:14px 0 8px">
      <button onclick="volSetGran('ano')" style="flex:0;white-space:nowrap;background:${_volGran==='ano'?'#6C8FB5':'#21262d'};color:#fff;border:0;border-radius:6px;padding:6px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px">Ano a ano</button>
      <button onclick="volSetGran('mes')" style="flex:0;white-space:nowrap;background:${_volGran==='mes'?'#6C8FB5':'#21262d'};color:#fff;border:0;border-radius:6px;padding:6px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px">Mês a mês</button>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;margin-bottom:12px">
      <div class="mini-bars" style="height:140px;align-items:flex-end">
        ${serie.map(s=>{
          const partes=stack(s.chave);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">
            <div style="font-size:8px;color:#c9d1d9;font-family:'DM Mono',monospace;white-space:nowrap">${s.val>=1e6?(s.val/1e6).toFixed(1).replace('.',',')+'M':s.val>=1000?Math.round(s.val/1000)+'k':''}</div>
            <div style="width:${_volGran==='ano'?'55%':'70%'};height:105px;display:flex;flex-direction:column-reverse" title="${s.label}: ${fmt(s.val)}">
              ${partes.map(p=>`<div style="height:${(p.v/maxV*100).toFixed(1)}%;background:${p.cor};opacity:.92" title="${p.nome}: ${fmt(p.v)}"></div>`).join('')}
            </div>
            <div style="font-size:${_volGran==='ano'?'9':'7'}px;color:#A1A1A6;font-family:'DM Mono',monospace;white-space:nowrap">${s.label}</div>

// ═══ Motores de gráfico SVG — referência visual v3 (sem dependência externa) ═══
function fxEsc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fxK(v){ var a=Math.abs(v);
  if (a>=1e6) return 'R$ '+(v/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' mi';
  if (a>=1e3) return 'R$ '+(v/1e3).toFixed(0)+' mil';
  return 'R$ '+Math.round(v); }
function fxPct(v){ return (v>0?'+':'')+v.toFixed(1).replace('.',',')+'%'; }
// Escala real: o SVG é desenhado na largura de pixels do container, então textos e
// traços têm o tamanho verdadeiro em qualquer tela (antes o viewBox fixo esticava tudo).
function fxDim(alvo){
  var w = (alvo && alvo.clientWidth) || 0;
  if (!w) w = 680;
  var W = Math.max(300, Math.min(1180, Math.round(w)));
  var H = Math.round(Math.max(190, Math.min(300, W * 0.34)));
  return {W:W, H:H};
}
// Interpolação cúbica monotônica (Fritsch–Carlson): curva fluida que NUNCA extrapola
// os pontos reais — essencial em série financeira, onde um vale falso mentiria.
function fxCaminhoSuave(pts){
  var n = pts.length;
  if (n < 2) return n ? 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1) : '';
  if (n === 2) return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+','+pts[1][1].toFixed(1);
  var d = [], m = [], i;
  for (i = 0; i < n-1; i++) d.push((pts[i+1][1]-pts[i][1])/(pts[i+1][0]-pts[i][0] || 1));
  m.push(d[0]);
  for (i = 1; i < n-1; i++) m.push(d[i-1]*d[i] <= 0 ? 0 : (d[i-1]+d[i])/2);
  m.push(d[n-2]);
  for (i = 0; i < n-1; i++){
    if (d[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    var a = m[i]/d[i], b = m[i+1]/d[i], s = a*a + b*b;
    if (s > 9){ var t = 3/Math.sqrt(s); m[i] = t*a*d[i]; m[i+1] = t*b*d[i]; }
  }
  var p = 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for (i = 0; i < n-1; i++){
    var dx = (pts[i+1][0]-pts[i][0])/3;
    p += ' C'+(pts[i][0]+dx).toFixed(1)+','+(pts[i][1]+m[i]*dx).toFixed(1)
       + ' '+(pts[i+1][0]-dx).toFixed(1)+','+(pts[i+1][1]-m[i+1]*dx).toFixed(1)
       + ' '+pts[i+1][0].toFixed(1)+','+pts[i+1][1].toFixed(1);
  }
  return p;
}

function fxLinhas(alvo, cfg){
  if(!alvo) return;

  var D = fxDim(alvo), W = D.W, H = D.H, P = {l:56, r:12, t:12, b:24};

  var todos=S.reduce(function(a,s){return a.concat(s.values);},[]);
  var max=Math.max.apply(null,todos)*1.1||1;
  var x=function(i){ return P.l+i*(W-P.l-P.r)/Math.max(L.length-1,1); };
  var y=function(v){ return H-P.b-(v/max)*(H-P.t-P.b); };

    g+='<text x="'+(P.l-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" class="ax">'+fm(v)+'</text>'; }

    g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="ax">'+fxEsc(l)+'</text>'; });

                     : fxCaminhoSuave(pts);

function fxBarras(alvo, cfg){

  var todos=S.reduce(function(a,s){return a.concat(s.values);},[]);
  var max=Math.max.apply(null,todos)*1.15||1;
  var faixa=(W-P.l-P.r)/G.length, larg=Math.max(3, Math.min(30,(faixa*.66)/S.length));
  var y=function(v){ return H-P.b-(v/max)*(H-P.t-P.b); };
  var fm=cfg.fmt||fxK, g='';
  for(var t=0;t<=4;t++){ var v=max*t/4, yy=y(v);
    g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="rgba(255,255,255,.06)"/>';
    g+='<text x="'+(P.l-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" class="ax">'+fm(v)+'</text>'; }
  var passo = cfg.cada || Math.max(1, Math.ceil(G.length/Math.max(4, Math.floor(W/110))));
  G.forEach(function(nome,i){
    var centro=P.l+faixa*i+faixa/2, x0=centro-(larg*S.length)/2;

}

function detectarDispositivo(){
  if (_devOverride) return _devOverride;
  // mq() blindado: navegador antigo ou ambiente sem matchMedia não pode derrubar o painel
  var mq = function(q){ try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch(e){ return false; } };
  var largura  = (window.innerWidth || document.documentElement.clientWidth || 1200);
  var estreito = mq('(max-width: 899px)') || largura <= 899;
  var toque    = mq('(pointer: coarse)');
  var semHover = mq('(hover: none)');
  return (estreito || (toque && semHover)) ? 'mobile' : 'desktop';

function classificarReembolso(desc, cliente){
  const d = String(desc||''), c = String(cliente||'');

function renderReceitas() {
  const el = document.getElementById('tab16');

  const hoje = new Date();
  const somaOrig  = a => a.reduce((s,r)=>s+(r.valOrig||0),0);
  const somaReceb = a => a.reduce((s,r)=>s+(r.valReceb||0),0);
  const aberto    = r => Math.max(0,(r.valOrig||0)-(r.valReceb||0));
  const totalReceb = somaReceb(R);

  // ── categorias da planilha (mesma lógica da aba de despesas) ──
  const catTotals = {}, catN = {};
  R.forEach(r=>{ const c = r.cat || '(sem categoria)';
    catTotals[c] = (catTotals[c]||0) + (r.valReceb||0); catN[c] = (catN[c]||0)+1; });
  const catList = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const maiorCat = catList[0] || ['—',0];

  // ── natureza (classificação do painel) ──
  const TIPOS = ['Venda','INCC','VendaDistratada','Personalizacao','Comissao','Reembolso','Bonificacao','Rateio','OutraReceita'];
  const tipoTotals = TIPOS.map(t=>({ t, v: somaReceb(R.filter(r=>r.tipo===t)), n: R.filter(r=>r.tipo===t).length })).filter(x=>x.n>0);

  // ── série mensal, variação e projeção (espelha a aba de despesas) ──
  const mMap = {};
  R.forEach(r=>{ const d=parseDate(r.dataComp); if(!d) return;
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    mMap[k] = (mMap[k]||0) + (r.valReceb||0); });
  const mks = Object.keys(mMap).sort();

// ═══════════════════════════════════════════════════════════════════
// 🏦 EVOLUÇÃO DE CAIXA
// Regra do que é caixa: só movimento que de fato entrou ou saiu da conta.
// ENTRA  → receitas recebidas, aportes de sócio, rendimento de aplicação
// SAI    → despesas pagas, retiradas de sócio
// FORA   → transferência entre contas, aplicação e resgate (movem dinheiro
//          entre bolsos da mesma empresa, não alteram o caixa consolidado)
// Nota apurada nos dados: reembolso aparece nos dois lados com o mesmo valor,
// mas em DATAS DIFERENTES — é o dinheiro que saiu e voltou dias depois. São
// dois movimentos reais de caixa e ambos entram.
// ═══════════════════════════════════════════════════════════════════
const CX_TRANSFERENCIA = /TRANSFER[EÊ]NCIA ENTRE CONTAS|TRANSF\.? ENTRE CONTAS|ENTRE CONTAS|MOVIMENTA[CÇ][AÃ]O INTERNA|APLICA[CÇ][AÃ]O FINANCEIRA|RESGATE DE APLICA|APLICA[CÇ][AÃ]O AUTOM|SALDO INICIAL/i;
function cxEhTransferencia(txt, cat){
  return CX_TRANSFERENCIA.test(String(txt||'')) || CX_TRANSFERENCIA.test(String(cat||''));
}
function cxYM(d){ return d.getFullYear()*100 + (d.getMonth()+1); }
function cxLabel(ym){ return MESES[(ym%100)-1] + '/' + String(Math.floor(ym/100)).slice(2); }

// Constrói a série mensal de caixa de um empreendimento.
function caixaSerie(desp, rec, aportes, retiradas, rendimentos){
  const M = {};   // ym → {vendas, outras, aporte, rendimento, obra, socio, admin...}
  const zero = () => ({ vendas:0, outrasRec:0, aporte:0, rendimento:0,
                        obra:0, comercial:0, tributo:0, socio:0, permuta:0, distrato:0, outrasDesp:0,
                        entrada:0, saida:0, excluido:0, baixa:0 });
  const put = (ym) => (M[ym] = M[ym] || zero());
  const excl = { n:0, v:0 };
  const baixa = { n:0, v:0 };
  // Situação do extrato: só CONCILIADO é dinheiro confirmado no banco. QUITADO foi
  // baixado no sistema mas ainda não bateu com o extrato, e ATRASADO simplesmente não
  // foi pago — contá-los inflava o caixa. Registros sem situação (fonte antiga) entram,
  // para não quebrar quem ainda não tem o extrato.
  const pend = { quitN:0, quitV:0, atrN:0, atrV:0 };
  const confirmado = r => {
    const s = r.situacao;
    if (!s) return true;
    if (/CONCILIADO/i.test(s)) return true;
    const v = (r.valor || r.valReceb || 0);
    const sinal = (r.valReceb !== undefined) ? 1 : -1;
    if (/ATRASAD/i.test(s)) { pend.atrN++; pend.atrV += v*sinal; }
    else { pend.quitN++; pend.quitV += v*sinal; }
    return false;
  };

  (rec||[]).forEach(r=>{
    const d = parseDate(r.dataComp||r.data); if(!d) return;
    const v = r.valReceb||0; if(!(v>0)) return;
    if (cxEhTransferencia(r.desc, r.cat)) { excl.n++; excl.v+=v; put(cxYM(d)).excluido+=v; return; }
    if (r.baixaSemCaixa) { baixa.n++; baixa.v+=v; put(cxYM(d)).baixa+=v; return; }
    if (!confirmado(r)) return;
    const m = put(cxYM(d));
    if (r.grupo === 'venda' || /Venda|INCC/i.test(r.tipo||'')) m.vendas += v; else m.outrasRec += v;
    m.entrada += v;
  });
  (aportes||[]).forEach(a=>{ const d=parseDate(a.data); if(!d || !confirmado(a)) return;
    const m=put(cxYM(d)); m.aporte+=a.valor; m.entrada+=a.valor; });
  (rendimentos||[]).forEach(r=>{ const d=parseDate(r.data); if(!d || !confirmado(r)) return;
    const v=r.valor||r.valReceb||0; const m=put(cxYM(d)); m.rendimento+=v; m.entrada+=v; });

  (desp||[]).forEach(r=>{
    const d = parseDate(r.data); if(!d) return;
    const v = r.valor||0; if(!(v>0)) return;
    if (cxEhTransferencia(r.descOriginal||r.descricao, r.categoria)) { excl.n++; excl.v+=v; put(cxYM(d)).excluido+=v; return; }
    if (!confirmado(r)) return;
    const m = put(cxYM(d)); const c = _audNorm(r.categoria||'');
    if (/PERMUTA/.test(c)) m.permuta += v;
    else if (/DISTRATO/.test(c)) m.distrato += v;
    else if (/COMISS|MARKETING/.test(c)) m.comercial += v;
    else if (/IMPOSTO|TRIBUT|TAXA|TARIFA|CARTOR/.test(c)) m.tributo += v;
    else if (isCustoObra(r.categoria||'')) m.obra += v;
    else m.outrasDesp += v;
    m.saida += v;
  });
  (retiradas||[]).forEach(r=>{ const d=parseDate(r.data); if(!d || !confirmado(r)) return;
    const m=put(cxYM(d)); m.socio+=r.valor; m.saida+=r.valor; });

  // preenche os meses sem movimento, para a curva não dar saltos falsos
  const yms = Object.keys(M).map(Number).sort((a,b)=>a-b);
  if (!yms.length) return { linhas:[], excl, baixa, pend };
  const linhas = [];
  let saldo = 0, saldoOp = 0;
  let y = Math.floor(yms[0]/100), mo = yms[0]%100;
  const fim = yms[yms.length-1];
  while (y*100+mo <= fim){
    const ym = y*100+mo;
    const m = M[ym] || zero();
    const res = m.entrada - m.saida;
    // caixa operacional: sem aporte e sem retirada de sócio — mostra se a obra se paga
    const resOp = (m.entrada - m.aporte) - (m.saida - m.socio);
    saldo += res; saldoOp += resOp;
    linhas.push(Object.assign({ ym, res, saldo, resOp, saldoOp }, m));
    mo++; if(mo>12){ mo=1; y++; }
  }
  return { linhas, excl, baixa, pend };
}

// Normaliza o nome da conta bancária do ERP para os apelidos que a gestão usa.
function cxConta(nome){
  const s = _audNorm(nome||'');
  if (!s) return 'Sem conta informada';
  if (/CORA/.test(s)) return 'Cora';
  if (/\bAPL\b|APLICAC/.test(s)) return 'Aplicação';
  if (/OFICIAL|CAIXA \d|3418|\bCEF\b/.test(s)) return 'Caixa (CEF)';
  return String(nome).trim().slice(0,34);
}
// Saldo apurado por conta, a partir dos lançamentos.
function cxPorConta(desp, rec, aportes, rendimentos){
  const m = {};
  const put = c => (m[c] = m[c] || { entrada:0, saida:0, nE:0, nS:0 });
  (rec||[]).forEach(r=>{ const v=r.valReceb||0; if(!(v>0)) return;
    const g=put(cxConta(r.conta)); g.entrada+=v; g.nE++; });
  (aportes||[]).forEach(a=>{ const g=put(cxConta(a.conta)); g.entrada+=a.valor; g.nE++; });
  (rendimentos||[]).forEach(a=>{ const g=put(cxConta(a.conta)); g.entrada+=(a.valor||0); g.nE++; });
  (desp||[]).forEach(r=>{ const v=r.valor||0; if(!(v>0)) return;
    const g=put(cxConta(r.conta)); g.saida+=v; g.nS++; });
  return Object.entries(m).map(([c,g])=>Object.assign({conta:c, saldo:g.entrada-g.saida}, g))
                          .sort((a,b)=>b.saldo-a.saldo);
}

// ═══════════════════════════════════════════════════════════════════
// GRÁFICO DEDICADO DE CAIXA
// O motor genérico assume valores positivos: escala do zero ao máximo. Saldo de
// caixa vai a negativo, e ali a curva saía do quadro. Este desenha a escala real
// (mínimo ao máximo), marca a linha do zero, pinta a área acima e abaixo dela com
// cores distintas e destaca pico e vale. Largura mínima por ponto para o eixo do
// tempo ficar legível — o container rola na horizontal quando não cabe.
// ═══════════════════════════════════════════════════════════════════
function fxCaixaSerie(alvo, cfg){
  if (!alvo) return;
  const L = cfg.labels||[], S = cfg.series||[];
  if (!L.length || !S.length) { alvo.innerHTML = '<div style="color:var(--text-3);font-size:12px;padding:18px 0">Sem dados no período.</div>'; return; }
  const larguraCont = alvo.parentElement ? alvo.parentElement.clientWidth : 700;
  const pxPonto = cfg.pxPonto || 34;
  const W = Math.max(larguraCont - 2, L.length * pxPonto);
  const H = cfg.altura || 250;
  const P = { l:62, r:14, t:16, b:34 };
  alvo.style.width = W + 'px';
  const todos = S.reduce((a,s)=>a.concat(s.values), []);
  let max = Math.max.apply(null, todos), min = Math.min.apply(null, todos);
  if (max === min) { max = max + 1; min = min - 1; }
  const folga = (max - min) * 0.12;
  max += folga; min -= folga;
  if (min > 0) min = 0;                       // o zero sempre visível
  const x = i => P.l + i*(W-P.l-P.r)/Math.max(L.length-1,1);
  const y = v => H - P.b - ((v-min)/(max-min))*(H-P.t-P.b);
  const y0 = y(0);
  let g = '';
  // grade e eixo de valores
  for (let t=0; t<=4; t++){
    const v = min + (max-min)*t/4, yy = y(v);
    g += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" class="fxg"/>'
       + '<text x="'+(P.l-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" class="ax">'+fxK(v)+'</text>';
  }
  // linha do zero, destacada
  if (min < 0) g += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'" class="fxzero"/>';
  // eixo do tempo: rótulo a cada N, conforme o espaço real
  const passo = Math.max(1, Math.ceil(L.length / Math.max(4, Math.floor((W-P.l-P.r)/58))));
  L.forEach((l,i)=>{
    // o último rótulo só entra se não colidir com o anterior
    const ehUltimo = i === L.length-1;
    const marcado = i % passo === 0;
    if (!marcado && !(ehUltimo && (L.length-1) % passo > passo*0.6)) return;
    if (marcado && ehUltimo === false || ehUltimo) {}
    g += '<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+(ehUltimo?'end':'middle')+'" class="ax">'+fxEsc(l)+'</text>';
  });
  // séries
  S.forEach((s,si)=>{
    const pts = s.values.map((v,i)=>[x(i), y(v)]);
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if (s.area !== false && si === 0) {
      // área positiva e negativa com cores próprias
      const area = d + ' L'+pts[pts.length-1][0].toFixed(1)+' '+y0.toFixed(1)+' L'+pts[0][0].toFixed(1)+' '+y0.toFixed(1)+' Z';
      const cid = 'cxclip'+si+Math.floor(Math.random()*99999);
      g += '<defs>'
         + '<clipPath id="'+cid+'p"><rect x="0" y="0" width="'+W+'" height="'+y0.toFixed(1)+'"/></clipPath>'
         + '<clipPath id="'+cid+'n"><rect x="0" y="'+y0.toFixed(1)+'" width="'+W+'" height="'+(H-y0).toFixed(1)+'"/></clipPath>'
         + '</defs>'
         + '<path d="'+area+'" fill="rgba(109,158,127,.20)" clip-path="url(#'+cid+'p)"/>'
         + '<path d="'+area+'" fill="rgba(191,107,96,.22)" clip-path="url(#'+cid+'n)"/>';
    }
    g += '<path d="'+d+'" fill="none" stroke="'+(s.color||'#6C8FB5')+'" stroke-width="'+(s.largura||2.2)+'"'
       + (s.tracejada ? ' stroke-dasharray="5 4"' : '') + ' stroke-linejoin="round" stroke-linecap="round"/>';
  });
  // pico e vale da série principal
  if (cfg.marcos !== false && S[0]) {
    const v0 = S[0].values;
    const iMax = v0.indexOf(Math.max.apply(null, v0)), iMin = v0.indexOf(Math.min.apply(null, v0));
    [[iMax,'#6C8FB5','pico'],[iMin, v0[iMin]<0?'#BF6B60':'#8E7FA8','menor']].forEach(([i,c,rot])=>{
      if (i < 0) return;
      const px = x(i), py = y(v0[i]);
      const anc = px > W-110 ? 'end' : 'start', dx = anc==='end' ? -7 : 7;
      g += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.4" fill="'+c+'"/>'
         + '<text x="'+(px+dx).toFixed(1)+'" y="'+(py-8).toFixed(1)+'" text-anchor="'+anc+'" class="ax" style="font-weight:600;fill:'+c+'">'+rot+' '+fxK(v0[i])+'</text>';
    });
  }
  alvo.innerHTML = '<svg class="chart chart-cx" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="none" role="img" aria-label="'+fxEsc(cfg.alt||'saldo de caixa')+'">'+g+'</svg>';
  // abre já no fim da série, que é o que interessa
  if (cfg.rolarAoFim !== false && alvo.parentElement) {
    requestAnimationFrame(()=>{ alvo.parentElement.scrollLeft = alvo.parentElement.scrollWidth; });
  }
}

// Agrupa a série mensal em trimestre ou ano, para caber a visão do período inteiro.
let _cxGran = 'mes';
window.cxGran = function(g){ _cxGran = g; renderCaixa();
  const el=document.getElementById('tab18'); if(el) el.scrollIntoView({block:'start'}); };
function cxAgrupar(linhas, gran){
  if (gran === 'mes') return linhas.map(l=>({ rot: cxLabel(l.ym), saldo:l.saldo, saldoOp:l.saldoOp,
                                              entrada:l.entrada, saida:l.saida }));
  const tam = gran === 'ano' ? 12 : 3;
  const out = [], chave = l => gran==='ano' ? Math.floor(l.ym/100)
                                            : Math.floor(l.ym/100)+'-T'+Math.ceil((l.ym%100)/3);
  let atual = null;
  linhas.forEach(l=>{
    const k = chave(l);
    if (!atual || atual.k !== k) { atual = { k, rot: gran==='ano'? String(k) : String(k).replace('-',' '),
      entrada:0, saida:0, saldo:l.saldo, saldoOp:l.saldoOp }; out.push(atual); }
    atual.entrada += l.entrada; atual.saida += l.saida;
    atual.saldo = l.saldo; atual.saldoOp = l.saldoOp;   // saldo é posição: vale o último do grupo
  });
  return out;
}

function renderCaixa(){
  const el = document.getElementById('tab18');
  if (!el) return;
  const S = caixaSerie(_DESPESAS, _RECEITAS, _APORTES, _RETIRADAS,
                       (typeof _RENDIMENTOS!=='undefined'? _RENDIMENTOS : []));
  const L = S.linhas;
  if (!L.length){ el.innerHTML = '<div class="info-box">Sem movimento de caixa carregado.</div>'; return; }

  const hoje = new Date(), ymH = cxYM(hoje);
  const fechados = L.filter(x=>x.ym < ymH);
  const atual = L[L.length-1];
  const pico = L.reduce((a,b)=> b.saldo>a.saldo? b:a, L[0]);
  const vale = L.reduce((a,b)=> b.saldo<a.saldo? b:a, L[0]);
  const negativos = L.filter(x=>x.saldo < 0);
  const u6 = fechados.slice(-6);
  const entradaMed = u6.length? u6.reduce((s,x)=>s+x.entrada,0)/u6.length : 0;
  const saidaMed   = u6.length? u6.reduce((s,x)=>s+x.saida,0)/u6.length : 0;
  const queima = saidaMed - entradaMed;
  const cobertura = queima>0 ? atual.saldo/queima : null;
  const totEnt = L.reduce((s,x)=>s+x.entrada,0), totSai = L.reduce((s,x)=>s+x.saida,0);
  // Caixa médio: média dos saldos de fechamento. É a posição típica da tesouraria,
  // não o saldo de um dia. Serve para dimensionar reserva e comparar obras.
  const medSaldo = arr => arr.length ? arr.reduce((s,x)=>s+x.saldo,0)/arr.length : 0;
  const u12 = fechados.slice(-12);
  const caixaMedio = medSaldo(fechados.length? fechados : L);
  const caixaMedio12 = medSaldo(u12.length? u12 : fechados);
  const entradaMedTot = L.length ? totEnt/L.length : 0, saidaMedTot = L.length ? totSai/L.length : 0;
  const totAporte = L.reduce((s,x)=>s+x.aporte,0), totVendas = L.reduce((s,x)=>s+x.vendas,0);
  const depAporte = totEnt>0 ? totAporte/totEnt*100 : 0;
  const mesesPos = fechados.filter(x=>x.resOp>0).length;

  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c}">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;

  el.innerHTML = `
    <div class="info-box" style="border:1px solid #6C8FB540;margin-bottom:12px"><span>🏦</span><div><strong>Evolução de caixa de ${CFG.nome}.</strong>
    Entram: recebimentos de venda, aportes de sócio e rendimento de aplicação. Saem: despesas pagas e retiradas de sócio.
    Ficam fora transferências entre contas e aplicação/resgate, que movem dinheiro entre bolsos da mesma empresa sem alterar o caixa.
    ${S.excl.n? '<strong>'+S.excl.n+' lançamento(s)</strong> ('+fmt(S.excl.v)+') foram excluídos por essa regra.' : ''}
    ${(S.pend && (S.pend.quitN||S.pend.atrN))? '<br><br><strong>O saldo conta apenas o que está CONCILIADO com o banco.</strong> Ficam de fora '
      + (S.pend.quitN? S.pend.quitN+' lançamento(s) baixado(s) no sistema e ainda não conciliado(s), efeito líquido '+fmt(S.pend.quitV) : '')
      + (S.pend.quitN && S.pend.atrN ? ', e ' : '')
      + (S.pend.atrN? S.pend.atrN+' em atraso, efeito líquido '+fmt(S.pend.atrV) : '') + '.' : ''}
    ${S.baixa.n? '<br><br><strong style="color:#C4A55C">'+S.baixa.n+' parcela(s) finais de contrato distratado, somando '+fmt(S.baixa.v)+', também ficaram fora.</strong> São a baixa do saldo devedor no encerramento do contrato — o sistema exporta como recebido, mas não houve entrada de dinheiro.' : ''}
    O saldo parte de zero na abertura da SPE — é a posição construída pelos próprios lançamentos, não um extrato bancário.</div></div>

    <div class="kpi-grid">
      ${k('Caixa hoje', fmt(atual.saldo), cxLabel(atual.ym)+' · '+(atual.saldo>=0?'positivo':'NEGATIVO'), atual.saldo>=0?'#6D9E7F':'#BF6B60')}
      ${k('Pico de caixa', fmt(pico.saldo), cxLabel(pico.ym), '#6C8FB5')}
      ${k('Menor caixa', fmt(vale.saldo), cxLabel(vale.ym)+(negativos.length? ' · '+negativos.length+' mês(es) negativo(s)':''), vale.saldo<0?'#BF6B60':'#8E7FA8')}
      ${k('Queima líquida', queima>0? fmt(queima)+'/mês' : 'gera caixa', queima>0? 'média dos 6 meses fechados' : 'entradas superam saídas', queima>0?'#C09257':'#6D9E7F','Saída média menos entrada média nos últimos seis meses fechados. Positivo significa que o caixa encolhe todo mês.')}
    </div>

      ${k('Cobertura de caixa', cobertura===null? '—' : (cobertura>=99? '> 8 anos' : cobertura.toFixed(1)+' meses'), cobertura===null? 'não há queima' : 'quanto o saldo aguenta no ritmo atual', cobertura!==null&&cobertura<3?'#BF6B60':cobertura!==null&&cobertura<6?'#C09257':'#6D9E7F','Saldo atual dividido pela queima média. Abaixo de três meses é zona de atenção: qualquer atraso de recebimento vira aperto.')}

      ${k('Meses com caixa operacional positivo', mesesPos+' de '+fechados.length, ((mesesPos/Math.max(1,fechados.length))*100).toFixed(0)+'% dos meses fechados', mesesPos/Math.max(1,fechados.length)>0.5?'#6D9E7F':'#C09257','Caixa operacional exclui aporte e retirada: mede se a operação se paga com o que ela mesma gera.')}
      ${k('Entradas × saídas no total', fmt(totEnt)+' / '+fmt(totSai), 'resultado acumulado '+fmt(totEnt-totSai), (totEnt-totSai)>=0?'#6D9E7F':'#BF6B60')}
    </div>
    <div class="kpi-grid" style="margin-top:6px">

      ${k('Caixa médio — 12 meses', fmt(caixaMedio12), u12.length+' meses mais recentes', caixaMedio12>=0?'#6D9E7F':'#BF6B60')}
      ${k('Entrada média por mês', fmt(entradaMedTot), 'sobre '+L.length+' meses de série', '#6D9E7F')}
      ${k('Saída média por mês', fmt(saidaMedTot), 'sobre '+L.length+' meses de série', '#BF6B60')}
    </div>

    ${negativos.length? `<div class="info-box" style="border:1px solid #BF6B6066;background:rgba(191,107,96,.06);margin-top:10px"><span style="color:#BF6B60">⚠</span><div><strong>Caixa ficou negativo em ${negativos.length} mês(es).</strong> ${negativos.slice(0,6).map(x=>cxLabel(x.ym)+' ('+fmt(x.saldo)+')').join(' · ')}${negativos.length>6?' …':''}<br><span style="font-size:11px;color:var(--muted)">Saldo negativo aqui significa que os lançamentos consomem mais do que entrou desde a abertura. Ou houve aporte não registrado, ou a obra operou com recurso de terceiros no período.</span></div></div>`:''}

    <div class="cx-card">
      <div class="cx-topo">
        <div class="cx-titulo">Saldo de caixa ao longo do tempo${hintIcon('A linha azul é o caixa total; a verde tracejada exclui aporte e retirada de sócio, mostrando se a obra se paga sozinha. Área verde acima do zero, vermelha abaixo. Arraste o gráfico para percorrer o período.')}</div>
        <div class="cx-gran no-print">
          ${['mes','tri','ano'].map(g=>`<button onclick="cxGran('${g}')" class="${_cxGran===g?'on':''}">${g==='mes'?'Mês':g==='tri'?'Trimestre':'Ano'}</button>`).join('')}
        </div>
      </div>
      <div class="legend"><span><i style="background:#6C8FB5"></i>Caixa total</span><span><i style="background:#6D9E7F"></i>Operacional, sem sócio</span></div>
      <div class="cx-scroll"><div id="g_cx_saldo"></div></div>
      <div class="cx-dica no-print">${_cxGran==='mes'? L.length+' meses · arraste para o lado para percorrer, ou troque para trimestre e ano para ver tudo de uma vez' : 'visão agrupada — volte para Mês para o detalhe'}</div>
    </div>
    <div class="cx-card">
      <div class="cx-titulo" style="margin-bottom:8px">Entradas e saídas por ${_cxGran==='mes'?'mês':_cxGran==='tri'?'trimestre':'ano'}${hintIcon('Onde a barra vermelha supera a verde, o período consumiu caixa.')}</div>
      <div class="legend"><span><i style="background:#6D9E7F"></i>Entradas</span><span><i style="background:#BF6B60"></i>Saídas</span></div>
      <div class="cx-scroll"><div id="g_cx_fluxo"></div></div>
    </div>

    ${(function(){
      const PC = cxPorConta(_DESPESAS, _RECEITAS, _APORTES, (typeof _RENDIMENTOS!=='undefined'? _RENDIMENTOS:[]));
      if (!PC.length) return '';
      const reais = cxReais();

// ═══════════ 🚜 TERRAPLANAGEM, ARRIMO E MÁQUINAS — exclusivo Bossa Nova ═══════════
// Escopo declarado: movimento de terra e operação de máquinas. Areia e brita NÃO entram
// (são material de construção, não terraplanagem) — foi o erro que a primeira leitura cometeu.
// Escopo conforme as regras do negócio (Ítalo, 28/07):
// MATERIAIS de terraplanagem: aterro, areia do morro, piçarra. Areia grossa NÃO entra.
// EQUIPAMENTO/SERVIÇO: pá mecânica, rolo compactador, carro/caminhão pipa, aluguel de
// caçamba, encarregado de terraplanagem, abastecimento de máquinas.
// FORNECEDORES de referência: EGEN, SAXUM, VANDERLEI.
const TP_MAT  = /\bATERROS?\b|AREIA DO MORRO|PICARRA/;
const TP_EQUIP= /PA MECANICA|PA CARREGADEIRA|ROLO COMPACTADOR|COMPACTADOR|CARRO PIPA|CAMINHAO PIPA|\bPIPA\b|ALUGUEL DE CACAMBA|\bCACAMBA\b|ENCARREGADO DE TERRAPLA|MOTONIVELADORA|PATROL|\bRETRO\b|MINI RETRO|ESCAVADEIRA|ESCAVA|\bTRATOR\b|TERRAPLA|BOTA[- ]?FORA|DESMATAMENT|LIMPEZA (DE )?TERRENO|ALUGUEL DE MAQUINAS/;
const TP_FORN = /\bEGEN\b|SAXUM|VANDERLEI/;
// areia grossa/fina e brita são material de obra, não de terraplanagem
const TP_NAO  = /AREIA GROSSA|AREIA FINA|\bBRITA\b|PO DE PEDRA|AREIA LAVADA/;
const TP_COMB = /ABASTECIMENTO (EQUIPAMENTO|MAQUIN|COMPACTADOR|RETRO|TRATOR|PA )|COMBUSTIVEL.*(MAQUIN|EQUIPAMENT)/;
// Exclusões definidas pela direção (28/07):
// · MEGALOC não entra em nada — o que eles alugam (escoras, compactador de pequeno
//   porte) é para serviço pontual de obra, não terraplanagem.
// · Serviço com MENOS DE 5 DIÁRIAS de máquina é serviço pontual de obra, não terraplanagem.
// · JS LOCAÇÕES é custo de DESMEMBRAMENTO do terreno, não terraplanagem.
// Fornecedores que NÃO são de terraplanagem (direção, 28 e 29/07):
// Megaloc (escoras e compactador pequeno), JS Locações (desmembramento do terreno),
// Mercado Livre, Josenildo, Menegotti, MakVibro e LocFácil.
const TP_FORN_FORA = /MEGALOC|JS LOCACOES|MERCADO ?LIVRE|MERCADOLIVRE|JOSENILDO|MENEGOT|MA[KC] ?VIBRO|LOC ?FACIL/;
const TP_MIN_DIARIAS = 5;
// Piso de valor (regra prática da direção, 29/07): serviço com máquina ou serviço de
// terraplanagem abaixo de R$ 3.000 é pontual de obra e não entra no custo. Não se aplica
// a MATERIAL — carrada de aterro, areia do morro e piçarra entram por qualquer valor,
// porque são insumo e o volume importa para a análise de consumo.
const TP_PISO_SERVICO = 3000;
function tpDiarias(r){
  const d = _audNorm(r.descOriginal||r.descricao||'');
  const m = d.match(/(\d{1,3})(?:[.,]\d+)?\s*DIARIAS?/);
  return m ? parseInt(m[1],10) : null;   // null = não é cobrança por diária
}
function tpEhDesmembramento(r){ return /JS LOCACOES/.test(_audNorm(r.fornecedor||'')); }
function tpEhTerra(r){
  const d = _audNorm(r.descOriginal||r.descricao||'');
  const f = _audNorm(r.fornecedor||'');
  if (TP_FORN_FORA.test(f)) return false;                 // Megaloc e JS Locações fora
  if (TP_NAO.test(d) && !TP_MAT.test(d)) return false;     // areia grossa/fina, brita, pó de pedra
  const ehMaterial = TP_MAT.test(d);
  if (!ehMaterial) {
    const di = tpDiarias(r);
    if (di !== null && di < TP_MIN_DIARIAS) return false;  // menos de 5 diárias: pontual
    if ((r.valor||0) < TP_PISO_SERVICO) return false;      // abaixo do piso: pontual
  }
  return ehMaterial || TP_EQUIP.test(d) || TP_FORN.test(f);
}
// Regra de dominância (direção, 31/07): em fatura MISTA, quando o aterro domina o
// descritivo, o lançamento conta como material de aterro, não como máquina. Aluguel de
// máquina sem aterro no descritivo continua sendo custo de máquina.
function tpAterroDomina(r){
  const d = _audNorm(r.descOriginal||r.descricao||'');
  if (!/ATERRO/.test(d)) return false;          // sem aterro citado, a regra não se aplica
  // 1) quantidades explícitas: "45 ATERROS 18M3 / 01 DIARIA RETRO" → 49 contra 1
  let qAterro = 0, qMaq = 0, m;
  const reA = /(\d{1,3})\s*(?:CARRADAS?\s*(?:DE\s*)?)?ATERROS?/g;
  while ((m = reA.exec(d)) !== null) qAterro += +m[1];
  const reM = /(\d{1,3})(?:[.,]\d+)?\s*DIARIAS?/g;
  while ((m = reM.exec(d)) !== null) qMaq += +m[1];
  if (qAterro || qMaq) return qAterro > qMaq;
  // 2) sem quantidade: conta tipos de material contra tipos de máquina citados
  const tiposMat = ['ATERRO','AREIA','PICARRA'].filter(t=>d.includes(t)).length;
  const tiposMaq = ['RETRO','ESCAVAD','TRATOR','PATROL','MOTONIVELADORA','ROLO','PA CARREGADEIRA','MAQUINA'].filter(t=>d.includes(t)).length;
  return tiposMat > tiposMaq;
}
function tpNatureza(r){
  const d = _audNorm(r.descOriginal||r.descricao||'');
  if (tpAterroDomina(r)) return 'Aterro, areia do morro e piçarra';
  if (/PAVIMENTA/.test(d)) return 'Pavimentação';
  if (/ENCARREGADO DE TERRAPLA/.test(d)) return 'Encarregado de terraplanagem';
  if (/CARRO PIPA|CAMINHAO PIPA|\bPIPA\b/.test(d)) return 'Carro e caminhão pipa';
  if (/ALUGUEL DE CACAMBA|\bCACAMBA\b/.test(d)) return 'Aluguel de caçamba';
  if (/ROLO COMPACTADOR|COMPACTADOR/.test(d)) return 'Rolo compactador';
  if (/ALUGUEL DE MAQUINAS|MAQUINAS TERRAPLA/.test(d)) return 'Aluguel de máquinas';
  if (/PA MECANICA|PA CARREGADEIRA|\bRETRO\b|MINI RETRO|ESCAVADEIRA|MOTONIVELADORA|PATROL|\bTRATOR\b/.test(d)) return 'Pá mecânica, retro e escavação';
  if (/DESMATAMENT|LIMPEZA/.test(d)) return 'Limpeza e desmatamento';
  if (TP_MAT.test(d)) return 'Aterro, areia do morro e piçarra';
  return 'Outros serviços de terraplanagem';
}
// ═══ Muro de arrimo: rastreado pelo consumo de PEDRA DE MÃO ═══
// Regra do negócio: a execução do arrimo aparece como elevação muito grande do consumo
// de pedra de mão (também chamada pedra ou pedra de alicerce). Escopo da obra:
// ${(tpEstimativa().E.m3).toLocaleString('pt-BR')} m³ de arrimo de pedra argamassada escalonado, em Eusébio/CE.
// PEDRA do arrimo: pedra de mão, de alicerce, rachão e pedra de alvenaria são o mesmo
// insumo com nomes diferentes na planilha. Brita, pó de pedra, pedrisco e BGS são outros
// materiais e ficam de fora.
const TP_PEDRA = /PEDRA DE MAO|PEDRA DE ALICERCE|RACHAO|PEDRA (DE )?ALVENARIA/;
const TP_PEDRA_NAO = /\bBRITA\b|PO DE PEDRA|PEDRISCO|\bBGS\b|POLIDA|PORTUGUESA|SAO TOME/;
// Valores ADOTADOS pela direção em 29/07, após a investigação do consumo de pedra:
// volume de 550 m³ (derivado da pedra que excede o consumo de rotina, confirmado pelo
// resíduo entre a pedra total e a consumida nos alicerces das 69 casas) e custo de
// R$ 400/m³ para o serviço executado de arrimo de pedra argamassada escalonado.
const TP_ARRIMO_M3_ADOTADO = 550;
const TP_ARRIMO_RS_M3 = 400;
function tpArrimoCusto(){ return TP_ARRIMO_M3_ADOTADO * TP_ARRIMO_RS_M3; }
const TP_ARRIMO_M3_INFORMADO = TP_ARRIMO_M3_ADOTADO;
const TP_M3_POR_CARRADA = 12;          // caçamba padrão — premissa que governa a conversão
function tpEhPedra(r){
  const d=_audNorm(r.descOriginal||r.descricao||'');
  return TP_PEDRA.test(d) && !TP_PEDRA_NAO.test(d);
}
// Derivação do volume do arrimo pelo EXCEDENTE de consumo de pedra:
// a obra consome pedra de rotina (alicerce, embasamento) todo mês. Nos meses de execução
// do muro esse consumo dispara. O que excede a média dos meses normais é a pedra do muro —
// e como a composição da pedra argamassada é próxima de 1 m³ de pedra por m³ de muro,
// esse volume é a própria estimativa do arrimo.
function tpArrimoDerivado(){
  const D = _DESPESAS || [];
  const ped = D.filter(tpEhPedra);
  if (!ped.length) return null;
  const mes={}; ped.forEach(r=>{ const d=parseDate(r.data); if(!d) return;
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); mes[k]=(mes[k]||0)+r.valor; });
  const ms=Object.entries(mes).sort();
  if (ms.length<6) return null;
  const vals=ms.map(([,v])=>v).slice().sort((a,b)=>a-b);
  const meio=Math.floor(vals.length/2);
  const mediana = vals.length%2 ? vals[meio] : (vals[meio-1]+vals[meio])/2;
  const limiar = mediana*2.5;
  const picos = ms.filter(([,v])=>v>limiar);
  const normais = ms.filter(([,v])=>v<=limiar);
  const mediaNormal = normais.length ? normais.reduce((s,[,v])=>s+v,0)/normais.length : 0;
  const totalPicos = picos.reduce((s,[,v])=>s+v,0);
  const excedente = Math.max(0, totalPicos - picos.length*mediaNormal);
  // preço por m³ a partir das carradas declaradas nos próprios descritivos
  let nC=0, vC=0;
  ped.forEach(r=>{ const m=_audNorm(r.descOriginal||r.descricao||'').match(/(\d{1,2})\s*CARRADA/); if(m){ nC+=+m[1]; vC+=r.valor; } });
  const rsCarrada = nC ? vC/nC : 0;
  const rsM3 = rsCarrada ? rsCarrada/TP_M3_POR_CARRADA : 0;
  const volume = rsM3 ? excedente/rsM3 : 0;
  return { ms, mediana, limiar, picos, normais, mediaNormal, totalPicos, excedente,
           total: ped.reduce((s,r)=>s+r.valor,0), n: ped.length,
           nC, rsCarrada, rsM3, volume };
}
// Atribuição do muro de arrimo: não há lançamento nominal, então o gestor marca os
// fornecedores que compõem a obra do muro e o painel soma. Fica salvo no aparelho.
function tpArrimoSet(){ try { return new Set(JSON.parse(localStorage.getItem('tp_arrimo_'+CFG.sheetId)||'[]')); } catch(e){ return new Set(); } }
window.tpToggleArrimo = function(forn){
  const s = tpArrimoSet();
  if (s.has(forn)) s.delete(forn); else s.add(forn);
  localStorage.setItem('tp_arrimo_'+CFG.sheetId, JSON.stringify([...s]));
  renderTerraplanagem();
};

// Estimativa deliberadamente CONSERVADORA (barata) do muro de arrimo, para servir de
// piso de comparação: se nem o cenário mais barato fecha com o rastreado, o desvio é real.
// Preços calibrados com a própria obra onde possível (pedra, areia, cimento da época).
const TP_EST = {
  m3: 0,   // preenchido pela derivação do consumo de pedra
  pedraPorM3: 1.0,          // m³ de pedra por m³ de muro (convenção usual 1,0–1,2 — adotado o piso)
  argamassaPorM3: 0.30,     // m³ de argamassa por m³ de muro
  cimentoPorM3Arg: 6,       // sacos por m³ de argamassa, traço 1:4 (magro)
  areiaPorM3Arg: 1.0,       // m³ de areia por m³ de argamassa
  prodM3PorDia: 3.0,        // m³ assentados por dia por dupla (produtividade otimista)
  precoPedra: 100,          // R$/m³ — mediana da obra ≈ R$ 111/m³, adotado abaixo
  precoCimento: 31.70,      // R$/saco na época da execução (2022)
  precoAreia: 85,           // R$/m³ — obra paga ≈ R$ 89/m³, adotado abaixo
  precoDupla: 280           // R$/dia pedreiro + servente, piso da época
};
function tpEstimativa(){
  const der = tpArrimoDerivado();
  const E = Object.assign({}, TP_EST, { m3: TP_ARRIMO_M3_ADOTADO });
  const pedraM3 = E.m3 * E.pedraPorM3;
  const argM3   = E.m3 * E.argamassaPorM3;
  const cimSc   = argM3 * E.cimentoPorM3Arg;
  const areiaM3 = argM3 * E.areiaPorM3Arg;
  const dias    = E.m3 / E.prodM3PorDia;
  const cPedra  = pedraM3 * E.precoPedra;
  const cCim    = cimSc   * E.precoCimento;
  const cAreia  = areiaM3 * E.precoAreia;
  const cMO     = dias    * E.precoDupla;
  const total   = cPedra + cCim + cAreia + cMO;
  return { E, der, pedraM3, argM3, cimSc, areiaM3, dias, cPedra, cCim, cAreia, cMO, total, unit: total/E.m3 };
}

// Relatório em papel A4 da terraplanagem — reaproveita o overlay e o modo de impressão
// já usados nos relatórios da Auditoria.
window.gerarRelatorioTerra = function(){

// Limpa o clone: tira controle interativo, solta tabelas presas e prepara para papel
// ═══ Conversão de tema para papel ═══
// O painel é escuro e muitos estilos estão cravados no HTML (não em variáveis).
// Em vez de perseguir cada cor uma a uma, medimos a luminância de cada cor inline:
// fundo escuro vira claro, texto quase branco vira quase preto. Cores de acento
// (verde, terracota, latão, azul) ficam na faixa do meio e são preservadas.
function relLum(cor){
  let r,g,b;
  const h = String(cor).trim();
  let m = h.match(/^#([0-9a-f]{3})$/i);
  if (m){ r=parseInt(m[1][0]+m[1][0],16); g=parseInt(m[1][1]+m[1][1],16); b=parseInt(m[1][2]+m[1][2],16); }
  else if ((m = h.match(/^#([0-9a-f]{6})/i))){ r=parseInt(m[1].slice(0,2),16); g=parseInt(m[1].slice(2,4),16); b=parseInt(m[1].slice(4,6),16); }
  else if ((m = h.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i))){ r=+m[1]; g=+m[2]; b=+m[3]; }
  else return null;
  return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
}
function relSat(cor){
  const h=String(cor).trim(); let m,r,g,b;
  if ((m=h.match(/^#([0-9a-f]{6})/i))){ r=parseInt(m[1].slice(0,2),16); g=parseInt(m[1].slice(2,4),16); b=parseInt(m[1].slice(4,6),16); }
  else if ((m=h.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i))){ r=+m[1]; g=+m[2]; b=+m[3]; }
  else return null;
  return (Math.max(r,g,b)-Math.min(r,g,b))/255;
}
function relTemaClaro(el){
  const nos = [el].concat([...el.querySelectorAll('[style]')]);
  nos.forEach(n=>{
    const s = n.getAttribute && n.getAttribute('style');
    if (!s) return;
    let novo = s;
    // fundo escuro → superfície clara
    novo = novo.replace(/background(-color|-image)?\s*:\s*([^;]+)/gi, (tudo, sufixo, valor)=>{
      // gradiente: avalia as cores que ele contém — o cartão-herói do CDI usa um
      if (/gradient/i.test(valor)) {
        const cores = valor.match(/#[0-9a-fA-F]{3,6}|rgba?\([^)]*\)/g) || [];
        const lums = cores.map(relLum).filter(x=>x!==null);
        if (lums.length && lums.every(x=>x<0.42))
          return 'background:#f6f8fa';
        return tudo;
      }
      const L = relLum(valor);
      return (L !== null && L < 0.38) ? 'background'+(sufixo||'')+':#f6f8fa' : tudo;
    });
    // texto quase branco → quase preto (acentos ficam intactos)
    novo = novo.replace(/(^|;)(\s*)color\s*:\s*([^;]+)/gi, (tudo, pre, esp, valor)=>{
      const L = relLum(valor), S = relSat(valor);
      if (L === null) return tudo;
      if (L > 0.74) return pre+esp+'color:#111';                    // quase branco → quase preto
      if (S !== null && S < 0.12 && L > 0.50) return pre+esp+'color:#565e66';  // cinza neutro claro → legível
      return tudo;                                                   // acentos preservados
    });
    // bordas escuras → hairline claro
    novo = novo.replace(/border(-top|-bottom|-left|-right)?\s*:\s*([^;]*?)(#[0-9a-fA-F]{3,6})/gi, (tudo, lado, meio, cor)=>{
      const L = relLum(cor);
      return (L !== null && L < 0.35) ? 'border'+(lado||'')+':'+meio+'#dfe5ea' : tudo;
    });
    if (novo !== s) n.setAttribute('style', novo);
  });
  return el;
}
// Campos de formulário guardam informação (VGV, percentuais, % de obra). Removê-los
// apagaria os parâmetros do relatório — então viram texto com o valor preenchido.
function relCamposEmTexto(clone, origem){
  if (!origem) return;
  const oi = origem.querySelectorAll('input, select, textarea');
  const ci = clone.querySelectorAll('input, select, textarea');
  for (let i=0;i<ci.length;i++){
    const orig = oi[i];
    let val = '';
    if (orig){
      val = (orig.tagName==='SELECT' && orig.selectedOptions && orig.selectedOptions[0])
            ? orig.selectedOptions[0].textContent : (orig.value || '');
    }
    const span = document.createElement('span');
    span.textContent = (val && String(val).trim()) ? val : '—';
    span.style.cssText = 'font-family:DM Mono,monospace;font-weight:700;color:#111;font-size:12px;display:inline-block';
    const pai = ci[i].parentNode;
    pai.replaceChild(span, ci[i]);
    // o rótulo é o irmão anterior e é um bloco: passa a inline para caber na mesma linha
    // Só compacta quando o pai é DE FATO um campo de parâmetro — um invólucro com
    // rótulo e campo, nada mais. Sem essa guarda, um campo de busca dentro de uma
    // seção grande faria a seção inteira virar uma coluna de 32% da página.
    const ehCampoParametro = pai && pai.children.length <= 2
      && span.previousElementSibling && span.previousElementSibling.children.length === 0;
    if (!ehCampoParametro) continue;
    const rot = span.previousElementSibling;
    if (rot && rot.style) { rot.style.display='inline-block'; rot.style.marginRight='6px'; rot.style.marginBottom='0'; }
    if (pai && pai.style) { pai.style.display='inline-block'; pai.style.width='32%'; pai.style.verticalAlign='top'; pai.style.marginBottom='4px'; }
  }
}
function relLimpar(el, origem){
  // Canvas clonado nasce em branco: o bitmap não é copiado. Troca cada um por uma
  // imagem tirada do canvas original, para os gráficos aparecerem no PDF.
  if (origem) {
    const co = origem.querySelectorAll('canvas'), cc = el.querySelectorAll('canvas');
    for (let i=0;i<cc.length;i++){
      try {
        const src2 = co[i] && co[i].toDataURL ? co[i].toDataURL('image/png') : null;
        if (!src2) { cc[i].remove(); continue; }
        const img = document.createElement('img');
        img.src = src2; img.style.cssText = 'width:100%;height:auto;max-width:760px;display:block;margin:0 auto';
        const pai = cc[i].parentNode;
        // o contêiner do gráfico tem altura fixa (280px) para o canvas. A imagem tem
        // proporção própria e transbordava, sobrepondo a seção seguinte no PDF.
        if (pai && pai.style) { pai.style.height='auto'; pai.style.position='static'; }
        pai.replaceChild(img, cc[i]);
      } catch(e) { try { cc[i].remove(); } catch(_){} }
    }
  }
  relCamposEmTexto(el, origem);
  relGridsEmColunas(el);
  relCartoesEmColunas(el);
  return relTemaClaro(relLimparBase(el));
}
// Cartões de gráfico lado a lado, de forma determinística: só quando dois deles
// dividem o mesmo pai. Sozinho, o cartão fica com a largura inteira — melhor que
// deixar meia página vazia ao lado.
function relCartoesEmColunas(el){
  const pais = new Set([...el.querySelectorAll('.fx-card')].map(c=>c.parentElement).filter(Boolean));
  pais.forEach(p=>{
    const cards = [...p.children].filter(c=>c.classList && c.classList.contains('fx-card'));
    if (cards.length < 2) return;
    // font-size:0 no pai elimina o espaço em branco entre os inline-block do HTML
    p.style.fontSize = '0';
    [...p.children].forEach(c=>{ if (c.style && !c.style.fontSize) c.style.fontSize = '12px'; });
    cards.forEach((c,i)=>{
      c.style.display='inline-block'; c.style.verticalAlign='top';
      c.style.width='49%'; c.style.marginRight = (i%2===0 ? '1.6%' : '0');
      c.style.boxSizing='border-box'; c.style.fontSize='12px';
    });
  });
  return el;
}
// Vários blocos declaram a grade em estilo inline (display:grid). Motores de
// impressão sem suporte a grid empilham tudo em coluna única e a página fica vazia
// pela metade. Aqui a grade vira colunas de largura fixa, que qualquer motor entende.
function relGridsEmColunas(el){
  const alvos = [...el.querySelectorAll('[style*="display:grid"],[style*="display: grid"],[style*="grid-template-columns"]')];
  alvos.forEach(g=>{
    const st = g.getAttribute('style') || '';
    let n = 0;
    const rep = st.match(/grid-template-columns\s*:\s*repeat\(\s*(\d+)/i);
    if (rep) n = +rep[1];
    else {
      const cols = st.match(/grid-template-columns\s*:\s*([^;]+)/i);
      if (cols) n = (cols[1].match(/\b[\d.]*(?:fr|px|%)\b|auto|minmax\([^)]*\)/gi)||[]).length;
    }
    if (!n || n < 1) n = 2;
    if (n > 4) n = 4;
    const larg = (100/n) - 1;
    g.setAttribute('style', st.replace(/display\s*:\s*grid/i,'display:block')
                              .replace(/grid-template-columns\s*:[^;]+;?/i,'') + ';font-size:0');
    [...g.children].forEach((c,i)=>{
      const cs = c.getAttribute('style') || '';
      c.setAttribute('style', cs + ';display:inline-block;vertical-align:top;box-sizing:border-box;font-size:12px;width:'
        + larg.toFixed(2) + '%;margin-right:' + ((i+1)%n===0 ? '0' : '1%') + ';margin-bottom:6px'
        + ';overflow:hidden;overflow-wrap:anywhere');
    });
  });
  return el;
}
function relLimparBase(el){
  el.querySelectorAll('.no-print, button, [data-fxgraf] .legend + div:empty').forEach(n=>n.remove());
  el.querySelectorAll('input, select, textarea').forEach(n=>n.remove());   // resíduo, se algum escapou
  // texto de interação não faz sentido no papel
  el.querySelectorAll('span').forEach(n=>{
    const t=(n.textContent||'').trim();
    if (t==='↗' || /^↗?\s*ver\s+tod/i.test(t) || /^clique/i.test(t)) n.remove();
  });
  el.querySelectorAll('.section-title, h2').forEach(n=>{
    n.innerHTML = n.innerHTML
      .replace(/\s*[—-]\s*clique[^<]*/gi,'')
      .replace(/\s*clique para[^<]*/gi,'');
  });
  el.querySelectorAll('[onclick]').forEach(n=>n.removeAttribute('onclick'));
  el.querySelectorAll('[title]').forEach(n=>n.removeAttribute('title'));
  // ícones de ajuda viram nada: a explicação já está no texto do relatório
  el.querySelectorAll('.hint, .hint-icon, .hint-ico, .hint-box').forEach(n=>n.remove());
  // Densidade por número de colunas: acima de 8 a tipografia comprime, acima de 11
  // comprime mais. É o que evita número quebrado e nome colidindo em tabela larga.
  el.querySelectorAll('table').forEach(t=>{
    const thr = t.querySelector('tr');
    const n = thr ? thr.children.length : 0;
    if (n > 11) t.classList.add('t-muito-densa');
    else if (n > 8) t.classList.add('t-densa');
  });
  // tabelas com rolagem precisam sair inteiras no papel
  el.querySelectorAll('.table-wrap').forEach(n=>{ n.style.maxHeight='none'; n.style.overflow='visible'; });
  el.querySelectorAll('thead').forEach(n=>{ n.style.position='static'; });
  // cabeçalho de tabela repete em cada página impressa
  el.querySelectorAll('table').forEach(n=>{ n.style.pageBreakInside='auto'; });
  return el;
}

// EXTRATO GERAL — fonte de CAIXA e CUSTO
// Extrato de movimentação: receitas e despesas na mesma aba, valor com sinal,
// situação (Conciliado / Quitado / Atrasado), conta bancária e saldo corrente.
// Validado no Jazz: filtrando por Conciliado, o saldo fecha a 0,03% do extrato
// bancário real, enquanto a base de receitas erra por R$ 13,1 milhões — porque
// aquela traz a quitação contábil de contratos distratados como se fosse dinheiro.
//
// DIVISÃO DE PAPÉIS, para não perdermos nada do que já foi construído:
//   EXTRATO GERAL          → caixa, custo de obra, categorias, fornecedores, auditoria
//   RECEITAS/DESPESAS TOTAIS → base COMERCIAL: parcela contratada, casa, cliente,
//                              cronograma de recebíveis, VGV, inadimplência, vendas
// ═══════════════════════════════════════════════════════════════════
const EXT_COLS = { data:0, quem:2, desc:5, tipo:7, origem:8, conta:9, forma:10,
                   valor:11, saldo:12, situacao:13, valorOrig:14, juros:15, multa:16,
                   desconto:17, taxas:18, competencia:19, vencimento:20, obs:22, nf:23,
                   cat:24, centroCusto:26 };
// O extrato usa nomes de categoria um pouco diferentes. Mapeamos para os nomes que
// todas as regras já construídas conhecem, para nada precisar ser reescrito.
const EXT_CAT_MAP = [
  [/^FORNECEDOR\s*-\s*AQUISI[CÇ][AÃ]O DE MATERIAIS/i, 'Aquisição de Materiais'],
  [/^TAXAS?\/LICEN[CÇ]AS?\/ALVAR[AÁ]/i,                'Taxas/Licenças/Alvará'],
  [/^ESCRIT[OÓ]RIO/i,                                   'Escritório/Administrativo'],
  [/^IMPOSTOS?\s*[-–]/i,                                'Impostos/Tributos'],
  [/^IMPOSTO\s*[-–]/i,                                  'Impostos/Tributos'],
];
function extNormCat(c){
  const s = String(c||'').trim();
  for (const [re, alvo] of EXT_CAT_MAP) if (re.test(s)) return alvo;
  return s;
}
function extEhRetirada(cat){ return /RETIRADA\s*S[OÓ]CIOS?|DEVOLU[CÇ][AÃ]O DE AFAC/i.test(String(cat||'')); }
function extEhAporte(desc, cat){ return /\bAFAC\b/i.test(String(desc||'')) || /\bAFAC\b/i.test(String(cat||'')); }
function extEhRendimento(cat, desc){ return /RENDIMENTO/i.test(String(cat||'')) || /RENDIMENTO DE APLICA/i.test(String(desc||'')); }

// Converte o extrato nas estruturas que o painel inteiro já consome.
function parseExtrato(allRows){
  const C = EXT_COLS;
  const hdr = (allRows[0]||[]).map(x=>_audNorm(x));
  // confere que é mesmo o extrato antes de usar
  if (!hdr.some(h=>h.includes('SALDO CONTA')) || !hdr.some(h=>h.includes('SITUACAO'))) return null;
  const despesas=[], receitas=[], aportes=[], retiradas=[], rendimentos=[];
  const resumo = { conciliado:0, quitado:0, atrasado:0, nConc:0, nQuit:0, nAtr:0, linhas:0 };
  allRows.slice(1).forEach(r=>{
    if (!r || !r[C.data]) return;
    const data = normalizeDate(String(r[C.data]||'').trim());
    if (!data) return;
    const bruto = parseVal(r[C.valor]);
    if (!bruto) return;
    const situacao = String(r[C.situacao]||'').trim();
    const catRaw = extNormCat(r[C.cat]);
    const quem = String(r[C.quem]||'').trim() || '—';
    const descRaw = String(r[C.desc]||'').trim();
    const conta = String(r[C.conta]||'').trim();
    const v = Math.abs(bruto);
    resumo.linhas++;
    if (/CONCILIADO/i.test(situacao)) { resumo.conciliado += bruto; resumo.nConc++; }
    else if (/ATRASAD/i.test(situacao)) { resumo.atrasado += bruto; resumo.nAtr++; }
    else { resumo.quitado += bruto; resumo.nQuit++; }
    const comum = { data, conta, situacao, obs:String(r[C.obs]||'').trim(),
                    juros:parseVal(r[C.juros]), multa:parseVal(r[C.multa]),
                    desconto:parseVal(r[C.desconto]), taxas:parseVal(r[C.taxas]),
                    competencia:normalizeDate(String(r[C.competencia]||'').trim()),
                    centroCusto:String(r[C.centroCusto]||'').trim(), nf:String(r[C.nf]||'').trim(),
                    doExtrato:true };
    if (bruto < 0) {
      if (extEhRetirada(catRaw)) { retiradas.push(Object.assign({ socio:quem, valor:v, descricao:descRaw, categoria:catRaw }, comum)); return; }
      let categoria = normCat(catRaw, descRaw), reclassDe = null;
      if (categoria && _audNorm(quem).includes('RAFAEL SANTOS') && !_audNorm(categoria).includes('MAO DE OBRA')) {
        reclassDe = categoria; categoria = 'Mão de obra - Terceiros';
      }
      despesas.push(Object.assign({ fornecedor:quem, descricao:normDesc(descRaw), descOriginal:descRaw||'—',
                                    valor:v, categoria, reclassDe }, comum));
    } else {
      if (extEhAporte(descRaw, catRaw)) { aportes.push(Object.assign({ socio:quem, valor:v, desc:descRaw }, comum)); return; }
      if (extEhRendimento(catRaw, descRaw)) { rendimentos.push(Object.assign({ valor:v, desc:descRaw }, comum)); return; }
      const casa = extrairCasa(descRaw);
      const descU = _audNorm(descRaw), catU = _audNorm(catRaw);
      const tipo = isIncc(descRaw) || catU.includes('INCC') || catU.includes('IGPM') ? 'INCC'
                 : descU.includes('DISTR') ? 'VendaDistratada'
                 : catU.includes('PERSONALIZ') ? 'Personalizacao'
                 : catU.includes('REEMBOLS') ? 'Reembolso'
                 : catU.includes('BONIFICA') ? 'Bonificacao'
                 : catU.includes('RATEIO') ? 'Rateio'
                 : (catU === 'VENDAS' || casa) ? 'Venda' : 'OutraReceita';
      const grupo = ['Venda','INCC','VendaDistratada','Personalizacao'].includes(tipo) ? 'venda' : 'outras';
      receitas.push(Object.assign({ cliente:quem, dataComp:data, desc:descRaw, origem:String(r[C.origem]||''),
                                    valOrig:parseVal(r[C.valorOrig])||v, valReceb:v, casa, tipo, grupo,
                                    recupera: tipo==='Reembolso', cat:catRaw, baixaSemCaixa:false }, comum));
    }
  });
  return { despesas, receitas, aportes, retiradas, rendimentos, resumo };
}

// ═══ Rendimentos de aplicação: bruto, tributos e líquido ═══
// O rendimento entra pelas receitas, mas o IRRF e o IOF sobre a aplicação saem como
// despesa na categoria Impostos/Tributos. Olhar só a entrada superestima o ganho.
const RE_IR_APLIC  = /IRRF\s*S\/?\s*APLICA|\bIR\b\s*S\/?\s*APLICA|IMPOSTO DE RENDA S\/?\s*APLICA/;
const RE_IOF_APLIC = /\bIOF\b/;
function rendApuracao(despesas, rendimentos){
  const D = despesas || _DESPESAS || [];
  const R = rendimentos || (typeof _RENDIMENTOS!=='undefined' ? _RENDIMENTOS : []) || [];
  const nd = r => _audNorm(r.descOriginal||r.descricao||'');
  const irL  = D.filter(r=>RE_IR_APLIC.test(nd(r)));
  const iofL = D.filter(r=>RE_IOF_APLIC.test(nd(r)) && !RE_IR_APLIC.test(nd(r)));
  const bruto = R.reduce((s,r)=>s+(r.valor||r.valReceb||0),0);
  const ir  = irL.reduce((s,r)=>s+r.valor,0);
  const iof = iofL.reduce((s,r)=>s+r.valor,0);
  return { bruto, ir, iof, tributos: ir+iof, liquido: bruto-ir-iof,
           nRend: R.length, nIR: irL.length, nIOF: iofL.length,
           carga: bruto>0 ? (ir+iof)/bruto*100 : 0,
           listaIR: irL, listaIOF: iofL, listaRend: R };
}
