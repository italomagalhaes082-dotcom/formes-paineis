function renderIndicadores() {
  const el = document.getElementById('tab15');
  if (!el) return;
  // garante que o motor do Resultado Final já rodou (fonte única dos indicadores)
  if (!window._indicadoresRF) { try { renderResultadoFinal(); } catch(e){} }
  const I = window._indicadoresRF;
  const pct = parseFloat(rfGet('pctObraExec', CFG.pctObraDefault||0))||0;
  const area = areaTotalCfg(CFG);

  // ── séries mensais: receita, despesa, capital exposto ──
  const mesRec={}, mesDesp={};
  (_RECEITAS||[]).forEach(r=>{ const d=parseDate(r.dataComp||r.data); if(d) { const ym=d.getFullYear()*100+d.getMonth()+1; mesRec[ym]=(mesRec[ym]||0)+(r.valReceb||0); } });
  (_DESPESAS||[]).forEach(r=>{ const d=parseDate(r.data); if(d) { const ym=d.getFullYear()*100+d.getMonth()+1; mesDesp[ym]=(mesDesp[ym]||0)+r.valor; } });
  const hoje=new Date(), ymHoje=hoje.getFullYear()*100+hoje.getMonth()+1;
  const yms=[...new Set([...Object.keys(mesRec),...Object.keys(mesDesp)].map(Number))].sort((a,b)=>a-b).filter(ym=>ym<ymHoje);
  const ult=yms.slice(-18);
  const labs=ult.map(_ymLabel);

  // capital exposto acumulado (aportes − retiradas) mês a mês
  const mov={};
  (_APORTES||[]).forEach(a=>{ const d=parseDate(a.data); if(d){ const ym=d.getFullYear()*100+d.getMonth()+1; mov[ym]=(mov[ym]||0)+a.valor; } });
  (_RETIRADAS||[]).forEach(r=>{ const d=parseDate(r.data); if(d){ const ym=d.getFullYear()*100+d.getMonth()+1; mov[ym]=(mov[ym]||0)-r.valor; } });
  const ymsExp=[...new Set(Object.keys(mov).map(Number))].sort((a,b)=>a-b).filter(ym=>ym<=ymHoje);
  let run=0; const expSerie=[], expLabs=[];
  ymsExp.forEach(ym=>{ run+=mov[ym]; expSerie.push(run); expLabs.push(_ymLabel(ym)); });

  // burn rate: média de despesa dos últimos 6 meses fechados
  const burn = ult.slice(-6).reduce((s,ym)=>s+(mesDesp[ym]||0),0)/Math.max(1,ult.slice(-6).length);

  const kpi=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c};font-size:1.6rem">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;

  let html = `<div class="info-box" style="border:1px solid #6C8FB540;margin-bottom:14px"><span>📐</span><div><strong>Indicadores financeiros de ${CFG.nome}.</strong> Projeções derivadas do Resultado Final — atualize lá o VGV, os percentuais e o <strong>% de obra executada</strong> (hoje ${pct}%) e todos os números desta aba acompanham.</div></div>`;

  if (I) {
    html += `<div class="section-title">Retorno projetado ao sócio</div>
      <div class="kpi-grid">
        ${kpi('TIR projetada', I.tirAA!==null? I.tirAA.toFixed(1)+'% a.a.':'n/d', I.tirAA!==null?(I.tirAA>I.cdiEq?'acima do CDI ('+I.cdiEq+'% a.a.)':'abaixo do CDI ('+I.cdiEq+'% a.a.)'):'faltam parâmetros no RF', I.tirAA!==null&&I.tirAA>I.cdiEq?'#6D9E7F':'#C4A55C','Fluxo real do sócio (aportes e retiradas nas datas efetivas) mais o recebimento final estimado em '+I.fimEst.toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'})+'.')}
        ${kpi('ROI projetado', I.roi.toFixed(1)+'%', 'sobre '+fmt(I.tAp)+' aportados', I.roi>0?'#6D9E7F':'#BF6B60')}
        ${kpi('MOIC', I.moic.toFixed(2)+'×', 'quanto volta por real aportado', I.moic>1?'#6D9E7F':'#BF6B60')}
        ${I.margemVGV!==null? kpi('Margem sobre VGV', I.margemVGV.toFixed(1)+'%', 'referência do setor: 15–25%', I.margemVGV>15?'#6D9E7F':I.margemVGV>8?'#C4A55C':'#BF6B60') : kpi('Margem sobre VGV','n/d','informe o VGV no Resultado Final','#6E6E73')}
      </div>
      <div class="section-title" style="margin-top:16px">Posição de capital e obra</div>
      <div class="kpi-grid">
        ${kpi('Capital exposto', fmt(I.exposto), fmt(I.tAp)+' aportado − '+fmt(I.tRet)+' retirado', '#6C8FB5')}
        ${kpi('Resultado projetado', fmt(I.resultadoProj), 'no encerramento estimado', I.resultadoProj>0?'#6D9E7F':'#BF6B60')}
        ${kpi('Custo de obra a incorrer', fmt(I.obraAIncorrer||0), 'para chegar a 100% ('+pct+'% hoje)', '#C4A55C')}
        ${kpi('Queima de caixa', fmt(burn)+'/mês', 'média dos últimos 6 meses fechados', '#BF6B60','Despesa total média mensal. Contra o capital exposto, indica por quantos meses a obra se sustenta sem novo aporte.')}
      </div>`;
  } else {
    html += `<div class="info-box" style="border:1px solid #C4A55C66"><span style="color:#C4A55C">⚠</span><div>Preencha <strong>VGV</strong> e <strong>% de obra executada</strong> na aba Resultado Final para liberar TIR, ROI, MOIC e margem.</div></div>`;
  }

  html += `<div class="section-title" style="margin-top:16px">Evolução</div>
    ${fxCard('Receita × despesa por mês','g_ind_rd','<div class="legend"><span><i style="background:#6D9E7F"></i>Receita</span><span><i style="background:#BF6B60"></i>Despesa</span></div>','Últimos 18 meses fechados. O cruzamento das linhas mostra quando a obra passou a se pagar.')}
    ${fxCard('Capital exposto ao longo do tempo','g_ind_exp','<div class="legend"><span><i style="background:#6C8FB5"></i>Aportado − retirado (acumulado)</span></div>','Saldo que os sócios ainda têm dentro do empreendimento a cada mês. O pico é a exposição máxima; a queda indica devolução de capital.')}
    ${fxCard('Despesa mensal — queima de caixa','g_ind_burn','','Barras de despesa total por mês fechado.')}`;

  if (I) {
    const metas = [
      {nome:'TIR vs CDI ('+I.cdiEq+'% a.a.)', valor: I.tirAA!==null? Math.max(0,I.tirAA) : 0, rotulo: I.tirAA!==null? I.tirAA.toFixed(1)+'%':'n/d', cor: I.tirAA!==null&&I.tirAA>I.cdiEq?'#6D9E7F':'#C4A55C'},
      {nome:'Margem sobre VGV (meta 15%)', valor: I.margemVGV!==null? Math.max(0,I.margemVGV) : 0, rotulo: I.margemVGV!==null? I.margemVGV.toFixed(1)+'%':'n/d', cor: (I.margemVGV||0)>15?'#6D9E7F':'#C4A55C'},
      {nome:'ROI projetado', valor: Math.max(0,I.roi), rotulo: I.roi.toFixed(1)+'%', cor: I.roi>0?'#6D9E7F':'#BF6B60'},
      {nome:'Execução da obra (meta 100%)', valor: pct, rotulo: pct+'%', cor:'#6C8FB5'},
    ];
    html += `<div class="section-title" style="margin-top:16px">Indicadores contra meta</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px"><div id="g_ind_meta"></div></div>`;
    window._indMetas = metas;
  }
  el.innerHTML = html;

  // desenha depois do innerHTML
  if (labs.length) {
    fxLinhas(document.getElementById('g_ind_rd'), { labels: labs, cada: Math.ceil(labs.length/8),
      series:[ {values: ult.map(ym=>mesRec[ym]||0), color:'#6D9E7F', area:'rgba(109,158,127,.13)'},
               {values: ult.map(ym=>mesDesp[ym]||0), color:'#BF6B60'} ], alt:'receita e despesa por mês' });
    fxBarras(document.getElementById('g_ind_burn'), { grupos: labs, cada: Math.ceil(labs.length/8),
      series:[ {values: ult.map(ym=>mesDesp[ym]||0), color:'#BF6B60'} ], alt:'despesa mensal' });
  }
  if (expSerie.length) {
    const n = expSerie.length > 24 ? expSerie.length-24 : 0;
    fxLinhas(document.getElementById('g_ind_exp'), { labels: expLabs.slice(n), cada: Math.ceil((expLabs.length-n)/8),
      series:[ {values: expSerie.slice(n), color:'#6C8FB5', area:'rgba(108,143,181,.14)'} ], alt:'capital exposto acumulado' });
  }
  if (window._indMetas) fxBarrasH(document.getElementById('g_ind_meta'), window._indMetas);
}

async function renderAlimentacao(force) {
  const el = document.getElementById('tab14');
  if (!el) return;
  el.innerHTML = '<div class="info-box">⏳ Comparando a alimentação das três obras…</div>';
  let R;
  try { R = await ensureAnaliseData(force); }
  catch(e) { el.innerHTML = '<div class="info-box" style="border:1px solid #BF6B6066">Erro: '+(e.message||e)+'</div>'; return; }
  const hoje=new Date(); const ymHoje=hoje.getFullYear()*100+(hoje.getMonth()+1);
  const sum=o=>Object.values(o||{}).reduce((s,v)=>s+v,0);
  // meses do primeiro gasto de alimentação de qualquer obra até o mês atual
  const ymsAli=[...new Set(R.flatMap(r=>Object.keys(r.fam.alimentacao).map(Number)))].sort((a,b)=>a-b);
  const ini=ymsAli[0]||ymHoje;
  const todos=[]; { let y=Math.floor(ini/100), m=ini%100;
    while (y*100+m<=ymHoje) { todos.push(y*100+m); m++; if(m>12){m=1;y++;} } }
  const val=(r,ym)=>r.fam.alimentacao[ym]||0;
  const obraAtiva=(r,ym)=>(r.obraMes[ym]||0)>30000;  // obra rodando de verdade naquele mês
  // ── detector de janelas: obra ativa sem alimentação, por DOIS critérios ──
  // (a) o Bossa pagava no mesmo mês (comparação direta), OU
  // (b) o mês é ANTERIOR à primeira alimentação oficial daquela obra (pré-história da categoria)
  const bossa=R.find(r=>r.key==='bossa');
  const priAli={}; R.forEach(r=>{ priAli[r.key] = todos.find(ym=>val(r,ym)>500) || null; });
  const suspAli=(r,ym)=> obraAtiva(r,ym) && val(r,ym)<500 &&
    ( (r.key!=='bossa' && bossa && val(bossa,ym)>2000) || (!priAli[r.key] || ym<priAli[r.key]) );
  const janelas=[];
  R.forEach(r=>{
    let inicio=null;
    todos.forEach((ym,i)=>{
      const suspeito = suspAli(r,ym);
      if (suspeito && inicio===null) inicio=ym;
      if ((!suspeito || i===todos.length-1) && inicio!==null){
        const fim = suspeito? ym : todos[i-1];
        const meses = todos.filter(x=>x>=inicio&&x<=fim).length;
        if (meses>=2) janelas.push({obra:r.nome.split(' ')[0], inicio, fim, meses});
        inicio=null;
      }
    });
  });
  const lab=ym=>MESN_A[ym%100-1]+'/'+String(ym).slice(2,4);
  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c};font-size:15px">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
  const fechados=todos.filter(ym=>ym<ymHoje);
  if (window._aliRelMode) { el.innerHTML = aliRelatorioHtml(R, todos, fechados, ymHoje, janelas, val, obraAtiva, lab, sum, bossa, suspAli); return; }
  el.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button onclick="aliToggleRel()" style="background:#6D9E7F;color:#04140f;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-weight:700">📄 Versão relatório / PDF</button></div>`+`
    <div class="info-box" style="border:1px solid #6D9E7F40;margin-bottom:12px"><span>🍛</span><div><strong>Alimentação de obra — comparativo integral das três obras.</strong> Números pela categoria oficial; os candidatos a reclassificação (caixinha/André/mercado) só entram após sua validação na Auditoria. Meses de obra parada não contam como lacuna.</div></div>
    ${janelas.length?`<div class="info-box" style="border:1px solid #BF6B6066;background:#BF6B600d;margin-bottom:12px"><span style="color:#BF6B60;font-size:16px">🕵️</span><div><strong>Janelas suspeitas — obra ativa SEM alimentação identificada (Bossa pagando no mesmo mês, OU período anterior à 1ª alimentação oficial da obra) (${janelas.length}):</strong><br>${janelas.map(j=>`· <strong>${j.obra}</strong>: ${lab(j.inicio)} → ${lab(j.fim)} (${j.meses} meses) — candidata ao período em que a alimentação estava embutida na folha do André (adiantamento para mantimentos)`).join('<br>')}<br><span style="font-size:11px;color:#A1A1A6">Confirmando o período, aplico a regra da diária/folha do André nessa janela e a alimentação real das obras se realinha.</span></div></div>`:''}
    <div class="kpi-grid" style="grid-template-columns:repeat(${R.length},1fr)">
      ${R.map(r=>{
        const tot=sum(r.fam.alimentacao); const aExec=r.pct>0? r.area*r.pct/100 : 0;
        const mesesAtivos=todos.filter(ym=>val(r,ym)>0).length||1;
        const obraTot=sum(r.obraMes)||1;
        return '<div onclick="drillAnalise(\'alimentacao\',\''+r.key+'\')" style="cursor:pointer" title="ver todos os lançamentos de alimentação desta obra">'+k(r.nome.split(' ')[0], fmt(tot),
          (aExec?fmt(tot/aExec)+'/m² exec · ':'')+(tot/obraTot*100).toFixed(2)+'% do custo de obra · média '+fmt(tot/mesesAtivos)+'/mês ativo', r.cor)+'</div>';
      }).join('')}
    </div>
    ${(function(){
      const linhas=[];
      R.forEach(r=>Object.entries(r.aliNomeFora||{}).forEach(([f,v])=>{
        linhas.push({obra:r.nome.split(' ')[0], cor:r.cor, f, ...v});
      }));
      if(!linhas.length) return '';
      linhas.sort((a,b)=>b.total-a.total);
      const labm=ym=>MESN_A[ym%100-1]+'/'+String(ym).slice(2,4);
      return `<div class="info-box" style="border:1px solid #BF6B6066;background:#BF6B600d;margin:12px 0"><span style="color:#BF6B60;font-size:16px">🚩</span><div><strong>Fornecedores com NOME de alimentação classificados FORA da categoria (${linhas.length}):</strong> não entram em nenhum número de alimentação hoje — candidatos quase certos a reclassificação.<br>${linhas.slice(0,10).map(l=>`· <strong style="color:${l.cor}">${l.obra}</strong> · <strong>${l.f.slice(0,34)}</strong> — ${fmt(l.total)} em ${l.n} pagto(s), ${labm(l.ini)}→${labm(l.fim)}, hoje em: ${Object.keys(l.cats).join(', ')}`).join('<br>')}<br><span style="font-size:11px;color:#A1A1A6">Confirme no chat e a reclassificação entra com rastro — matriz, KPIs, perícia e relatório se corrigem juntos.</span></div></div>`;
    })()}
    <div class="section-title" style="margin-top:16px">Matriz mensal — todo o período${hintIcon('Célula vermelha: obra ATIVA (custo > R$30 mil) sem alimentação — porque o Bossa pagava no mesmo mês OU porque a obra ainda não tinha alimentação oficial nenhuma (pré-história da categoria). Cinza: obra parada.')}</div>
    <div class="table-wrap" style="max-height:560px;overflow:auto"><table>
      <thead style="position:sticky;top:0;background:var(--card)"><tr><th>Mês</th>${R.map(r=>`<th style="text-align:right;color:${r.cor}">${r.nome.split(' ')[0]}</th>`).join('')}</tr></thead>
      <tbody>${todos.slice().reverse().map(ym=>`<tr>
        <td style="font-family:'DM Mono',monospace;font-size:10.5px">${lab(ym)}</td>
        ${R.map(r=>{
          const v=val(r,ym); const ativa=obraAtiva(r,ym);

async function ensureAnaliseData(force) {
  if (window._analiseData && !force) return window._analiseData;
  {
    const results = await Promise.all(Object.entries(EMPREENDIMENTOS).map(async ([k, c]) => {
      const jDesp = await fetchSheet(c.abaDespesas, c.sheetId);
      const rowsD = parseSheet(jDesp);
      const desp = parseDespesasRows(rowsD);
      const area = areaTotalCfg(c);
      // séries mensais por família + custo de obra total mensal
      const fam = {}; FAMILIAS_ANALISE.forEach(f=>fam[f.k]={});
      const obraMes = {};
      const matTipos = {}, moForn = {}, judMes = {}, catAudit = {}, aliForn = {}, aliDet = {}, aliNomeFora = {}, fornMes = {}, pagGenericos = [];
      let judTotal = 0, cartTotal = 0, despTotal = 0;
      let primeiro = null;
      desp.forEach(r=>{
        const d = parseDate(r.data); if(!d) return;
        const ym = d.getFullYear()*100 + (d.getMonth()+1);
        const cU = _audNorm(r.categoria||''); const dU = _audNorm(r.descOriginal||r.descricao||''); const fU = _audNorm(r.fornecedor||'');
        despTotal += r.valor;
        const catNome = r.categoria || '(sem categoria)';
        const CA = (catAudit[catNome] = catAudit[catNome] || {total:0, incluida:isCustoObra(r.categoria||'')});
        CA.total += r.valor;
        if (isCustoObra(r.categoria||'')) {
          obraMes[ym]=(obraMes[ym]||0)+r.valor;
          if (!primeiro || ym<primeiro) primeiro=ym;
          const fkm=(r.fornecedor||'—').trim();
          if (fkm!=='—') { const FM=(fornMes[fkm]=fornMes[fkm]||{}); FM[ym]=(FM[ym]||0)+r.valor; }
          if (/^(PAGTO|PGTO|SEMANA|ADIANTAMENTO|DESPESA)S?\b/.test(dU) && dU.length<28 && pagGenericos.length<400)
            pagGenericos.push({ym, forn:(r.fornecedor||'—').slice(0,30), val:r.valor, desc:String(r.descOriginal||r.descricao||'').slice(0,34)});
        }
        FAMILIAS_ANALISE.forEach(f=>{ if(f.match(cU)) fam[f.k][ym]=(fam[f.k][ym]||0)+r.valor; });
        if (cU.includes('MATERIA')) {
          const tp = tipoMaterialDe(dU);
          if (tp) {
            const T=(matTipos[tp]=matTipos[tp]||{total:0,meses:{},forns:{}});
            T.total+=r.valor; T.meses[ym]=(T.meses[ym]||0)+r.valor;
            const fk=_audNorm(r.fornecedor).replace(/\b(LTDA|ME|EPP|EIRELI)\b\.?/g,'').trim();
            if (fk && fk!=='—') T.forns[fk]=(T.forns[fk]||0)+r.valor;
          }
        }
        if (!cU.includes('ALIMENTA') && RE_FORN_COMIDA.test(fU)) {
          const fk3=(r.fornecedor||'—').trim();
          const NF=(aliNomeFora[fk3]=aliNomeFora[fk3]||{total:0, ini:ym, fim:ym, cats:{}, n:0});
          NF.total+=r.valor; NF.n++; if(ym<NF.ini)NF.ini=ym; if(ym>NF.fim)NF.fim=ym;
          NF.cats[(r.categoria||'—').slice(0,26)]=true;
        }
        if (cU.includes('ALIMENTA')) {
          const fk2=(r.fornecedor||'—').trim();
          if (fk2!=='—') aliForn[fk2]=(aliForn[fk2]||0)+r.valor;
          (aliDet[ym]=aliDet[ym]||[]).push({d:r.data, f:(r.fornecedor||'—').slice(0,36), de:String(r.descOriginal||r.descricao||'').slice(0,64), v:r.valor});
        }
        if (cU.includes('MAO DE OBRA')) {
          const fk=(r.fornecedor||'—').trim();
          if (fk!=='—') moForn[fk]=(moForn[fk]||0)+r.valor;
        }
        if (ehCartorio(r)) { cartTotal+=r.valor; }
        else if (ehJudicial(r)) { judTotal+=r.valor; judMes[ym]=(judMes[ym]||0)+r.valor; }
      });
      desp.forEach(r=>{ r._obra = c.nome; r._obraKey = k; });
      window._analiseRows = (window._analiseRows||[]).filter(r=>r._obraKey!==k).concat(desp);
      return { key:k, nome:c.nome, cor:c.cor, area, fam, obraMes, primeiro, pct: pctObraDe(k), matTipos, moForn, aliForn, aliDet, aliNomeFora, fornMes, pagGenericos, judTotal, cartTotal, judMes, despTotal, catAudit, estruturaConcluidaEm: c.estruturaConcluidaEm||null, estruturaPrevisaoFim: c.estruturaPrevisaoFim||null };
    }));
    window._analiseData = results;
    return results;
  }

  if (window._analiseData && !force) { paintAnalise(window._analiseData); return; }
  el.innerHTML = '<div class="info-box">⏳ Cruzando as despesas das três obras…</div>';
  try { paintAnalise(await ensureAnaliseData(force)); }
  catch(e) { el.innerHTML = '<div class="info-box" style="border:1px solid #BF6B6066">Erro na análise: '+(e.message||e)+'</div>'; }
}

function paintAnalise(R) {

  const idadeMeses = (r, ym) => { // meses desde o 1º gasto de obra
    if (!r.primeiro) return 0;

  };
  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c};font-size:17px">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;

  // ── 1. famílias × obras: total, R$/m², % do custo de obra ──
  const tabFam = FAMILIAS_ANALISE.map(f=>{
    const cols = R.map(r=>{
      const t=sum(r.fam[f.k]); const obra=sum(r.obraMes);
      return { t, m2: r.area? t/r.area : 0, pct: obra? t/obra*100 : 0 };

    return { f, cols, tG };

  // ── 2. índice materiais / mão de obra (inclui salários de obra) ──

      const mat=(r.fam.materiais[ym]||0), mo=(r.fam.mo[ym]||0)+(r.fam.salarios[ym]||0);
      if (mo>3000) serieIdx[ym] = mat/mo;   // meses com MO relevante
    });
    const matT=sum(r.fam.materiais), moT=sum(r.fam.mo)+sum(r.fam.salarios);
    return { r, serieIdx, geral: moT>0? matT/moT : 0,
             u6: (()=>{ const m6=ultN(r.fam.materiais,6), o6=ultN(r.fam.mo,6)+ultN(r.fam.salarios,6); return o6>0? m6/o6 : null; })() };
  });

  // ── 3. tendência 3m vs 3m anteriores por família/obra ──

    const a=ultN(r.fam[f.k],3), b=fechados.slice(-6,-3).reduce((s,ym)=>s+(r.fam[f.k][ym]||0),0);

    const acum={}; let run=0;
    ymsAll.forEach(ym=>{ run+=(r.obraMes[ym]||0); acum[idadeMeses(r,ym)]=run; });

  // ── insights automáticos (regras de auditor) ──

  { const al=tabFam.find(t=>t.f.k==='alimentacao');

    } }
  idx.forEach(x=>{ if(x.u6!==null && x.geral>0 && x.u6 < x.geral*0.55)
    insights.push(`⚙️ ${x.r.nome}: índice Materiais/MO caiu para ${x.u6.toFixed(2)} nos últimos 6m (média histórica ${x.geral.toFixed(2)}) — fase de acabamento/mão de obra intensiva, ou compras de material represadas.`); });

    if (projs.length>=2 && projs[projs.length-1].v>0){

      ${idx.map(x=>k(x.r.nome.split(' ')[0], x.geral.toFixed(2), 'últimos 6m: '+(x.u6===null?'—':x.u6.toFixed(2)), x.r.cor)).join('')}

      }).join('')}

        return k('GRUPO', (jt/dt*100).toFixed(2)+'%', fmt(jt), jt/dt>0.01?'#BF6B60':jt/dt>0.005?'#C4A55C':'#6D9E7F'); })()}
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(${R.length+1},1fr);margin-top:8px">
      ${R.map(r=>k('Cartorário · '+r.nome.split(' ')[0], fmt(r.cartTotal||0), 'obrigatório — sem régua', '#A1A1A6')).join('')}
      ${k('Cartorário · GRUPO', fmt(R.reduce((s,r)=>s+(r.cartTotal||0),0)), 'escrituras, registros, ITBI, emolumentos', '#A1A1A6','Custo inescapável do negócio imobiliário — acompanhado apenas para visibilidade, separado do contencioso.')}

    <div class="section-title" style="margin-top:16px">♻️ Indícios de desperdício e compra tardia${hintIcon('Sem quantidades nos lançamentos, desperdício não se mede diretamente — estes são INDÍCIOS: material estrutural comprado com a obra quase pronta (>90%) sugere retrabalho, perda ou desvio de destino. Material/m² muito diferente entre obras de padrão parecido também.')}</div>
    ${(function(){
      const ESTRUT=['Cimento','Concreto','Aço/Ferragem','Bloco/Tijolo','Areia/Brita/Aterro'];
      const achados=[];
      // regra calibrada com o modelo da Formes: as obras rodam as 3 fases em paralelo,
      // então compra estrutural só é suspeita APÓS a estrutura declarada concluída na config
      R.forEach(r=>{
        if (!r.estruturaConcluidaEm) return;   // Jazz/Liberty: estrutura ainda em execução — sem flag
        const corte = parseInt(r.estruturaConcluidaEm.replace('-',''));
        ESTRUT.forEach(tp=>{
          const v=r.matTipos[tp]; if(!v) return;
          const pos=Object.entries(v.meses).filter(([ym])=>+ym>corte).reduce((s,[,x])=>s+x,0);
          if (pos>20000) achados.push(`${r.nome.split(' ')[0]}: ${fmt(pos)} em <strong>${tp}</strong> APÓS a conclusão da estrutura (${r.estruturaConcluidaEm}) — esperado apenas o residual dos muros de divisão; conferir destino`);
        });
      });
      // material/m² divergente entre Bossa e Liberty (padrões próximos)
      const b=R.find(r=>r.key==='bossa'), l=R.find(r=>r.key==='liberty');
      if (b&&l&&b.pct>0&&l.pct>0){
        ['Cimento','Cerâmica/Porcelanato','Aço/Ferragem'].forEach(tp=>{
          const vb=(b.matTipos[tp]?.total||0)/(b.area*b.pct/100), vl=(l.matTipos[tp]?.total||0)/(l.area*l.pct/100);
          if (vb>0&&vl>0){ const raz=Math.max(vb,vl)/Math.min(vb,vl);
            if (raz>1.5) achados.push(`<strong>${tp}</strong>/m² executado: ${vb>vl?'Bossa':'Liberty'} gasta ${raz.toFixed(1)}× o outro (${fmt(Math.max(vb,vl))} vs ${fmt(Math.min(vb,vl))}/m²) — casas de padrão próximo; investigar preço ou perda`); }
        });
      }
      return achados.length
        ? `<div class="info-box" style="border:1px solid #C4A55C66;background:#C4A55C0d"><span style="color:#C4A55C">♻️</span><div>${achados.map(a=>'· '+a).join('<br>')}</div></div>`
        : `<div class="info-box"><span>✓</span><div>Nenhum indício nos critérios calibrados: compra estrutural após conclusão declarada da estrutura (hoje só se aplica ao Bossa; Jazz/Liberty entram quando concluírem, previsto ago/26) · material/m² divergente entre obras de padrão próximo.</div></div>`;
    })()}

      </tr>`).join('')}
      </tbody></table></div>

}

async function renderConsolidado(force) {
  const el = document.getElementById('tab8');
  if (!el) return;
  if (window._consolData && !force) { paintConsolidado(window._consolData); window._volData=window._consolData; volPaint(_volForn); return; }
  el.innerHTML = '<div style="text-align:center;padding:48px 20px;color:#A1A1A6;font-family:\'DM Mono\',monospace;font-size:12px"><div class="spinner" style="margin:0 auto 16px"></div>Carregando os 3 empreendimentos<br>em paralelo...</div>';
  try {
    const emps = Object.keys(EMPREENDIMENTOS);
    const results = await Promise.all(emps.map(async k => {
      const c = EMPREENDIMENTOS[k];
      const [jRec, jDesp] = await Promise.all([
        fetchSheet(c.abaReceitas, c.sheetId),
        fetchSheet(c.abaDespesas, c.sheetId),
      ]);
      // Modelo 2 abas com detecção de colunas pelo cabeçalho
      const outRec = parseReceitasRows(parseSheet(jRec));
      const ap = outRec.aportes.map(r=>({socio:'—',data:r.data,valor:r.valor}));
      const rend = outRec.rendimentos.reduce((s,r)=>s+r.valor,0);
      const rowsD = parseSheet(jDesp);
      const MD = detectCols(rowsD, "desp");
      const ret = rowsD.map(r => {
          const catU = _audNorm(String(r[MD.cat]||''));
          if (!(catU.includes('RETIRADA')||catU.includes('EQUILIBRIO')||catU.includes('GRATIFICA')||(catU.includes('DEVOLU')&&catU.includes('AFAC')))) return null;
          return { socio:'—', data: normalizeDate(String(r[MD.data]||'').trim()), valor: Math.abs(parseVal(r[MD.val])) };
        }).filter(r => r && r.data && r.valor > 0 && parseDate(r.data));
      const tAp  = ap.reduce((s,r)=>s+r.valor,0);
      const tRet = ret.reduce((s,r)=>s+r.valor,0);
      let cdi = 0;
      try { if (ap.length) { const rows = calcCDI(ap, ret); cdi = rows[rows.length-1]?.custoCDI_acum || 0; } } catch(e) {}
      // Volume de compras: despesas completas da obra (fluxos de sócio já fora)
      const desp = parseDespesasRows(rowsD);
      // tributos sobre a aplicação (IRRF e IOF) pagos por esta SPE
      const rendTrib = rendApuracao(desp, outRec.rendimentos).tributos;
      // série de caixa desta SPE, para o comparativo das três obras
      const caixa = caixaSerie(desp, outRec.receitas, outRec.aportes, ret, outRec.rendimentos).linhas;
      const porMes = {}, porAno = {}, porForn = {}, porCat = {};
      desp.forEach(r => {
        const d = parseDate(r.data); if (!d) return;
        const ym = d.getFullYear()*100 + (d.getMonth()+1);
        porMes[ym] = (porMes[ym]||0) + r.valor;
        porAno[d.getFullYear()] = (porAno[d.getFullYear()]||0) + r.valor;
        const catk = r.categoria || '(sem categoria)';
        (porCat[catk] = porCat[catk] || {total:0, u12:0}).total += r.valor;
        if ((new Date()-d) < 366*86400000) porCat[catk].u12 += r.valor;
        // chave canônica do fornecedor (une LTDA/ME/EPP e variações entre obras)
        const fk = _audNorm(r.fornecedor).replace(/\b(LTDA|ME|EPP|EIRELI|S\/?A)\b\.?/g,'').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
        if (!fk || fk==='—') return;
        const F = (porForn[fk] = porForn[fk] || { nome:r.fornecedor, total:0, n:0, u12:0, anos:{}, meses:{}, pagtos:[] });
        F.total += r.valor; F.n++;
        F.pagtos.push({ d:r.data, desc:r.descOriginal, cat:r.categoria, v:r.valor });
        F.anos[d.getFullYear()] = (F.anos[d.getFullYear()]||0) + r.valor;
        F.meses[ym] = (F.meses[ym]||0) + r.valor;
        if ((new Date()-d) < 366*86400000) F.u12 += r.valor;
      });
      return { key:k, nome:c.nome, cor:c.cor, tAp, tRet, exposto:tAp-tRet, nAp:ap.length, nRet:ret.length, cdi, rend, rendTrib, caixa, porMes, porAno, porForn, porCat, tDesp: desp.reduce((s,r)=>s+r.valor,0) };
    }));
    window._consolData = results;
    paintConsolidado(results);
    window._volData = results;
    volPaint(_volForn);
  } catch(err) {
    el.innerHTML = `<div class="error-box" style="margin:40px auto">
      <h3>Erro ao consolidar</h3><p>${err.message}</p>
      <button onclick="renderConsolidado(true)" style="margin-top:16px;background:#21262d;color:#e6edf3;border:1px solid #21262d;border-radius:6px;padding:8px 20px;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px">↻ Tentar novamente</button>
    </div>`;
  }
}

function audContexto(titulo){
  for (const c of AUD_CONTEXTO) if (c.re.test(titulo||'')) return c;
  return { agrupar:'nenhum', impacto:'', acao:[] };
}

// Separa o item da auditoria nas suas partes para dar hierarquia ao relatório:
// o movimento de categoria (DE → PARA) é a informação que gera a ação e vira destaque.
function _audParseItem(it){
  let s = String(it.s||'');
  let data = '', de = '', para = '', desc = s;
  const mData = desc.match(/^(\d{2}\/\d{2}\/\d{4})\s*·\s*/);
  if (mData) { data = mData[1]; desc = desc.slice(mData[0].length); }
  const mMove = desc.match(/lan[çc]ado em:\s*(.+?)\s*(?:→|->)\s*sugerida:\s*(.+)$/i);
  if (mMove) { de = mMove[1].trim(); para = mMove[2].trim(); desc = desc.slice(0, mMove.index).replace(/\s*·\s*$/,''); }
  else {
    const mSug = desc.match(/(?:→|->)\s*sugerida?:?\s*(.+)$/i);
    if (mSug) { para = mSug[1].trim(); desc = desc.slice(0, mSug.index).replace(/\s*·\s*$/,''); }
  }
  desc = desc.replace(/^[·\s]+/,'').replace(/[·\s]+$/,'');
  const bruto = String(it.v||'');
  const num = parseVal(bruto.replace(/^[^\d-]*/,'').replace(/[^\d.,-]/g,'')) || 0;
  return { data, desc, de, para, quem: String(it.t||'—'), valor: bruto, num };
}

// ═══ Relatório de correção — documento de trabalho para o financeiro ═══
// Abre em papel A4 com a lista completa do achado, coluna de conferência e
// campos de responsável/data. Impressão nativa gera o PDF para enviar.
window.fecharRelatorioAud = function(){
  const o=document.getElementById('audRelOv'); if(o) o.remove();
  document.body.classList.remove('print-aud'); document.body.style.overflow='';
};
// print-aud faz o overlay sair do modo fixed na impressão — sem isso o navegador
// repete o mesmo quadro em todas as páginas e a lista nunca sai.
// A classe print-aud vive junto com o overlay, nunca em timer. Antes ela era removida
// 1,5 s depois de window.print(): no celular a pré-visualização ainda estava sendo
// montada quando a classe caía, e a regra de fallback (que esconde tudo fora das abas
// de relatório) tornava a página inteira invisível — PDF em branco.
// ═══ Impressão isolada ═══
// Tentar imprimir a página viva escondendo tudo em volta se mostrou frágil: qualquer
// regra de visibilidade que escape produz folha em branco, e o comportamento varia
// entre navegador de celular e de desktop. Agora o relatório é escrito num documento
// PRÓPRIO, dentro de um iframe, contendo só o papel e as folhas de estilo da página.
// O que se imprime é esse documento — não há nada em volta para dar errado.
function relImprimirIsolado(papelHTML){
  const velho = document.getElementById('relPrintFrame');
  if (velho) velho.remove();
  const ifr = document.createElement('iframe');
  ifr.id = 'relPrintFrame';
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;visibility:hidden';
  document.body.appendChild(ifr);
  const estilos = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const links   = [...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.outerHTML).join('');
  const doc = ifr.contentDocument || (ifr.contentWindow && ifr.contentWindow.document);
  if (!doc) { window.print(); return; }
  doc.open();
  doc.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">'
    + '<title>' + (window._relTitulo || ('Relatorio - ' + (CFG && CFG.nome ? CFG.nome : 'Formes'))) + '</title>'
    + links + '<style>' + estilos + '</style>'
    + '<style>'
    + '@page{size:A4;margin:12mm 11mm}'
    + 'html,body{background:#fff !important;margin:0;padding:0;height:auto;overflow:visible}'
    + '#audRelOv{position:static !important;inset:auto !important;background:#fff !important;'
    +   'padding:0 !important;margin:0 !important;overflow:visible !important;display:block !important;z-index:auto !important}'
    + '#audRelOv .papel,#audRelOv .papel-auto{max-width:none !important;margin:0 !important;'
    +   'border-radius:0 !important;box-shadow:none !important;padding:0 !important}'
    + '.no-print,#relFab{display:none !important}'
    + '*{-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    + '</style></head><body class="print-aud"><div id="audRelOv">' + papelHTML + '</div></body></html>');
  doc.close();
  // O navegador usa o título do documento como nome do arquivo. Em alguns celulares
  // a impressão do iframe cai para a janela principal — então o título dela também
  // é ajustado, e restaurado depois.
  const tituloOriginal = document.title;
  const nome = window._relTitulo || ('Relatorio - ' + (CFG && CFG.nome ? CFG.nome : 'Formes'));
  document.title = nome;
  const restaurar = () => { document.title = tituloOriginal; window.removeEventListener('afterprint', restaurar); };
  window.addEventListener('afterprint', restaurar);
  const disparar = () => {
    try { ifr.contentWindow.focus(); ifr.contentWindow.print(); }
    catch(e) { window.print(); }
  };
  const esperar = () => {
    // dá tempo de as fontes e as imagens dos gráficos entrarem antes de imprimir
    const w = ifr.contentWindow;
    if (w && w.document && w.document.fonts && w.document.fonts.ready)
      w.document.fonts.ready.then(()=>setTimeout(disparar, 250)).catch(()=>setTimeout(disparar, 400));
    else setTimeout(disparar, 450);
  };
  if (doc.readyState === 'complete') esperar(); else ifr.onload = esperar;
}
window.imprimirRelatorioAud = function(){
  const papel = document.getElementById('audRelPapel');
  if (!papel) { window.print(); return; }
  relImprimirIsolado(papel.outerHTML);
};
window.gerarRelatorioAud = function(i){
  const data = window._auditData; if(!data || !data.alerts[i]) return;
  const a = data.alerts[i];
  window._relTitulo = 'Auditoria - ' + String(a.titulo).replace(/[^\wÀ-ÿ \-]/g,'').slice(0,44) + ' - ' + (CFG.nome||'').replace(/\s+Resid[êe]ncia$/i,'');
  const hoje = new Date().toLocaleDateString('pt-BR');
  let ultData=null; (_DESPESAS||[]).forEach(r=>{ const d=parseDate(r.data); if(d&&(!ultData||d>ultData)) ultData=d; });
  // Padrão de todo relatório: maior valor primeiro, para que a correção mais
  // relevante seja feita antes. Itens sem valor legível preservam a ordem original.
  const itens = a.itens.map(_audParseItem)
    .map((x,i)=>({x,i}))
    .sort((p,q2)=> (q2.x.num||0)-(p.x.num||0) || p.i-q2.i)
    .map(o=>o.x);
  const nMostrados = itens.length, nTotal = a.total || nMostrados;

  const CTX = audContexto(a.titulo);
  // agrupamento conforme o tema: por reclassificação, por favorecido, ou lista única
  const grupos = new Map();
  itens.forEach(x=>{
    let chave, rot;
    if (CTX.agrupar==='movimento' && x.para) { chave = (x.de||'(sem categoria)')+'⟶'+x.para; rot = {de:x.de||'(sem categoria)', para:x.para}; }
    else if (CTX.agrupar==='quem') { chave = 'Q:'+(x.quem||'—'); rot = {quem: x.quem||'—'}; }
    else { chave = '__sem__'; rot = null; }
    if(!grupos.has(chave)) grupos.set(chave, {de:rot&&rot.de||'', para:rot&&rot.para||'', quem:rot&&rot.quem||'', itens:[], v:0});
    const g = grupos.get(chave); g.itens.push(x); g.v += (x.num||0);
  });
  grupos.forEach(g=>g.itens.sort((p,q2)=>(q2.num||0)-(p.num||0)));
  const listaG = [...grupos.values()].sort((g1,g2)=>g2.v-g1.v);
  const comMov = listaG.filter(g=>g.para);
  const totalV = listaG.reduce((s,g)=>s+g.v,0);
  const cab = (g, obs) => `<tr class="grp"><th colspan="5">`
    + (g && g.para ? `<span class="grp-de">${g.de}</span> <span class="rel-seta">⟶</span> <span class="grp-para">${g.para}</span>`
      : g && g.quem ? `<span class="grp-para">${g.quem}</span>`
      : '<span class="grp-para">Lançamentos apontados</span>')
    + `<span class="grp-meta">${obs}</span></th></tr>`;
  const colunas = `<tr><th style="width:5%">#</th><th style="width:4%">✓</th><th style="width:10%">Data</th><th style="width:63%">Favorecido e descritivo</th><th style="width:18%" class="num">Valor</th></tr>`;
  let n = 0;
  const tabelaGrupo = g => `<table>
      <thead>${cab((g.para||g.quem)?g:null, (g.v>0?fmt(g.v)+' · ':'')+g.itens.length+' lançamento'+(g.itens.length>1?'s':''))}${colunas}</thead>
      <tbody>${g.itens.map(x=>{ n++; return `<tr>
        <td class="rel-n">${n}</td>
        <td class="rel-check">☐</td>
        <td class="rel-data">${x.data||'—'}</td>
        <td><div class="rel-quem">${x.quem}</div>${x.desc?`<div class="rel-desc">${x.desc}</div>`:''}</td>
        <td class="num rel-valor">${x.valor}</td></tr>`; }).join('')}
      </tbody></table>`;

  let ov = document.getElementById('audRelOv');
  if (!ov) { ov = document.createElement('div'); ov.id='audRelOv'; document.body.appendChild(ov); }
  ov.style.cssText = 'position:fixed;inset:0;background:#000c;z-index:1000;overflow:auto;padding:16px';
  document.body.classList.add('print-aud');   // alvo de impressão enquanto o overlay existir
  ov.innerHTML = `
    <div class="no-print" style="max-width:920px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:8px">
      <button onclick="fecharRelatorioAud()" style="background:var(--surface-3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 16px;cursor:pointer;font-family:var(--font)">← fechar</button>
      <button onclick="imprimirRelatorioAud()" style="background:#6C8FB5;color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font-family:var(--font);font-weight:600">🖨️ Imprimir / Salvar PDF</button>
    </div>
    <div class="papel" id="audRelPapel">
      <div class="rel-eyebrow">Formes Engenharia · ${CFG.nome} · ordem de serviço — financeiro</div>
      <h1>${a.titulo}</h1>
      <div class="rel-meta">emitido em ${hoje}${ultData?' · dados até '+ultData.toLocaleDateString('pt-BR'):''} · <strong>${nTotal} lançamento(s)</strong>${nTotal>nMostrados?` · ${nMostrados} listados (maiores valores)`:''}${totalV>0?` · total ${fmt(totalV)}`:''} · <em>ordenado do maior para o menor valor</em></div>
      <div class="rel-achado"><strong>O que foi encontrado:</strong> ${a.resumo||a.titulo}</div>
      ${CTX.impacto?`<h2>Por que isso importa para o negócio</h2>
      <div class="rel-impacto">${CTX.impacto}</div>`:''}
      <h2>Providência</h2>
      <div class="rel-inst">${CTX.acao&&CTX.acao.length
        ? `<ol class="rel-passos">${CTX.acao.map(p=>`<li>${p}</li>`).join('')}</ol>`
        : ''}<div class="rel-criterio"><strong>Critério do apontamento:</strong> ${a.pergunta}</div></div>

      ${CTX.agrupar==='movimento'&&comMov.length?`<h2>Resumo — corrija em lote, um bloco por vez</h2>
      <table class="rel-sum"><thead><tr>
        <th style="width:36%">De (categoria atual)</th><th style="width:4%"></th><th style="width:36%">Para (categoria correta)</th><th style="width:14%" class="num">Valor</th><th style="width:10%" class="num">Lançtos</th>
      </tr></thead><tbody>
        ${comMov.map(g=>`<tr><td class="rel-de">${g.de}</td><td class="rel-seta">⟶</td><td class="rel-para">${g.para}</td><td class="num rel-valor">${fmt(g.v)}</td><td class="num">${g.itens.length}</td></tr>`).join('')}
        <tr><td colspan="3">Total a reclassificar</td><td class="num rel-valor">${fmt(comMov.reduce((s,g)=>s+g.v,0))}</td><td class="num">${comMov.reduce((s,g)=>s+g.itens.length,0)}</td></tr>
      </tbody></table>`:''}

      <h2>Lançamentos${CTX.agrupar==='movimento'&&comMov.length?' agrupados por reclassificação':CTX.agrupar==='quem'?' agrupados por favorecido':''}</h2>
      ${listaG.map(tabelaGrupo).join('')}

      <h2>Conferência</h2>
      <div class="rel-conf">
        <div>Responsável pela correção: <span class="rel-linha"></span> Data: <span class="rel-linha-c"></span></div>
        <div>Corrigidos: <span class="rel-linha-p"></span> Mantidos como estão: <span class="rel-linha-p"></span> <span class="rel-desc" style="display:inline">(justificar no verso)</span></div>
        <div>Conferido por: <span class="rel-linha"></span> Data: <span class="rel-linha-c"></span></div>
      </div>
      <div class="rel-rodape">Gerado pelo painel gerencial em ${hoje}. Cada item é um ponto de verificação documental (NF, comprovante, medição), não uma acusação — falsos positivos são esperados e devem ser marcados como mantidos, com justificativa.</div>
    </div>`;
  document.body.style.overflow='hidden';
};

async function runAuditoria(progressCb) {
  const alerts = [];
  const D = _DESPESAS, AP = _APORTES, RT = _RETIRADAS;
  const totalD = D.reduce((s,r)=>s+r.valor,0);
  const say = m => { if(progressCb) progressCb(m); };

  // ── 1. COMPRAS DESPROPORCIONAIS (outliers estatísticos por categoria) ──
  say("Analisando valores fora da curva...");
  { // Estatística ROBUSTA. Média e desvio-padrão não servem aqui: a despesa de obra é
    // muito assimétrica (centenas de compras pequenas e poucas grandes), então a média
    // fica baixa, o desvio fica inflado pelos próprios grandes valores, e compra normal
    // de concreto vira "fora da curva". Usamos mediana, MAD e quartis — que os valores
    // extremos não deslocam — mais um piso de materialidade.
    const quant=(arr,p)=>{ const s=[...arr].sort((a,b)=>a-b); const i=(s.length-1)*p;
      const lo=Math.floor(i), hi=Math.ceil(i); return lo===hi? s[lo] : s[lo]+(s[hi]-s[lo])*(i-lo); };
    const byCat={};
    D.forEach(r=>{(byCat[r.categoria]=byCat[r.categoria]||[]).push(r);});
    const outliers=[];
    Object.entries(byCat).forEach(([cat,arr])=>{
      if(arr.length<12) return;                       // amostra pequena não gera estatística confiável
      const vals=arr.map(r=>r.valor);
      const total=vals.reduce((a,b)=>a+b,0);
      const med=quant(vals,.5), q1=quant(vals,.25), q3=quant(vals,.75), iqr=q3-q1;
      const mad=quant(vals.map(v=>Math.abs(v-med)),.5);
      // piso de materialidade: só interessa o que move o custo da obra
      const piso=Math.max(10000, total*0.01);
      // A âncora é o TERCEIRO QUARTIL, não a mediana: numa categoria que mistura
      // parafuso e concreto, a mediana também fica baixa e compra grande legítima
      // seria apontada. Q3 representa o teto das compras rotineiras.
      const limiar = Math.max(q3 + 3*iqr, 5*q3);       // Tukey extremo OU 5× o teto rotineiro
      arr.forEach(r=>{
        if (r.valor < piso || r.valor < limiar) return;
        outliers.push({ r, cat, med, q3, limiar,
          mult: med>0 ? r.valor/med : 0,
          multQ3: q3>0 ? r.valor/q3 : 0,
          pctCat: total>0 ? r.valor/total*100 : 0 });
      });
    });
    outliers.sort((a,b)=>b.r.valor-a.r.valor);         // dinheiro primeiro, não o desvio
    if(outliers.length) alerts.push({ sev:"alta", icon:"📦",
      titulo:"Compras com valor desproporcional à própria categoria",
      resumo:outliers.length+" lançamento(s) acima do teto das compras rotineiras da própria categoria",
      pergunta:"O critério não usa média nem mediana como referência: numa categoria que mistura parafuso e concreto, as duas ficam baixas e toda compra grande legítima seria apontada. A âncora é o TERCEIRO QUARTIL — o teto das compras rotineiras da própria categoria — e só entra o que supera cinco vezes esse teto (ou o limite extremo de Tukey), com valor material de pelo menos R$ 10 mil ou 1% do gasto da categoria. Para cada item: há orçamento, nota fiscal e medição que justifiquem? O quantitativo é compatível com a fase da obra?",
      total: outliers.length, itens:outliers.slice(0, 500).map(o=>_audItem(
        o.r.fornecedor, o.r.data+" · "+o.cat+" · "+o.r.descricao+" · compras rotineiras da categoria vão até "+fmt(o.q3)+" (mediana "+fmt(o.med)+") — este é "+o.multQ3.toFixed(1)+"× esse teto e representa "+o.pctCat.toFixed(1)+"% do gasto da categoria",
        fmt(o.r.valor), "#BF6B60")) });
  }

  // ── 2. POSSÍVEIS PAGAMENTOS DUPLICADOS ──
  say("Procurando pagamentos duplicados...");
  { const seen={}; const dups=[];
    D.forEach(r=>{ if(r.valor<500) return;
      const k=_audNorm(r.fornecedor)+"|"+r.valor;
      (seen[k]=seen[k]||[]).push(r); });
    Object.values(seen).forEach(arr=>{
      if(arr.length<2) return;
      arr.sort((a,b)=>parseDate(a.data)-parseDate(b.data));
      for(let i=1;i<arr.length;i++){
        const dias=(parseDate(arr[i].data)-parseDate(arr[i-1].data))/86400000;
        if(dias<=7) dups.push([arr[i-1],arr[i],dias]);
      }});
    if(dups.length) alerts.push({ sev:"alta", icon:"👯",
      titulo:"Possíveis pagamentos em duplicidade",
      resumo:dups.length+" par(es): mesmo fornecedor, mesmo valor, até 7 dias de intervalo",
      pergunta:"Mesmo fornecedor recebendo o mesmo valor em datas muito próximas. São parcelas legítimas de um contrato, ou o mesmo título pago duas vezes? Confira os comprovantes bancários e as notas fiscais de cada par.",
      total: dups.length, itens:dups.slice(0, 500).map(([a,b,d])=>_audItem(
        a.fornecedor, a.data+" e "+b.data+" ("+Math.round(d)+"d de intervalo) · "+a.descricao,
        "2× "+fmt(a.valor), "#BF6B60")) });
  }

  // ── 3. TRANSFERÊNCIAS A PARTES RELACIONADAS ──
  say("Verificando partes relacionadas...");
  { const kws=[]; (CFG.nomesMap||[]).forEach(m=>{ kws.push(...m.match, m.nome); });
    const kwSet=[...new Set(kws.map(_audNorm))].filter(k=>k.length>=5);
    const rel=D.filter(r=>{ const f=_audNorm(r.fornecedor)+" "+_audNorm(r.descOriginal);
      return kwSet.some(k=>f.includes(k)); });
    const totRel=rel.reduce((s,r)=>s+r.valor,0);
    if(rel.length) alerts.push({ sev:"media", icon:"🔁",
      titulo:"Pagamentos envolvendo sócios / partes relacionadas",
      resumo:rel.length+" lançamento(s) · "+fmt(totRel)+" ("+(totRel/totalD*100).toFixed(1)+"% das despesas)",
      pergunta:"Despesas cujo fornecedor ou descritivo menciona sócios ou empresas ligadas. Não é necessariamente irregular, mas exige lastro: há contrato, deliberação em ata ou reembolso documentado para cada uma? Estão a valor de mercado?",
      total: rel.length, itens:rel.sort((a,b)=>b.valor-a.valor).slice(0, 500).map(r=>_audItem(
        r.fornecedor, r.data+" · "+r.categoria+" · "+r.descricao, fmt(r.valor), "#C4A55C")) });
  }

  // ── 4. VALORES REDONDOS POR FORNECEDOR ──
  { const byF={};
    D.forEach(r=>{(byF[r.fornecedor]=byF[r.fornecedor]||[]).push(r);});
    const suspeitos=[];
    Object.entries(byF).forEach(([f,arr])=>{
      if(arr.length<5) return;
      const redondos=arr.filter(r=>r.valor>=1000 && r.valor%1000===0);
      const pct=redondos.length/arr.length;
      if(pct>=0.7){ suspeitos.push({f,n:arr.length,nr:redondos.length,pct,tot:arr.reduce((s,r)=>s+r.valor,0)}); }});
    if(suspeitos.length) alerts.push({ sev:"media", icon:"🎯",
      titulo:"Fornecedores com excesso de valores redondos",
      resumo:suspeitos.length+" fornecedor(es) com ≥70% dos pagamentos em múltiplos exatos de R$ 1.000",
      pergunta:"Notas fiscais reais raramente fecham em milhares exatos com tanta frequência (impostos e quantitativos geram quebrados). Estes pagamentos têm NF ou são adiantamentos/acertos informais? Onde está a medição que os suporta?",
      itens:suspeitos.sort((a,b)=>b.tot-a.tot).map(s=>_audItem(
        s.f, s.nr+" de "+s.n+" pagamentos redondos ("+(s.pct*100).toFixed(0)+"%)", fmt(s.tot), "#C4A55C")) });
  }

  // ── 5. CONCENTRAÇÃO DE FORNECEDOR ──
  { const byF={};
    D.forEach(r=>byF[r.fornecedor]=(byF[r.fornecedor]||0)+r.valor);
    const rank=Object.entries(byF).sort((a,b)=>b[1]-a[1]);
    if(rank.length){ const [topF,topV]=rank[0]; const share=topV/totalD*100;
      if(share>25) alerts.push({ sev:share>40?"alta":"media", icon:"🏗",
        titulo:"Alta concentração em um único fornecedor",
        resumo:topF+" concentra "+share.toFixed(1)+"% de todas as despesas ("+fmt(topV)+")",
        pergunta:"Concentração elevada aumenta risco de dependência e de sobrepreço. Houve cotação com concorrentes? Os preços unitários deste fornecedor foram comparados com o mercado recentemente? Veja o detalhamento na aba 🏪 Fornecedores.",
        total: rank.length, itens:rank.slice(0, 500).map(([f,v],i)=>_audItem((i+1)+"º · "+f,(v/totalD*100).toFixed(1)+"% das despesas",fmt(v),i===0?"#BF6B60":"#e6edf3")) }); }
  }

  // ── 6. APORTES × RETIRADAS DESIGUAIS ENTRE SÓCIOS ──
  say("Comparando aportes e retiradas por sócio...");
  { const apS={},rtS={};
    AP.forEach(r=>apS[r.socio]=(apS[r.socio]||0)+r.valor);
    RT.forEach(r=>rtS[r.socio]=(rtS[r.socio]||0)+r.valor);
    const tAp=AP.reduce((s,r)=>s+r.valor,0), tRt=RT.reduce((s,r)=>s+r.valor,0);
    const socios=[...new Set([...Object.keys(apS),...Object.keys(rtS)])];
    let maxDiff=0; const linhas=[];
    socios.forEach(s=>{
      const pa=tAp>0?(apS[s]||0)/tAp*100:0, pr=tRt>0?(rtS[s]||0)/tRt*100:0;
      const diff=pr-pa; maxDiff=Math.max(maxDiff,Math.abs(diff));
      linhas.push(_audItem(s,
        "aportou "+fmt(apS[s]||0)+" ("+pa.toFixed(1)+"%) · retirou "+fmt(rtS[s]||0)+" ("+pr.toFixed(1)+"%)",
        (diff>=0?"+":"")+diff.toFixed(1)+" p.p.", Math.abs(diff)>5?"#BF6B60":"#6D9E7F"));
    });
    if(tRt>0 && maxDiff>5) alerts.push({ sev:maxDiff>15?"alta":"media", icon:"⚖️",
      titulo:"Retiradas em proporção diferente dos aportes",
      resumo:"Divergência máxima de "+maxDiff.toFixed(1)+" p.p. entre share de aporte e share de retirada",
      pergunta:"Um sócio está retirando proporcionalmente mais (ou menos) do que aportou. Existe deliberação formal autorizando essa assimetria (equilíbrio de aportes, gratificação em ata)? O saldo será compensado — quando e como?",
      itens:linhas });
    else if(tRt>0) alerts.push({ sev:"info", icon:"⚖️",
      titulo:"Proporção sócio a sócio: aportes × retiradas",
      resumo:"Divergência máxima de apenas "+maxDiff.toFixed(1)+" p.p. — dentro do razoável",
      pergunta:"Sem assimetria relevante detectada. Acompanhe este indicador após cada nova retirada.",
      itens:linhas });
  }

  // ── 6a. RETIRADAS GÊMEAS (possível digitação dupla em fluxo de sócio) ──
  { const porK={};
    RT.filter(r=>r.cat!=="Devolução de AFAC").forEach(r=>{
      const k=(r.socio||"—")+"|"+r.valor;
      (porK[k]=porK[k]||[]).push(r); });
    const gemeas=[];
    Object.values(porK).forEach(arr=>{
      if(arr.length<2||arr[0].valor<50000) return;
      arr.sort((a,b)=>parseDate(a.data)-parseDate(b.data));
      for(let i=1;i<arr.length;i++){
        const dias=(parseDate(arr[i].data)-parseDate(arr[i-1].data))/86400000;
        if(dias>0 && dias<=30) gemeas.push([arr[i-1],arr[i],dias]);
      }});
    if(gemeas.length) alerts.push({ sev:"alta", icon:"👥",
      titulo:"Retiradas idênticas em datas próximas (verificação bancária obrigatória)",
      resumo:gemeas.length+" par(es) de retiradas do mesmo sócio, mesmo valor, em até 30 dias",
      pergunta:"Fluxo de sócio duplicado é o erro de lançamento mais caro que existe: ou houve de fato duas retiradas (confirmar no extrato os dois débitos), ou a segunda é digitação dupla e o painel está superestimando as retiradas. Conferir extrato bancário das duas datas de cada par.",
      itens:gemeas.map(([a,b,d])=>_audItem(a.socio||"—", a.data+" e "+b.data+" ("+Math.round(d)+"d) · "+a.cat, "2× "+fmt(a.valor), "#BF6B60")) });
  }

  // ── 6b. DEVOLUÇÃO DE AFAC × AFACs RECEBIDOS ──
  { const devAfac = RT.filter(r=>r.cat==="Devolução de AFAC");
    const totDev = devAfac.reduce((s,r)=>s+r.valor,0);
    const totAfac = AP.reduce((s,r)=>s+r.valor,0);
    if (totDev > 0 && totDev > totAfac) alerts.push({ sev:"alta", icon:"🏦",
      titulo:"Devolução de AFAC maior que os AFACs registrados",
      resumo:"Devolvido "+fmt(totDev)+" com apenas "+fmt(totAfac)+" de AFACs nas receitas",
      pergunta:"Devolver mais capital do que o registrado como aportado indica que os aportes originais não estão nesta planilha (entraram antes do início do registro?) ou foram lançados em outra rubrica. Localizar os contratos de AFAC originais e conciliar — sem isso, o capital exposto real do investidor fica invisível ao painel.",
      itens:devAfac.map(r=>_audItem(r.socio||"—", r.data+" · Devolução de AFAC", fmt(r.valor), "#BF6B60")) });
  }

  // ══ QUALIDADE DOS LANÇAMENTOS (auditoria do trabalho de registro) ══
  say("Auditando a qualidade dos lançamentos...");
  { const q = window._qualidade || {};
    // Q1. Lançamentos descartados por data/valor inválidos
    const dd = q.despDescartadas || [];
    if (dd.length) alerts.push({ sev: dd.length>10?"alta":"media", icon:"🧾",
      titulo:"Lançamentos ilegíveis pelo painel (data ou valor inválidos)",
      resumo: dd.length+" linha(s) de despesa com dados incompletos — estão FORA de todos os números",
      pergunta:"Cada linha aqui é um pagamento que o painel não consegue processar: sem data válida na coluna D ou sem valor na coluna S. Corrigir na planilha e atualizar — enquanto isso, os totais estão subestimados.",
      total: dd.length, itens: dd.slice(0, 500).map(r=>_audItem(r.quem, "data: "+r.data+" · "+r.desc, String(r.val), "#BF6B60")) });
    // Q2. Retirada/AFAC com favorecido não reconhecido como sócio
    const sn = q.socioNulo || [];
    if (sn.length) alerts.push({ sev:"alta", icon:"👤",
      titulo:"Retirada/Devolução de AFAC com favorecido não reconhecido",
      resumo: sn.length+" lançamento(s) de fluxo de sócio cujo nome não bate com nenhum sócio configurado",
      pergunta:"Fluxos de sócio precisam ter o favorecido escrito de forma reconhecível. Ou o nome foi digitado diferente (corrigir na planilha), ou é um favorecido que NÃO deveria receber retirada (investigar).",
      total: sn.length, itens: sn.slice(0, 500).map(r=>_audItem(r.quem, r.data, fmt(r.val), "#BF6B60")) });
  }
  // Q3. Sem categoria ou categoria "Outros"
  { const sc = D.filter(r=>!r.categoria || r.categoria==="Outros" || r.categoria==="—");
    const tot = sc.reduce((s,r)=>s+r.valor,0);
    if (sc.length) alerts.push({ sev: tot>50000?"media":"info", icon:"🏷",
      titulo:"Despesas sem categoria definida",
      resumo: sc.length+" lançamento(s) · "+fmt(tot),
      pergunta:"Lançamento sem categoria não entra em nenhuma análise de custo. Definir a categoria correta na coluna AC de cada um.",
      total: sc.length, itens: sc.sort((a,b)=>b.valor-a.valor).slice(0, 500).map(r=>_audItem(r.fornecedor, r.data+" · "+r.descricao, fmt(r.valor), "#C4A55C")) });
  }
  // Q4. Fornecedor ausente
  { const sf = D.filter(r=>r.fornecedor==="—" && r.valor>=1000);
    if (sf.length) alerts.push({ sev:"info", icon:"❓",
      titulo:"Pagamentos sem fornecedor identificado",
      resumo: sf.length+" lançamento(s) ≥ R$1.000 sem o nome do favorecido",
      pergunta:"Sem o favorecido, o pagamento não entra no ranking de fornecedores nem na análise de concentração. Quem recebeu cada um?",
      total: sf.length, itens: sf.sort((a,b)=>b.valor-a.valor).slice(0, 500).map(r=>_audItem("(sem fornecedor)", r.data+" · "+r.descricao, fmt(r.valor), "#C4A55C")) });
  }
  // Q5. Classificação divergente do descritivo (regras palavra-chave → categoria esperada)
  { const FAMILIAS = [
      { kw:["CIMENTO","ACO CA","VERGALH","PORCELANATO","BLOCO","ARGAMASSA","TELHA","TINTA ","GRANITO","CALACATA","AREIA","BRITA","ATERRO","CARRADA"], marca:"MATERIA", sug:"Fornecedor - Aquisição de materiais" },
      { kw:["MINI RETRO","RETROESCAV","RETRO ESCAV"," RETRO"," MAQUINA","ESCAVADEIRA","CACAMBA","ROLO COMPACTADOR","HORAS DE MAQ","DIARIA DE MAQ","DIARIAS DE MAQ"], marca:"ALUGUEL", sug:"Aluguel de Equipamentos" },
      { kw:["FOLHA","MAO DE OBRA","MESTRE"], marca:"MAO DE OBRA", sug:"Mão de obra - Mestre" },
      { kw:["EMPREITA","PEDREIRO","DIARIA"], marca:"MAO DE OBRA", sug:"Mão de obra - Terceiros" },
      { kw:["COMISSAO CORRETOR","COMISSAO DE VENDA"], marca:"COMISS", sug:"Comissão Corretor" },
    ];
    const RE_IMP=/\b(DARF|INSS|PIS|COFINS|IRPJ|CSLL|ISS)\b/;
    const WHITELIST=["JOSE MILTON","ROBERIO MESQUITA","ACPA","DENVER"];
    // ── Precedência 1: descritivo com "mão de obra" é SERVIÇO, não material.
    // "MÃO DE OBRA PORCELANATO" casava com material (porcelanato) e com MO, e a
    // ordem da lista fazia vencer material. Agora o serviço manda sempre.
    const RE_MO_DESC = /M[ÃA]O\s*-?\s*DE\s*-?\s*OBRA|\bMDO\b|EMPREITAD|EMPREITEIR|\bM\.?O\.?\s/;
    const RE_MO_MESTRE = /\bMESTRE\b|\bFOLHA\b/;
    // Precedência 1b: descritivo que descreve um SERVIÇO de obra, mesmo sem dizer
    // "mão de obra" — "SERVIÇOS ASSENTAMENTO PORCELANATO", "REBOCO DE GESSO".
    // A estrutura da frase separa serviço de produto: "REBOCO DE GESSO" é serviço,
    // "ESPONJA DE REBOCO" é material (o substantivo vem antes).
    const RE_MO_SERV = /\bSERVI[ÇC]OS?\s+(DE\s+)?(ASSENTAMENT|INSTALA|EXECU|MONTAGEM|COLOCA|PINTUR|ALVENARIA|IMPERMEABILIZA|ACABAMENT|PEDREIR|GESSO|EL[ÉE]TRIC|HIDR[ÁA]UL)|(ASSENTAMENT\w*|REBOCO|CHAPISCO|EMBO[ÇC]O|CONTRAPISO|LEVANTE|ALVENARIA)\s+(DE|DO|DA|DOS|DAS)\s/;
    // guardas: nota fiscal de produto, ferramenta de aplicar, e termos fiscais que
    // contêm "execução"/"aplicação" sem serem serviço de obra (ART do CREA, IRRF)
    const RE_NAO_SERV = /\bART\b|IRRF|\bIOF\b|\bDARF\b|S\/\s*APLICA|\bNF\b|ESPONJA|DESEMPENADEIRA|COLHER/;
    // ── Precedência 2: compra em depósito/loja de material é AQUISIÇÃO, mesmo que
    // o descritivo cite mestre ou obra. Lista extensível de fornecedores-depósito.
    const FORN_DEPOSITO = /\bJOEL\b|DEP[OÓ]SITO|DEPOSITO|MATERIAIS DE CONSTRU|MAT\.? CONSTRU|CONSTRU[ÇC][ÃA]O LTDA|HOME CENTER|LOJA DE MATERIA|COMERCIAL DE MATERIA|CASA DO CONSTRUTOR/;
    const RE_MATERIAL_DESC = /CIMENTO|ACO CA|VERGALH|PORCELANATO|BLOCO|ARGAMASSA|TELHA|TINTA|GRANITO|AREIA|BRITA|ATERRO|CARRADA|MATERIAL|MATERIAIS|FERRAGEM|MADEIRA|CANO|TUBO|FIO |CABO |REJUNTE|CERAMIC/;
    const hits=[];
    D.forEach(r=>{
      const dU=_audNorm(r.descOriginal), cU=_audNorm(r.categoria), fU=_audNorm(r.fornecedor);
      if (WHITELIST.some(w=>fU.includes(w))) return;
      if (cU.includes("PERMUTA")||cU.includes("DISTRAT")||cU.includes("ALUGUEL")||cU.includes("ALIMENTA")||cU.includes("SALARIO")) return;
      // Regras por fornecedor (precedência): Rafael Santos (infra de ar condicionado) = Mão de obra - Terceiros
      const FORN_REGRA=[{f:"RAFAEL SANTOS", marca:"MAO DE OBRA", sug:"Mão de obra - Terceiros"}];
      const FR=FORN_REGRA.find(x=>fU.includes(x.f));
      if (FR){ if(!cU.includes(FR.marca)) hits.push({r, sug:FR.sug}); return; }
      // Precedência 1 — serviço de mão de obra vence qualquer palavra de material
      const ehServicoObra = RE_MO_SERV.test(dU) && !RE_NAO_SERV.test(dU)
        && !/IMPOST|TRIBUT|TAXA|LICEN|ALVAR/.test(cU);
      if (RE_MO_DESC.test(dU) || ehServicoObra) {
        if (cU.includes("MAO DE OBRA")) return;                     // já está certo
        const sugMO = RE_MO_MESTRE.test(dU) ? "Mão de obra - Mestre" : "Mão de obra - Terceiros";

        total: over.length, itens:over.sort((a,b)=>(b.valReceb-b.valOrig)-(a.valReceb-a.valOrig)).slice(0, 500).map(r=>_audItem(
          r.cliente||"—", (r.dataComp||"—")+" · "+r.desc+" · contratado "+fmt(r.valOrig), fmt(r.valReceb), "#C4A55C")) });
      const seenR={}; const dupR=[];
      RC.forEach(r=>{ if(!r.valReceb) return;
        const k=_audNorm(r.cliente)+"|"+r.valReceb+"|"+(r.dataComp||"");
        if(seenR[k]) dupR.push(r); else seenR[k]=1; });
      if(dupR.length) alerts.push({ sev:"info", icon:"🧾",
        titulo:"Receitas possivelmente lançadas em duplicidade",
        resumo:dupR.length+" linha(s) com mesmo cliente, valor e data",
        pergunta:"Mesma parcela registrada duas vezes infla a receita e esconde inadimplência real. Confira no extrato bancário se o crédito entrou uma ou duas vezes.",
        total: dupR.length, itens:dupR.slice(0, 500).map(r=>_audItem(r.cliente||"—",(r.dataComp||"—")+" · "+r.desc,fmt(r.valReceb),"#6C8FB5")) });
    }
  } catch(e) { console.warn("Auditoria receitas:", e.message); }

  // ── 12. COMPARAÇÃO ENTRE AS 3 OBRAS (uso por categoria) ──
  say("Comparando as 3 obras em paralelo...");
  let cross=null;
  try {
    const emps=Object.keys(EMPREENDIMENTOS);
    const projs=await Promise.all(emps.map(async k=>{
      const c=EMPREENDIMENTOS[k];
      if(k===_urlEmp) { const tot=totalD; const cats={};
        D.forEach(r=>cats[r.categoria]=(cats[r.categoria]||0)+r.valor);
        return {key:k,nome:c.nome,cor:c.cor,tot,cats}; }
      const json=await fetchSheet(c.abaDespesas||"DESPESAS TOTAIS", c.sheetId);
      const desp=parseDespesasRows(parseSheet(json));
      const tot=desp.reduce((s,r)=>s+r.valor,0); const cats={};
      desp.forEach(r=>cats[r.categoria]=(cats[r.categoria]||0)+r.valor);
      return {key:k,nome:c.nome,cor:c.cor,tot,cats};
    }));
    const allCats={};
    projs.forEach(p=>Object.entries(p.cats).forEach(([c,v])=>allCats[c]=(allCats[c]||0)+v));
    const topCats=Object.entries(allCats).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([c])=>c);
    const linhas=topCats.map(cat=>{
      const pcts=projs.map(p=>p.tot>0?(p.cats[cat]||0)/p.tot*100:0);
      const media=pcts.reduce((a,b)=>a+b,0)/pcts.length;
      const atualIdx=projs.findIndex(p=>p.key===_urlEmp);
      const desvio=pcts[atualIdx]-media;
      return {cat,pcts,media,desvio,flag:Math.abs(desvio)>6&&media>1};
    });
    cross={projs,linhas};
    const flags=linhas.filter(l=>l.flag);
    if(flags.length) alerts.push({ sev:"media", icon:"🏘",
      titulo:"Categorias com uso desproporcional vs outras obras",
      resumo:flags.length+" categoria(s) desviam mais de 6 p.p. da média das 3 obras",
      pergunta:"As 3 obras são muito parecidas (duplex, execução sequenciada) — o percentual gasto por categoria deveria convergir. Onde "+CFG.nome+" gasta proporcionalmente mais: é fase de obra diferente, ou preço/consumo fora do padrão? Compare preço unitário e quantitativo com as obras irmãs.",
      itens:flags.map(l=>{
        const partes=cross.projs.map((p,i)=>p.nome.split(" ")[0]+" "+l.pcts[i].toFixed(1)+"%").join(" · ");
        return _audItem(l.cat, partes, (l.desvio>0?"+":"")+l.desvio.toFixed(1)+" p.p.", l.desvio>0?"#BF6B60":"#6C8FB5");}) });
  } catch(e) { console.warn("Auditoria cross-obra:", e.message); }

  const ordem={alta:0,media:1,info:2};
  alerts.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);
  return { alerts, benford, cross, geradoEm:new Date(), nDesp:D.length, totalD };
}

// ── NOTA BIMESTRAL: eficiência Material × Mão de Obra ajustada por entregas ──
const AUD_BENCH = 2.10;        // patamar saudável histórico (calibrado no Jazz)
const AUD_ENT_RE = /(PARA ENTREGA|P\/ ?ENTREGA|ENTREGA (?:DA )?(?:CS|CASA)|FAXINA ENTREGA|LIMPEZA.*ENTREGA|COMES|BEBES|COQUETEL|INAUGUR|BRINDE|PACOTE DE ENTREGAS)/;
const BIM_NOMES = ["jan-fev","mar-abr","mai-jun","jul-ago","set-out","nov-dez"];

function audBimestralHTML(){
  const bk = d => d.getFullYear()*10 + Math.floor(d.getMonth()/2);
  const mo={}, mat={};
  _DESPESAS.forEach(r=>{
    const d=parseDate(r.data); if(!d) return;
    const k=bk(d), cN=_audNorm(r.categoria);
    if(cN.includes("MAO DE OBRA")) mo[k]=(mo[k]||0)+r.valor;
    else if(cN.includes("MATERIA") && !cN.includes("ESCRIT")) mat[k]=(mat[k]||0)+r.valor;
  });
  // entregas: 1ª menção de cada casa em descritivo com sinal de entrega
  const first={};
  _DESPESAS.slice().sort((a,b)=>parseDate(a.data)-parseDate(b.data)).forEach(r=>{
    const D=_audNorm(r.descOriginal+" "+r.obs);
    if(!AUD_ENT_RE.test(D)) return;
    let m; const re=/(?:CS|CASA)\s*0?(\d{1,2})/g;
    while((m=re.exec(D))!==null){ const n=+m[1];
      if(n>=1&&n<=66&&!(n in first)) first[n]=bk(parseDate(r.data)); }
  });
  const entb={}; Object.values(first).forEach(k=>entb[k]=(entb[k]||0)+1);
  // entregas por quitação (receitas): casa quitada quando recebido >= 97% do contratado
  // só conta a partir da era de entregas detectada nos descritivos (evita venda quitada antes da entrega física)
  const era0=Object.keys(entb).length?Math.min(...Object.keys(entb).map(Number)):Infinity;
  let totalEntregues=Object.keys(first).length;
  if((_RECEITAS||[]).length && era0!==Infinity){
    const porCasa={};
    _RECEITAS.forEach(r=>{ if(!r.casa||!r.dataComp) return;
      (porCasa[r.casa]=porCasa[r.casa]||[]).push(r); });
    Object.entries(porCasa).forEach(([casa,arr])=>{
      if(casa in first) return;
      const tot=arr.reduce((s,r)=>s+(r.valOrig||0),0);
      if(tot<100000) return;
      arr.sort((a,b)=>parseDate(a.dataComp)-parseDate(b.dataComp));
      let cum=0;
      for(const r of arr){ cum+=(r.valReceb||0);
        if(cum>=tot*0.97){
          const d=parseDate(r.dataComp);
          if(d){ const k=bk(d); totalEntregues++;
            if(k>=era0) entb[k]=(entb[k]||0)+1; }
          break;
        } }
    });
  }
  const keys=Object.keys(mo).map(Number).filter(k=>mo[k]>=20000).sort((a,b)=>a-b);
  if(keys.length<3) return "";
  const linhas=keys.map(k=>{
    const r=(mat[k]||0)/mo[k];
    const e=entb[k]||0;
    const y=Math.floor(k/10), b=k%10;
    return {label:BIM_NOMES[b]+"/"+String(y).slice(2), r, e, era:k>=era0};
  }).slice(-12);
  const totalEntBim=Object.values(entb).reduce((s,v)=>s+v,0);
  const RMAX=Math.max(3, ...linhas.map(l=>l.r));
  const corR=r=>r>=2?"#6D9E7F":r>=1.5?"#C4A55C":"#BF6B60";
  return `
    <div class="section-title">Eficiência Bimestral — Material por R$1 de Mão de Obra${hintIcon("Indicador central: R$ de material de construção comprados para cada R$1,00 de mão de obra (mestre + terceiros) no bimestre. Base de custo estrita: só Obra Direta — comissões, impostos, permuta, salários administrativos e reembolsos ficam fora. Referência saudável: "+AUD_BENCH.toFixed(2)+" (média histórica). Verde ≥2,0 · laranja 1,5–1,99 · vermelho <1,5. Compras de material em lote distorcem bimestres isolados — leia tendências em pares. Entregas (🏠) são informativas: detectadas por descritivos + quitação nas receitas a partir da era de entregas.")}</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;margin-bottom:16px">
      <div class="mini-bars" style="height:120px;align-items:flex-end;position:relative">
        ${linhas.map(l=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">
          <div style="font-size:9px;font-weight:700;color:${corR(l.r)};font-family:'DM Mono',monospace">${l.r.toFixed(2)}</div>
          <div style="width:100%;height:86px;display:flex;align-items:flex-end;position:relative">
            <div style="position:absolute;left:0;right:0;bottom:${(AUD_BENCH/RMAX*100).toFixed(0)}%;border-top:1px dashed #A1A1A6;opacity:.6"></div>
            <div title="${l.label}: R$ ${l.r.toFixed(2)} de material por R$1 de MO · ${l.e} entrega(s)"
                 style="width:100%;height:${Math.min(l.r/RMAX*100,100).toFixed(0)}%;background:${corR(l.r)};border-radius:3px 3px 0 0;opacity:.92"></div>
          </div>
          <div style="font-size:7.5px;color:#A1A1A6;font-family:'DM Mono',monospace;white-space:nowrap">${l.label}</div>
          <div style="font-size:7px;color:#A1A1A6;font-family:'DM Mono',monospace">${l.era&&l.e?l.e+"🏠":"&nbsp;"}</div>
        </div>`).join("")}
      </div>
      <div style="font-size:10px;color:#A1A1A6;margin-top:10px;font-family:'DM Mono',monospace">${statusDot("#6D9E7F")}≥2,0 ${statusDot("#C4A55C")}1,5–1,99 ${statusDot("#BF6B60")}<1,5 · linha tracejada = referência ${AUD_BENCH.toFixed(2)} · 🏠 entregas no bimestre</div>
      <div style="font-size:11px;color:#e6edf3;margin-top:8px;border-top:1px solid #21262d;padding-top:8px;font-family:'DM Mono',monospace">🏠 <strong>${totalEntregues}</strong> casas entregues identificadas no total · <strong>${totalEntBim}</strong> com data confiável distribuídas nos bimestres</div>
    </div>`;
}
