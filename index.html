  for (const nome of nomes) {
    try {
      const json = await fetchSheet(nome);
      const rows = parseSheet(json);
      let hdr = -1, M = {};
      for (let i=0;i<Math.min(4,rows.length);i++){
        const cs = rows[i].map(c=>_audNorm(String(c||'')));
        const ic = cs.findIndex(c=>c==='CASA'); if (ic<0) continue;
        hdr=i;
        M = { casa:ic, cliente:cs.findIndex(c=>c.includes('CLIENTE')), status:cs.indexOf('STATUS'),
              dataVenda:cs.findIndex(c=>c.includes('DATA VENDA')), valor:cs.findIndex(c=>c.includes('VALOR VENDA')),
              comissao:cs.findIndex(c=>c.includes('COMISSAO PAGA')), nDist:cs.findIndex(c=>c.includes('DISTRATOS')&&c.startsWith('N')), recebDist:cs.findIndex(c=>c.includes('RECEBIDO DISTRAT')),
              devolvido:cs.findIndex(c=>c.includes('DEVOLVID')), comPerdidas:cs.findIndex(c=>c.includes('PERDIDAS')),
              ganhoRev:cs.findIndex(c=>c.includes('GANHO')), obs:cs.indexOf('OBS') };
        break;
      }
      if (hdr<0) {
        const primeira = rows[0] ? rows[0].map(c=>_audNorm(String(c||''))).join('|') : '';
        _GV_MOTIVO = primeira.includes('IDENTIFICADOR') || primeira.includes('FORNECEDOR') || primeira.includes('CLIENTE|')
          ? `o Google devolveu OUTRA aba no lugar de "${nome && nome.gid!==undefined?"gid "+nome.gid:nome}" (arquivo .xlsx em modo de compatibilidade — converta para Planilha Google nativa: Arquivo → Salvar como Planilhas Google)`
          : `aba "${nome && nome.gid!==undefined?"gid "+nome.gid:nome}" encontrada, mas sem a coluna CASA no cabeçalho`;
        continue;
      }
      _GV = rows.slice(hdr+1).map(r=>({
        casa: parseInt(String(r[M.casa]||'').replace(/\D/g,''))||0,
        cliente: String(r[M.cliente]||'').trim(),
        status: _audNorm(String(r[M.status]||'')),
        dataVenda: normalizeDate(String(M.dataVenda>=0?r[M.dataVenda]:'')||''),
        valor: Math.abs(parseVal(r[M.valor])),
        comissao: M.comissao>=0?Math.abs(parseVal(r[M.comissao])):0,
        nDist: M.nDist>=0?(parseInt(String(r[M.nDist]||'0'))||0):0,
        recebDist: M.recebDist>=0?Math.abs(parseVal(r[M.recebDist])):null,
        devolvido: M.devolvido>=0?Math.abs(parseVal(r[M.devolvido])):0,
        comPerdidas: M.comPerdidas>=0?Math.abs(parseVal(r[M.comPerdidas])):0,
        ganhoRev: M.ganhoRev>=0?parseVal(r[M.ganhoRev])||0:0,
        obs: M.obs>=0?String(r[M.obs]||'').trim():'',
      })).filter(r=>r.casa>0);
      if (_GV.length) { _GV_MOTIVO=''; return _GV; }
      _GV_MOTIVO = `aba "${nome && nome.gid!==undefined?"gid "+nome.gid:nome}" lida, mas 0 linhas com nº de casa válido`;
    } catch(e) { _GV_MOTIVO = String(e.message||e); }
  }
  _GV = [];
  return _GV;
}

async function loadVendas() {
  if (!CFG.abaVendas) return;
  try {
    const json = await fetchSheet(CFG.abaVendas);
    const rows = parseSheet(json).slice(2); // pula 2 linhas de cabeçalho
    _VENDAS = rows
      .map(r => {
        // Colunas VALORES DE VENDA:
        // B=1 Data, C=2 Unidade(nº casa), D=3 Cliente, E=4 Preço, F=5 Sinal,
        // G=6 Comissão, H=7 Bônus, I=8 ComissãoPaga, K=10 Corretor
        const data      = normalizeDate(String(r[1] || '').trim());
        const unidade   = parseInt(r[2]) || null;
        const cliente   = String(r[3] || '').trim();
        const preco     = Math.abs(parseVal(r[4]));
        const sinal     = Math.abs(parseVal(r[5]));
        const comissao  = Math.abs(parseVal(r[6]));
        const bonus     = Math.abs(parseVal(r[7]));
        const comPaga   = Math.abs(parseVal(r[8]));
        const corretor  = String(r[10]|| '').trim();
        return { data, unidade, cliente, preco, sinal, comissao, bonus, comPaga, corretor };
      })
      .filter(r => r.unidade && r.preco > 0);
  } catch(e) { console.warn('loadVendas error:', e.message); }
}

// Casamento robusto de nomes de cliente: tokens significativos, ignora conectivos
// e corta no "/" (cônjuge). Ex.: "DAVI BRAZ PAULA / ALINE" ≡ "DAVI BRAZ DE PAULA".
function _cliMatch(a, b) {
  const tok = s => _audNorm(String(s||'').split('/')[0]).split(/\s+/)
    .filter(t => t.length>1 && !['DE','DA','DO','DOS','DAS','E'].includes(t));
  const A = tok(a), B = tok(b);
  if (!A.length || !B.length) return false;
  const setB = new Set(B);
  const comuns = A.filter(t => setB.has(t)).length;
  return comuns >= Math.min(2, Math.min(A.length, B.length));
}

function renderVendasCurado(el) {
  window._gvSemColuna = false;
  // recebimentos por casa, separando cliente ATUAL × outros (distratados)
  const recCasa = {};
  _RECEITAS.forEach(r=>{
    if (!r.casa || !(r.tipo==='Venda'||r.tipo==='VendaDistratada'||r.tipo==='INCC')) return;
    const o=(recCasa[r.casa]=recCasa[r.casa]||{}); const k=_audNorm(r.cliente).slice(0,24);
    const c=(o[k]=o[k]||{nome:r.cliente,rec:0,incc:0});
    if (r.tipo==='INCC') c.incc+=r.valReceb; else c.rec+=r.valReceb;
  });
  const G = _GV.slice().sort((a,b)=>a.casa-b.casa);
  let vgv=0, receb=0, incc=0, nQ=0, nA=0, nDev=0, nDisp=0, comV=0, saldoDevendo=0;
  let dN=0, dDevol=0, dReceb=0, dComPerd=0, ganhoRev=0;
  const div=[];
  G.forEach(g=>{
    const porCli = recCasa[g.casa]||{};
    const atual = {rec:0,incc:0}; let outros = {rec:0,incc:0};
    Object.values(porCli).forEach(v=>{
      if (g.cliente && _cliMatch(v.nome, g.cliente)) { atual.rec+=v.rec; atual.incc+=v.incc; }
      else { outros.rec+=v.rec; outros.incc+=v.incc; }
    });
    g._rec=atual; g._outros=outros;
    if (g.status.includes('DISPON')) {
      nDisp++;
      if (atual.rec+outros.rec > 1000 && !g.nDist)
        div.push(`CS ${String(g.casa).padStart(2,'0')}: marcada DISPONÍVEL mas há recebimentos (${fmt(atual.rec+outros.rec)}) — venda não registrada?`);
    } else {
      vgv+=g.valor; receb+=atual.rec; incc+=atual.incc; comV+=g.comissao;
      if (g.status.includes('QUIT')) nQ++;
      else if (g.status.includes('DEVENDO')) { nDev++; saldoDevendo += Math.max(0, g.valor-atual.rec); }
      else {
        nA++;
        if (g.valor>0 && atual.rec>=g.valor*0.97)
          div.push(`CS ${String(g.casa).padStart(2,'0')}: EM ANDAMENTO mas recebimentos cobrem o contratado — atualizar STATUS na aba GESTÃO VENDAS`);
      }
      if (g.nDist>0 && (!g.recebDist || g.recebDist===0) && g.devolvido>0)
        div.push(`CS ${String(g.casa).padStart(2,'0')}: tem distrato e devolução mas RECEBIDO DISTRATADOS = 0 — ou a célula está em formato de texto na aba (redigitar o número), ou o recebido do distratado não foi apurado`);
      if (outros.rec>1000 && !g.nDist)
        div.push(`CS ${String(g.casa).padStart(2,'0')}: recebimentos de outro cliente (${fmt(outros.rec)}) com Nº DISTRATOS = 0 — distrato/revenda não registrado`);
    }
    dN+=g.nDist; dDevol+=g.devolvido; dComPerd+=g.comPerdidas; ganhoRev+=g.ganhoRev;
    if (g.recebDist!==null && g.recebDist!==undefined) dReceb += g.recebDist;
    else if (g.nDist>0) window._gvSemColuna = true;
  });
  // casas com receitas fora da aba curada
  const casasGV=new Set(G.map(g=>g.casa));
  Object.keys(recCasa).map(Number).forEach(cs=>{
    if (!casasGV.has(cs)) {
      const tot=Object.values(recCasa[cs]).reduce((s,v)=>s+v.rec,0);
      if (tot>1000) div.push(`CS ${String(cs).padStart(2,'0')}: ${fmt(tot)} em recebimentos mas a casa NÃO está na aba GESTÃO VENDAS`);
    }
  });
  const dRetLiq = dReceb - dDevol - dComPerd;
  const devDesp = _DESPESAS.filter(r=>_audNorm(r.categoria).includes('DISTRAT')).reduce((s,r)=>s+r.valor,0);
  if (devDesp>0 && Math.abs(devDesp-dDevol)>Math.max(5000,dDevol*0.05))
    div.push(`Devoluções de distrato: despesas ${fmt(devDesp)} × aba curada ${fmt(dDevol)} — conciliar (Δ ${fmt(Math.abs(devDesp-dDevol))})`);

  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c}">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
  el.innerHTML = `
    <div class="info-box" style="border:1px solid #6D9E7F40;margin-bottom:12px"><span style="color:#6D9E7F">📋</span><div>Alimentado pela aba <strong>GESTÃO VENDAS</strong> (status, distratos, comissões — o julgamento da apuração) cruzada ao vivo com as receitas/despesas. ${G.length} casas · fonte: planilha …${String(SHEET_ID).slice(-6)}</div></div>
    ${window._gvSemColuna?`<div class="info-box" style="border:1px solid #BF6B6066;background:#BF6B600d;margin-bottom:12px"><span style="color:#BF6B60;font-size:16px">⚠</span><div><strong>A aba GESTÃO VENDAS está sem a coluna RECEBIDO DISTRATADOS</strong> — os números de retenção ficam zerados até recolar o GESTAO_VENDAS_JAZZ.xlsx mais recente. <strong>Atenção:</strong> confira se você editou a planilha CERTA — o painel lê a que termina em <strong>…${String(SHEET_ID).slice(-6)}</strong> (a nativa nova); a .xlsx antiga é backup e não alimenta nada.</div></div>`:''}
    ${div.length?`<div class="info-box" style="border:1px solid #C4A55C66;background:#C4A55C0d;margin-bottom:12px"><span style="color:#C4A55C;font-size:16px">⚠</span><div><strong>Divergências curada × planilha (${div.length}):</strong><br>${div.slice(0,8).map(d=>'· '+d).join('<br>')}</div></div>`:''}
    <div class="kpi-grid">
      ${k('VGV vigente', fmt(vgv), G.length+' casas no empreendimento', '#6C8FB5')}
      ${k('Recebido (vigentes)', fmt(receb), vgv>0?(receb/vgv*100).toFixed(1)+'% do VGV · INCC: '+fmt(incc):'', '#6D9E7F')}
      ${k('Situação das '+G.length+' casas', nQ+' quit · '+nA+' andam · '+nDev+' devendo · '+nDisp+' disp', 'soma: '+(nQ+nA+nDev+nDisp)+' — quitadas + andamento + devendo = '+(nQ+nA+nDev)+' vendidas', '#8E7FA8')}
      ${k('⚠ Entregues e devendo', nDev+' casas', 'saldo em aberto: '+fmt(saldoDevendo), nDev?'#BF6B60':'#6D9E7F','Casas já entregues cujo contrato ainda tem saldo a receber — prioridade de cobrança: o cliente já mora e a alavanca da entrega se foi.')}
    </div>
    <div class="section-title" style="margin-top:16px">↩️ Distratos — inteligência completa (${dN})</div>
    <div class="kpi-grid">
      ${k('Recebido dos distratados', fmt(dReceb), 'antes dos distratos', '#A1A1A6','Conforme a coluna RECEBIDO DISTRATADOS da aba curada (apuração casa a casa). O cruzamento automático de nomes fica só como verificação de divergências.')}
      ${k('Devolvido', fmt(dDevol), '', '#C4A55C','Conforme a aba curada (autoridade).')}
      ${k('Retido líquido', fmt(dRetLiq), 'recebido − devolvido − '+fmt(dComPerd)+' de comissões perdidas', dRetLiq>=0?'#6D9E7F':'#BF6B60')}
      ${k('💹 Ganho de revenda', fmt(ganhoRev), 'preço revenda − preço distratado', ganhoRev>=0?'#6D9E7F':'#BF6B60','Conforme apuração da aba curada. Efeito total dos distratos = retido líquido + ganho de revenda = '+fmt(dRetLiq+ganhoRev)+'.')}
    </div>
    <div class="section-title" style="margin-top:16px">Casa a Casa</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Casa</th><th>Cliente atual</th><th>Situação</th><th style="text-align:right">Contratado</th><th style="text-align:right">Recebido</th><th style="text-align:right">Saldo</th><th style="text-align:center">Distratos</th><th style="text-align:right">Retido líq.</th></tr></thead>
      <tbody>${G.map(g=>{
        const st=g.status.includes('QUIT')?statusDot('#6D9E7F')+'Quitada'
               :g.status.includes('DEVENDO')?statusDot('#BF6B60')+'Entregue e devendo'
               :g.status.includes('DISPON')?statusDot('#A1A1A6')+'Disponível'
               :statusDot('#C4A55C')+'Em andamento';
        const saldo=g.status.includes('DISPON')?0:Math.max(0,g.valor-g._rec.rec);
        const retC=((g.recebDist!==null&&g.recebDist!==undefined)?g.recebDist:0)-g.devolvido-g.comPerdidas;
        return `<tr><td style="font-weight:700">CS ${String(g.casa).padStart(2,'0')}</td>
          <td style="font-size:11px">${g.cliente?g.cliente.slice(0,26):'<span style=color:#A1A1A6>—</span>'}</td>
          <td style="font-size:11px">${st}</td>
          <td style="text-align:right">${g.valor?fmt(g.valor):'—'}</td>
          <td style="text-align:right">${fmt(g._rec.rec)}</td>
          <td style="text-align:right;color:${saldo>0?'#C4A55C':'#A1A1A6'}">${saldo>0?fmt(saldo):'—'}</td>
          <td style="text-align:center">${g.nDist?'<span style="color:#BF6B60;font-weight:700">'+g.nDist+'</span>':'—'}</td>
          <td style="text-align:right;color:${g.nDist?(retC>=0?'#6D9E7F':'#BF6B60'):'#A1A1A6'}">${g.nDist?fmt(retC):'—'}</td></tr>`;}).join('')}
      </tbody></table></div>`;
}

function renderVendasDerivado(el) {
  const casas = _casaQuit();
  const lista = Object.values(casas).sort((a,b)=>a.casa-b.casa);
  const nQuit = lista.filter(c=>c.quitada).length;
  const contr = lista.reduce((s,c)=>s+c.contratado,0);
  const receb = lista.reduce((s,c)=>s+c.recebVenda,0);
  const incc  = lista.reduce((s,c)=>s+c.recebIncc,0);
  const distr = _DESPESAS.filter(r=>_audNorm(r.categoria).includes('DISTRAT'));
  const totDistr = distr.reduce((s,r)=>s+r.valor,0);
  const semCasa = _RECEITAS.filter(r=>(r.tipo==='Venda')&&!r.casa);
  const totSemCasa = semCasa.reduce((s,r)=>s+r.valReceb,0);
  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c}">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
  el.innerHTML = `
    <div class="kpi-grid">
      ${k('Casas com venda',lista.length+' / '+(CFG.nCasas||'—'),nQuit+' quitadas','#6C8FB5','Casas identificadas nos descritivos das receitas. Depende da disciplina de citar a casa em cada parcela.')}
      ${k('Contratado',fmt(contr),'','#8E7FA8')}
      ${k('Recebido (vendas)',fmt(receb),contr>0?(receb/contr*100).toFixed(1)+'% do contratado':'','#6D9E7F')}
      ${k('INCC recebido',fmt(incc),'','#C4A55C','Receitas da categoria INCC/IGPM — correção monetária sobre as parcelas.')}
    </div>
    <div class="kpi-grid" style="margin-top:12px;grid-template-columns:repeat(2,1fr)">
      ${k('Distratos pagos',fmt(totDistr),distr.length+' pagamento(s)','#BF6B60')}
      ${totSemCasa>0?k('⚠ Recebimentos sem casa no descritivo',fmt(totSemCasa),semCasa.length+' parcela(s) — impossível atribuir','#BF6B60','Parcelas de venda cujo descritivo não cita a casa (ex.: apenas CRED PIX). Elas entram nos totais mas não na visão casa a casa nem na régua de quitação — padronizar o descritivo resolve.'):''}
    </div>
    <div class="section-title" style="margin-top:16px">Casa a Casa</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Casa</th><th style="text-align:right">Contratado</th><th style="text-align:right">Recebido</th><th style="text-align:right">INCC</th><th>Situação</th></tr></thead>
      <tbody>${lista.map(c=>{
        const pct=c.contratado>0?(c.recebVenda/c.contratado*100):0;
        return `<tr><td style="font-weight:700">CS ${String(c.casa).padStart(2,'0')}</td>
          <td style="text-align:right">${fmt(c.contratado)}</td>
          <td style="text-align:right">${fmt(c.recebVenda)}</td>
          <td style="text-align:right;color:#8E7FA8">${c.recebIncc?fmt(c.recebIncc):'—'}</td>
          <td>${c.quitada?statusDot('#6D9E7F')+'Quitada':statusDot(pct>50?'#C4A55C':'#A1A1A6')+pct.toFixed(0)+'%'}</td></tr>`;}).join('')}
      </tbody></table></div>`;
}

async function renderGestaoVendas() {
  const el = document.getElementById('tab7');
  if (!el) return;
  el.innerHTML = '<div style="text-align:center;padding:40px;color:#A1A1A6">Carregando dados de vendas...</div>';

  await Promise.all([loadReceitas(), loadVendas()]);

  // Aba curada GESTÃO VENDAS: autoridade para status/distratos/comissões
  let _gvBanner = '';
  if (CFG.abaGestaoVendas) {
    await loadGestaoVendas();
    if (_GV && _GV.length) { renderVendasCurado(el); return; }
    _gvBanner = `<div class="info-box" style="border:1px solid #C4A55C66;background:#C4A55C0d;margin-bottom:12px">
      <span style="color:#C4A55C;font-size:16px">⚠</span>
      <div><strong>Aba GESTÃO VENDAS não carregada — exibindo a visão antiga.</strong><br>
      Motivo técnico: <code style="color:#C4A55C">${_GV_MOTIVO||'aba não localizada'}</code><br>
      Verifique: o nome da aba na planilha (deve ser exatamente <strong>GESTÃO VENDAS</strong>), a linha 1 com o cabeçalho CASA / CLIENTE ATUAL / STATUS..., e clique ↻ Atualizar.</div></div>`;
    window._gvBannerHtml = _gvBanner;
  }
  // Sem aba VENDAS (modelo 2 abas puro): visão por casa derivada das receitas
  if (!CFG.abaVendas) { renderVendasDerivado(el); if(_gvBanner) el.insertAdjacentHTML('afterbegin',_gvBanner); return; }
  if (_gvBanner) setTimeout(()=>{ const e=document.getElementById('tab7'); if(e && !e.querySelector('.gv-warn')) e.insertAdjacentHTML('afterbegin', _gvBanner.replace('info-box','info-box gv-warn')); }, 400);

  // Count distratos for badge
  const _despDist = _DESPESAS.filter(r => {
    const d = (r.descOriginal||r.descricao||'').toUpperCase();
    const c = (r.categoria||'').toUpperCase();
    return c.includes('DISTRAT') || d.includes('DISTRAT') || d.includes('DEVOLU');
  });
  const _casasDistDesp = new Set(_despDist.map(d => extrairCasaDespesa(d.descOriginal||d.descricao)).filter(Boolean));
  const _casasDistRec  = new Set(_RECEITAS.filter(r=>(r.desc||'').toUpperCase().includes('DISTR')).map(r=>r.casa).filter(Boolean));
  const nDistratos = new Set([..._casasDistDesp,..._casasDistRec]).size;

  // Sub-tabs
  el.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <button onclick="gestaoSubTab('resumo',this)"    class="gv-tab ${_gestaoSubTab==='resumo'   ?'active':''}">📊 Resumo Geral</button>
      <button onclick="gestaoSubTab('casas',this)"     class="gv-tab ${_gestaoSubTab==='casas'    ?'active':''}">🏠 Fichas das Casas</button>
      <button onclick="gestaoSubTab('distratos',this)" class="gv-tab ${_gestaoSubTab==='distratos'?'active':''}">↩ Distratos (${nDistratos})</button>
    </div>
    <div id="gv-content"></div>`;

  renderGestaoContent();
}

window.gestaoSubTab = function(tab, btn) {
  _gestaoSubTab = tab;
  document.querySelectorAll('.gv-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGestaoContent();
};

function renderGestaoContent() {
  const el = document.getElementById('gv-content');
  if (!el) return;
  if (_gestaoSubTab === 'resumo')    el.innerHTML = buildResumoHTML();
  if (_gestaoSubTab === 'casas')     el.innerHTML = buildCasasHTML();
  if (_gestaoSubTab === 'distratos') el.innerHTML = buildDistratosHTML();
}

function buildResumoHTML() {
  // Agrupa vendas por unidade — última venda = venda atual
  const casaMap = {};
  _VENDAS.forEach(v => {
    if (!casaMap[v.unidade] || v.data > casaMap[v.unidade].data) {
      casaMap[v.unidade] = v;
    }
  });
  const vendasAtuais = Object.values(casaMap);
  const totalUnidades = vendasAtuais.length;
  const vgvTotal      = vendasAtuais.reduce((s,v) => s+v.preco, 0);

  // Receitas de venda (excluindo INCC e distrato)
  const receitasVenda = _RECEITAS.filter(r => r.tipo === 'Venda');
  const receitasIncc  = _RECEITAS.filter(r => r.tipo === 'INCC');
  const totalRecebido = receitasVenda.reduce((s,r) => s+r.valReceb, 0);
  const totalIncc     = receitasIncc.reduce((s,r)  => s+r.valReceb, 0);
  const totalOriginal = receitasVenda.reduce((s,r) => s+r.valOrig, 0);
  const deficit       = totalOriginal - totalRecebido;

  // Distratos
  // Conta distratos de todas as fontes
  const despDistR = _DESPESAS.filter(r => {
    const d = (r.descOriginal||r.descricao||'').toUpperCase();
    const c = (r.categoria||'').toUpperCase();
    return c.includes('DISTRAT') || d.includes('DISTRAT') || d.includes('DEVOLU');
  });
  const casasDistDesp = new Set(despDistR.map(d => extrairCasaDespesa(d.descOriginal||d.descricao)).filter(Boolean));
  const casasDistRec  = new Set(_RECEITAS.filter(r=>(r.desc||'').toUpperCase().includes('DISTR')).map(r=>r.casa).filter(Boolean));
  const casasMulti    = new Set(Object.entries(_VENDAS.reduce((a,v)=>{a[v.unidade]=(a[v.unidade]||0)+1;return a;},{})).filter(([,n])=>n>1).map(([n])=>Number(n)));
  const nDistratos    = new Set([...casasDistDesp,...casasDistRec,...casasMulti]).size;

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="kpi" style="border-top:2px solid #6C8FB5">
        <div class="kpi-label">Unidades Vendidas</div>
        <div class="kpi-value" style="color:#6C8FB5">${totalUnidades}</div>
        <div class="kpi-sub">${nDistratos} com distrato</div>
      </div>
      <div class="kpi" style="border-top:2px solid #6D9E7F">
        <div class="kpi-label">VGV das Vendas</div>
        <div class="kpi-value" style="color:#6D9E7F">${fmt(vgvTotal)}</div>
        <div class="kpi-sub">Valor contratado</div>
      </div>
      <div class="kpi" style="border-top:2px solid #6C8FB5">
        <div class="kpi-label">Total Recebido (Vendas)</div>
        <div class="kpi-value" style="color:#6C8FB5">${fmt(totalRecebido)}</div>
        <div class="kpi-sub">Parcelas quitadas</div>
      </div>
      <div class="kpi" style="border-top:2px solid ${deficit>0?'#BF6B60':'#6D9E7F'}">
        <div class="kpi-label">${deficit>0?'Déficit':'Superávit'} de Recebimento</div>
        <div class="kpi-value" style="color:${deficit>0?'#BF6B60':'#6D9E7F'}">${fmt(Math.abs(deficit))}</div>
        <div class="kpi-sub">${deficit>0?'Clientes com valores pendentes':'Superávit (ex: INCC)'}</div>
      </div>
      <div class="kpi" style="border-top:2px solid #C4A55C">
        <div class="kpi-label">INCC Recebido</div>
        <div class="kpi-value" style="color:#C4A55C">${fmt(totalIncc)}</div>
        <div class="kpi-sub">Não incide comissão/imposto</div>
      </div>
      <div class="kpi" style="border-top:2px solid #BF6B60">
        <div class="kpi-label">Distratos</div>
        <div class="kpi-value" style="color:#BF6B60">${nDistratos}</div>
        <div class="kpi-sub">Unidades com histórico de distrato</div>
      </div>
    </div>

    <div style="background:#161b22;border:1px solid #21262d;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:11px;font-family:DM Mono,monospace;color:#A1A1A6;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Base de Cálculo — Comissões e Impostos</div>
      ${rfResultRow('VGV total das vendas',fmt(vgvTotal),'#e6edf3',false,'Valor contratado de todas as unidades')}
      ${rfResultRow('(−) INCC recebido',fmt(totalIncc),'#C4A55C',false,'Não incide comissão nem imposto')}
      ${rfResultRow('= Base tributável',fmt(vgvTotal-totalIncc),'#6C8FB5',true,'Sobre este valor incidem comissões e impostos')}
    </div>`;
}

function buildCasasHTML() {
  // Monta ficha por casa
  const casaMap = {};

  // Agrupa receitas por casa
  _RECEITAS.forEach(r => {
    if (!r.casa) return;
    if (!casaMap[r.casa]) casaMap[r.casa] = { receitas:[], vendas:[] };
    casaMap[r.casa].receitas.push(r);
  });

  // Adiciona dados de venda
  _VENDAS.forEach(v => {
    if (!casaMap[v.unidade]) casaMap[v.unidade] = { receitas:[], vendas:[] };
    casaMap[v.unidade].vendas.push(v);
  });

  const casas = Object.keys(casaMap).map(Number).sort((a,b)=>a-b);
  if (!casas.length) return '<div class="empty-state">Nenhuma casa encontrada</div>';

  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">
    ${casas.map(num => buildCasaCard(num, casaMap[num])).join('')}
  </div>`;
}

function buildCasaCard(num, data) {
  const vendas = [...data.vendas].sort((a,b) => a.data > b.data ? 1 : -1);
  const vendaAtual = vendas[vendas.length-1];
  const temDistrato = vendas.length > 1;

  const recVenda = data.receitas.filter(r=>r.tipo==='Venda');
  const recIncc  = data.receitas.filter(r=>r.tipo==='INCC');
  const recDist  = data.receitas.filter(r=>r.tipo==='Distrato');

  const totalRecebido = recVenda.reduce((s,r)=>s+r.valReceb,0);
  const totalIncc     = recIncc.reduce((s,r)=>s+r.valReceb,0);
  const totalDistrato = recDist.reduce((s,r)=>s+r.valReceb,0);
  const preco = vendaAtual?.preco || 0;
  const pendente = preco - totalRecebido;
  const pct = preco>0 ? Math.min(100, totalRecebido/preco*100) : 0;

  return `<div style="background:#161b22;border:1px solid ${temDistrato?'#C4A55C44':'#21262d'};border-radius:12px;padding:14px;cursor:pointer"
    onclick="abrirFichaCasa(${num})">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div style="font-family:Syne,sans-serif;font-size:16px;font-weight:800">Casa ${num}</div>
        <div style="font-size:11px;color:#A1A1A6;margin-top:2px">${vendaAtual?.cliente||'—'}</div>
      </div>
      ${temDistrato?'<span style="background:#C4A55C22;color:#C4A55C;font-size:9px;font-family:DM Mono,monospace;padding:3px 7px;border-radius:4px;letter-spacing:1px">DISTRATO</span>':''}
    </div>
    ${preco>0?`
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
      <span style="color:#A1A1A6">Valor venda</span>
      <span style="font-family:DM Mono,monospace;color:#e6edf3">${fmt(preco)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">
      <span style="color:#A1A1A6">Recebido</span>
      <span style="font-family:DM Mono,monospace;color:#6D9E7F">${fmt(totalRecebido)}</span>
    </div>
    <div style="background:#21262d;border-radius:3px;height:4px;overflow:hidden;margin-bottom:6px">
      <div style="height:100%;width:${pct.toFixed(0)}%;background:${pendente>0?'#6C8FB5':'#6D9E7F'};border-radius:3px"></div>
    </div>
    <div style="font-size:10px;color:${pendente>0?'#C4A55C':'#6D9E7F'};text-align:right">
      ${pendente>0?'Pendente: '+fmt(pendente):'Quitado ✓'}
    </div>`:''}
    ${totalIncc>0?`<div style="font-size:10px;color:#C4A55C;margin-top:4px">INCC: ${fmt(totalIncc)}</div>`:''}
    ${totalDistrato>0?`<div style="font-size:10px;color:#BF6B60;margin-top:4px">Receita distrato: ${fmt(totalDistrato)}</div>`:''}
  </div>`;
}

window.abrirFichaCasa = function(num) {
  const casaMap = {};
  _RECEITAS.forEach(r => { if(r.casa===num) { if(!casaMap[num]) casaMap[num]={receitas:[],vendas:[]}; casaMap[num].receitas.push(r); }});
  _VENDAS.forEach(v => { if(v.unidade===num) { if(!casaMap[num]) casaMap[num]={receitas:[],vendas:[]}; casaMap[num].vendas.push(v); }});
  const data = casaMap[num];
  if (!data) return;

  const vendas = [...data.vendas].sort((a,b)=>a.data>b.data?1:-1);
  const vendaAtual = vendas[vendas.length-1];
  const vendasAntigas = vendas.slice(0,-1);

  let overlay = document.getElementById('casa-overlay');
  if (!overlay) { overlay = document.createElement('div'); overlay.id='casa-overlay'; document.body.appendChild(overlay); }
  overlay.style.cssText = 'position:fixed;inset:0;z-index:600;background:#000000cc;overflow-y:auto;-webkit-overflow-scrolling:touch';

  const recVenda = data.receitas.filter(r=>r.tipo==='Venda').sort((a,b)=>a.dataVenc>b.dataVenc?1:-1);
  const recIncc  = data.receitas.filter(r=>r.tipo==='INCC');
  const recDist  = data.receitas.filter(r=>r.tipo==='Distrato');
  const totalReceb = recVenda.reduce((s,r)=>s+r.valReceb,0);
  const totalIncc  = recIncc.reduce((s,r)=>s+r.valReceb,0);
  const totalDist  = recDist.reduce((s,r)=>s+r.valReceb,0);
  const preco = vendaAtual?.preco||0;
  const pendente = preco - totalReceb;

  overlay.innerHTML = `
    <div style="background:#161b22;min-height:100%;max-width:600px;margin:0 auto;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div style="font-family:Syne,sans-serif;font-size:20px;font-weight:800">Casa ${num}</div>
        <button onclick="document.getElementById('casa-overlay').style.display='none'"
          style="background:#21262d;border:1px solid #1A1A1D;border-radius:8px;color:#A1A1A6;padding:6px 14px;cursor:pointer;font-family:DM Mono,monospace">✕ Fechar</button>
      </div>

      ${vendaAtual?`
      <div style="background:#0d1117;border:1px solid #6D9E7F33;border-radius:10px;padding:14px;margin-bottom:14px">
        <div style="font-size:10px;color:#6D9E7F;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Venda Atual</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:2px">${vendaAtual.cliente}</div>
        <div style="font-size:11px;color:#A1A1A6;margin-bottom:10px">Data: ${vendaAtual.data} · Corretor: ${vendaAtual.corretor||'—'}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div style="font-size:10px;color:#A1A1A6">Preço</div><div style="font-family:DM Mono,monospace;font-weight:700;color:#e6edf3">${fmt(preco)}</div></div>
          <div><div style="font-size:10px;color:#A1A1A6">Recebido</div><div style="font-family:DM Mono,monospace;font-weight:700;color:#6D9E7F">${fmt(totalReceb)}</div></div>
          <div><div style="font-size:10px;color:#A1A1A6">${pendente>0?'Pendente':'Situação'}</div><div style="font-family:DM Mono,monospace;font-weight:700;color:${pendente>0?'#C4A55C':'#6D9E7F'}">${pendente>0?fmt(pendente):'Quitado ✓'}</div></div>
          <div><div style="font-size:10px;color:#A1A1A6">Comissão</div><div style="font-family:DM Mono,monospace;font-weight:700;color:#BF6B60">${fmt(vendaAtual.comissao||0)}</div></div>
        </div>
        ${totalIncc>0?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #21262d;font-size:11px;color:#C4A55C">INCC recebido: ${fmt(totalIncc)}</div>`:''}
      </div>`:''}

      ${vendasAntigas.length?`
      <div style="background:#1f0d0d;border:1px solid #BF6B6033;border-radius:10px;padding:14px;margin-bottom:14px">
        <div style="font-size:10px;color:#BF6B60;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Venda(s) Anterior(es) — Distrato</div>
        ${vendasAntigas.map(v=>`
          <div style="padding:8px 0;border-bottom:1px solid #1A1A1D">
            <div style="font-size:13px;font-weight:600">${v.cliente}</div>
            <div style="font-size:11px;color:#A1A1A6">Data: ${v.data} · Preço: ${fmt(v.preco)}</div>
            ${totalDist>0?`<div style="font-size:11px;color:#BF6B60;margin-top:2px">Receita de distrato: ${fmt(totalDist)}</div>`:''}
          </div>`).join('')}
      </div>`:''}

      <div style="background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px">
        <div style="font-size:10px;color:#A1A1A6;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Histórico de Recebimentos</div>
        ${recVenda.map(r=>`
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #21262d;font-size:12px">
            <div>
              <div style="color:#e6edf3">${r.desc}</div>
              <div style="color:#A1A1A6;font-size:10px">${r.dataVenc||r.dataComp} · ${r.situacao}</div>
            </div>
            <div style="font-family:DM Mono,monospace;font-weight:600;color:${r.situacao.toLowerCase().includes('quit')?'#6D9E7F':'#C4A55C'}">${fmt(r.valReceb)}</div>
          </div>`).join('')}
        ${recIncc.length?`<div style="margin-top:8px;font-size:11px;color:#C4A55C">+ INCC: ${fmt(totalIncc)}</div>`:''}
      </div>
    </div>`;
  overlay.style.display='block';
};

function buildDistratosHTML() {
  const casaVendas = {};
  _VENDAS.forEach(v => {
    if (!casaVendas[v.unidade]) casaVendas[v.unidade] = [];
    casaVendas[v.unidade].push(v);
  });

  // Despesas com DISTRATO ou DEVOLUÇÃO
  const despDistrato = _DESPESAS.filter(r => {
    const d = (r.descOriginal||r.descricao||'').toUpperCase();
    const c = (r.categoria||'').toUpperCase();
    return c.includes('DISTRAT') || d.includes('DISTRAT') || d.includes('DEVOLU');
  });

  // Receitas com "DISTR" na descrição — ex: "7/13 - DISTRA 13"
  const recDistrato = _RECEITAS.filter(r => {
    const d = (r.desc||'').toUpperCase();
    return d.includes('DISTR');
  });

  // Casas por múltiplas vendas (VALORES DE VENDA)
  const casasMultiVenda = new Set(
    Object.entries(casaVendas).filter(([,vs])=>vs.length>1).map(([n])=>Number(n))
  );
  // Casas por despesas de distrato
  const casasPorDespesa = new Set(
    despDistrato.map(d => extrairCasaDespesa(d.descOriginal||d.descricao)).filter(Boolean)
  );
  // Casas por receitas com "DISTR" na descrição
  const casasPorReceita = new Set(
    recDistrato.map(r => r.casa).filter(Boolean)
  );

  // União de todas as fontes
  const todasCasas = new Set([...casasMultiVenda, ...casasPorDespesa, ...casasPorReceita]);

  if (!todasCasas.size) return '<div style="text-align:center;padding:40px;color:#A1A1A6;font-size:13px">Nenhum distrato identificado.</div>';

  return [...todasCasas].sort((a,b)=>a-b).map(num => {
    const vendas    = (casaVendas[num]||[]).sort((a,b)=>a.data>b.data?1:-1);
    const vendaAtual = vendas[vendas.length-1];
    const vendasAnt  = vendas.slice(0,-1);
    const isMulti    = casasMultiVenda.has(num);

    // Receitas desta casa — para o cálculo do distrato usamos
    // as parcelas marcadas como "DISTR" (pagas pelo cliente distratado)
    const recCasa = _RECEITAS.filter(r => r.casa===num);
    const recDistCasa = recCasa.filter(r => (r.desc||'').toUpperCase().includes('DISTR'));
    // Se houver receitas DISTR, usa só elas; senão usa todas (fallback)
    const totalPagoCliente = recDistCasa.length > 0
      ? recDistCasa.reduce((s,r)=>s+(r.valReceb||0),0)
      : recCasa.reduce((s,r)=>s+(r.valReceb||0),0);

    const despCasa = despDistrato.filter(d => {
      const n = extrairCasaDespesa(d.descOriginal||d.descricao);
      return n === num;
    });
    const valorDevolvido = despCasa.filter(d => {
      const t = (d.descOriginal||d.descricao||'').toUpperCase();
      return t.includes('DEVOLU') || t.includes('REEMB') || t.includes('RESTIT');
    }).reduce((s,d)=>s+d.valor,0);
    const comissaoDistrato = despCasa.filter(d => {
      const t = (d.descOriginal||d.descricao||'').toUpperCase();
      const c = (d.categoria||'').toUpperCase();
      return c.includes('COMISS') || t.includes('COMISS');
    }).reduce((s,d)=>s+d.valor,0);

    const saldoDistrato = totalPagoCliente - valorDevolvido - comissaoDistrato;

    let html = '<div style="background:#161b22;border:1px solid #BF6B6033;border-radius:12px;padding:16px;margin-bottom:12px">';

    // Header
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
    html += '<div>';
    html += '<div style="font-family:Syne,sans-serif;font-size:17px;font-weight:800">Casa ' + num + '</div>';
    if (isMulti) html += '<div style="font-size:10px;color:#BF6B60;font-family:DM Mono,monospace;margin-top:2px">' + (vendas.length-1) + ' distrato' + (vendas.length>2?'s':'') + ' identificado' + (vendas.length>2?'s':'') + '</div>';
    html += '</div>';
    html += '<span style="background:#BF6B6022;color:#BF6B60;font-size:10px;font-family:DM Mono,monospace;padding:4px 10px;border-radius:6px;letter-spacing:1px">DISTRATO</span>';
    html += '</div>';

    // Venda atual
    if (vendaAtual) {
      html += '<div style="font-size:10px;color:#6D9E7F;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Comprador Atual</div>';
      html += '<div style="background:#0d1f12;border-radius:8px;padding:10px;margin-bottom:12px">';
      html += '<div style="font-size:13px;font-weight:700">' + vendaAtual.cliente + '</div>';
      html += '<div style="font-size:11px;color:#A1A1A6;margin-top:2px">Data: ' + vendaAtual.data + ' · Preço: ' + fmt(vendaAtual.preco) + ' · Corretor: ' + (vendaAtual.corretor||'—') + '</div>';
      html += '</div>';
    }

    // Dados do cliente anterior via receitas DISTR
    const recDistCasaAll = _RECEITAS.filter(r => r.casa===num && (r.desc||'').toUpperCase().includes('DISTR'));
    const clientesAnt = [...new Set(recDistCasaAll.map(r => r.cliente).filter(Boolean))];

    // Compradores anteriores — combina dados de VALORES DE VENDA e RECEITAS TOTAIS
    const todosAnteriores = vendasAnt.length > 0
      ? vendasAnt  // dados completos da planilha de vendas
      : clientesAnt.map(nome => ({ cliente: nome, data: null, preco: null, sinal: null, corretor: null, fromReceitas: true }));

    if (todosAnteriores.length) {
      html += '<div style="font-size:10px;color:#BF6B60;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Comprador(es) Anterior(es)</div>';
      todosAnteriores.forEach(v => {
        // Parcelas desta casa pagas por este cliente
        const parcelas = recDistCasaAll.filter(r => !v.fromReceitas || r.cliente === v.cliente);
        const totalParcelas = parcelas.reduce((s,r)=>s+(r.valReceb||0),0);
        const nparcelas = parcelas.length;
        // Primeira e última data de pagamento
        const datas = parcelas.map(r=>r.dataVenc||r.dataComp).filter(Boolean).sort();
        const primeiraData = datas[0]||'—';
        const ultimaData   = datas[datas.length-1]||'—';

        html += '<div style="background:#1f0d0d;border-radius:8px;padding:12px;margin-bottom:8px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
        html += '<div style="font-size:13px;font-weight:700;color:#e6edf3">' + v.cliente + '</div>';
        html += '<span style="background:#BF6B6022;color:#BF6B60;font-size:9px;font-family:DM Mono,monospace;padding:2px 8px;border-radius:4px">DISTRATADO</span>';
        html += '</div>';

        if (v.preco) {
          html += '<div style="font-size:11px;color:#A1A1A6;margin-top:4px">Preço contratado: ' + fmt(v.preco) + '</div>';
          html += '<div style="font-size:11px;color:#A1A1A6">Data de compra: ' + v.data + '</div>';
          if (v.sinal) html += '<div style="font-size:11px;color:#A1A1A6">Sinal: ' + fmt(v.sinal) + '</div>';
          if (v.corretor) html += '<div style="font-size:11px;color:#A1A1A6">Corretor: ' + v.corretor + '</div>';
        }

        if (nparcelas > 0) {
          html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #1A1A1D">';
          html += '<div style="font-size:11px;color:#A1A1A6">' + nparcelas + ' parcela' + (nparcelas>1?'s':'') + ' pagas — ' + primeiraData + ' a ' + ultimaData + '</div>';
          html += '<div style="font-size:12px;font-weight:700;color:#C4A55C;margin-top:2px;font-family:DM Mono,monospace">Total recebido: ' + fmt(totalParcelas) + '</div>';

          // Lista de parcelas expansível
          html += '<details style="margin-top:6px"><summary style="font-size:10px;color:#A1A1A6;cursor:pointer;font-family:DM Mono,monospace">Ver parcelas</summary><div style="margin-top:6px">';
          parcelas.sort((a,b)=>a.dataVenc>b.dataVenc?1:-1).forEach(p => {
            html += '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px">';
            html += '<span style="color:#A1A1A6">' + (p.dataVenc||p.dataComp) + ' — ' + p.desc + '</span>';
            html += '<span style="font-family:DM Mono,monospace;color:#C4A55C">' + fmt(p.valReceb) + '</span>';
            html += '</div>';
          });
          html += '</div></details>';
          html += '</div>';
        }
        html += '</div>';
      });
    }

    // Cálculo
    const corSaldo = saldoDistrato >= 0 ? '#6D9E7F' : '#BF6B60';
    html += '<div style="font-size:10px;color:#A1A1A6;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">Cálculo do Distrato</div>';
    html += '<div style="background:#0d1117;border-radius:8px;padding:12px">';
    html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#A1A1A6">(+) Total pago pelo cliente</span><span style="font-family:DM Mono,monospace;font-size:12px;color:#6D9E7F">' + fmt(totalPagoCliente) + '</span></div>';
    html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#A1A1A6">(−) Valor devolvido ao cliente</span><span style="font-family:DM Mono,monospace;font-size:12px;color:#BF6B60">− ' + fmt(valorDevolvido) + '</span></div>';
    html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#A1A1A6">(−) Comissão do distrato</span><span style="font-family:DM Mono,monospace;font-size:12px;color:#BF6B60">− ' + fmt(comissaoDistrato) + '</span></div>';
    html += '<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px"><span style="font-size:13px;font-weight:700;color:#e6edf3">= Saldo retido (resultado)</span><span style="font-family:DM Mono,monospace;font-size:14px;font-weight:800;color:' + corSaldo + '">' + fmt(saldoDistrato) + '</span></div>';
    html += '</div>';

    // Despesas relacionadas
    if (despCasa.length) {
      html += '<details style="margin-top:10px"><summary style="font-size:11px;color:#A1A1A6;cursor:pointer;font-family:DM Mono,monospace">Ver lançamentos nas despesas (' + despCasa.length + ')</summary><div style="margin-top:8px">';
      despCasa.forEach(d => {
        html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d;font-size:11px"><div><div style="color:#e6edf3">' + d.descricao + '</div><div style="color:#A1A1A6">' + d.data + ' · ' + d.categoria + '</div></div><span style="font-family:DM Mono,monospace;color:#BF6B60;white-space:nowrap;margin-left:8px">' + fmt(d.valor) + '</span></div>';
      });
      html += '</div></details>';
    }

    html += '</div>';
    return html;
  }).join('');
}


</script>

        </select>
      </div>
      <div id="drill-summary" style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:11px;color:#A1A1A6"></div>
    </div>
    <div id="drill-rows" style="padding:0 16px"></div>
  </div>
</div>

<script>
let _drillData = [];
let _drillType = '';

// Converte receitas para o formato que o drill já sabe listar e ordenar,
// levando o detalhe fino (original, saldo, vencimento, situação) para a observação.
function _recParaDrill(arr){
  return (arr||[]).map(r=>{
    const ab = Math.max(0,(r.valOrig||0)-(r.valReceb||0));
    const dv = parseDate(r.dataVenc);
    const venc = dv && dv < new Date() && ab > 1;
    const partes = [];
    if (r.valOrig)   partes.push('Original: '+fmt(r.valOrig));
    if (ab>1)        partes.push('Em aberto: '+fmt(ab)+(venc?' (VENCIDA em '+r.dataVenc+')':''));
    if (r.dataVenc)  partes.push('Vencimento: '+r.dataVenc);
    if (r.situacao)  partes.push('Situação: '+r.situacao);
    if (r.origem)    partes.push('Origem: '+r.origem);
    if (r.casa)      partes.push('Casa: '+r.casa);
    partes.push('Natureza: '+r.tipo);
    return { data: r.dataComp, valor: r.valReceb||0, categoria: (r.cat||'(sem categoria)'),
             descricao: r.desc || '(sem descritivo)', fornecedor: r.cliente || '—',
             obs: partes.join(' · '), _rec: r };
  });
}
// Exploração genérica: qualquer soma exibida no painel pode abrir a lista que a compõe,
// com busca e as mesmas cinco ordenações. Aceita despesas, receitas ou linhas já normalizadas.
window.openDrillLista = function(titulo, rows, cor, eyebrow) {
  _drillType = 'lista';
  _drillData = (rows||[]).map(r=>{
    if (r && r.valReceb!==undefined && r.dataComp!==undefined) return _recParaDrill([r])[0];
    return { data: r.data, valor: r.valor, categoria: r.categoria || r.cat || '—',
             descricao: r.descricao || r.desc || '(sem descritivo)',
             fornecedor: r.fornecedor || r.cliente || '—',
             obs: r.obs || (r._obra ? 'Obra: '+r._obra : '') };
  });
  document.getElementById('drill-eyebrow').textContent = eyebrow || 'Composição da soma';
  document.getElementById('drill-title').innerHTML = '<span style="color:'+(cor||'#6C8FB5')+'">'+titulo+'</span>';
  document.getElementById('drill-search').value = '';
  document.getElementById('drill-sort').value = 'valor_desc';
  document.getElementById('drill-socio').style.display = 'none';
  renderDrillRows();
  document.getElementById('drillModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
};
// atalhos usados pelas tabelas agregadas das três obras
window.drillAnalise = function(filtroTipo, arg1, arg2) {
  const R = window._analiseRows || [];
  let rows = R, titulo = 'Lançamentos', cor = '#6C8FB5';
  if (filtroTipo==='familia') {
    const fam = FAMILIAS_ANALISE.find(f=>f.k===arg1);
    rows = R.filter(r=> (!arg2 || r._obraKey===arg2) && fam && fam.match(_audNorm(r.categoria||'')));
    titulo = (fam?fam.nome:arg1) + (arg2? ' · '+arg2 : ' · grupo'); cor = fam?fam.cor:'#6C8FB5';
  } else if (filtroTipo==='material') {
    rows = R.filter(r=> _audNorm(r.categoria||'').includes('MATERIA') && tipoMaterialDe(_audNorm(r.descOriginal||r.descricao||''))===arg1);
    titulo = '🧱 ' + arg1; cor = '#6C8FB5';
  } else if (filtroTipo==='prestador') {
    rows = R.filter(r=> _audNorm(r.categoria||'').includes('MAO DE OBRA') && (r.fornecedor||'').trim()===arg1);
    titulo = '👷 ' + arg1; cor = '#C09257';
  } else if (filtroTipo==='catObra') {
    rows = R.filter(r=> (r.categoria||'(sem categoria)')===arg1 && (!arg2 || r._obraKey===arg2));
    titulo = '📂 ' + arg1 + (arg2? ' · '+arg2 : ''); cor = '#6C8FB5';
  } else if (filtroTipo==='alimentacao') {
    rows = R.filter(r=> _audNorm(r.categoria||'').includes('ALIMENTA') && (!arg1 || r._obraKey===arg1));
    titulo = '🍛 Alimentação' + (arg1? ' · '+arg1 : ' · grupo'); cor = '#5F9E93';
  } else if (filtroTipo==='judicial') {
        rows = R.filter(r=> (!arg1 || r._obraKey===arg1) && ehJudicial(r));
    titulo = '⚖️ Custas judiciais' + (arg1? ' · '+arg1 : ' · grupo'); cor = '#BF6B60';
  }
  if (!rows.length) { alert('Os lançamentos das três obras ainda estão carregando. Abra a aba Análise uma vez e tente de novo.'); return; }
  openDrillLista(titulo, rows, cor, 'Composição da soma · '+rows.length+' lançamentos');
};
window.openDrill = function(type, filter) {
  _drillType = type;
  let rows = [], eyebrow = '', title = '', color = '#6C8FB5';

  if(type==='aportes')       { rows=[..._APORTES];  eyebrow='Lançamentos'; title='📥 Todos os Aportes';    color='#6D9E7F'; }
  else if(type==='retiradas'){ rows=[..._RETIRADAS]; eyebrow='Lançamentos'; title='📤 Todas as Retiradas'; color='#C4A55C'; }
  else if(type==='categoria'){ rows=_DESPESAS.filter(d=>d.categoria===filter); eyebrow='Despesas por Categoria'; title='📂 '+filter; color='#6C8FB5'; }
  else if(type==='despesas') { rows=[..._DESPESAS];  eyebrow='Lançamentos'; title='📋 Todas as Despesas';   color='#BF6B60'; }
  else if(type==='custo_obra'){ rows=window._drillCustoObra||_DESPESAS.filter(r=>isCustoObra(r.categoria)); eyebrow='Custo de Obra'; title='🏗️ Despesas de Obra'; color='#C4A55C'; }
  else if(type==='receitas')    { rows=_recParaDrill(_RECEITAS); eyebrow='Lançamentos'; title='📋 Todas as Receitas'; color='#6D9E7F'; }
  else if(type==='receita_cat') { rows=_recParaDrill(_RECEITAS.filter(r=>(r.cat||'(sem categoria)')===filter)); eyebrow='Receitas por Categoria'; title='📂 '+filter; color='#6D9E7F'; }
  else if(type==='receita_tipo'){ rows=_recParaDrill(_RECEITAS.filter(r=>r.tipo===filter)); eyebrow='Receitas por Natureza'; title='🏷️ '+filter; color='#6D9E7F'; }

  _drillData = rows;
  document.getElementById('drill-eyebrow').textContent = eyebrow;
  document.getElementById('drill-title').innerHTML = '<span style="color:'+color+'">'+title+'</span>';
  document.getElementById('drill-search').value = '';
  document.getElementById('drill-sort').value = 'valor_desc';   // padrão: maior valor primeiro

  // Populate socio filter for aportes/retiradas
  const socioSel = document.getElementById('drill-socio');
  socioSel.innerHTML = '<option value="">Todos os sócios</option>';
  if(type==='aportes'||type==='retiradas') {
    const socios = [...new Set(rows.map(r=>r.socio).filter(Boolean))].sort();
    socios.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      socioSel.appendChild(opt);
    });
    socioSel.style.display = '';
  } else {
    socioSel.style.display = 'none';
  }

  renderDrillRows();
  document.getElementById('drillModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
};

window.closeDrill = function() {
  document.getElementById('drillModal').style.display = 'none';
  document.body.style.overflow = '';
};

window.renderDrillRows = function() {
  const search  = document.getElementById('drill-search').value.toLowerCase();
  const sort    = document.getElementById('drill-sort').value;
  const socio   = document.getElementById('drill-socio').value;
  const isDespesa = _drillType==='categoria'||_drillType==='despesas'||_drillType==='custo_obra'||_drillType==='receitas'||_drillType==='receita_cat'||_drillType==='receita_tipo'||_drillType==='lista';

  let rows = _drillData.filter(r => {
    if(socio && r.socio !== socio) return false;
    if(!search) return true;
    return JSON.stringify(r).toLowerCase().includes(search);
  });

  rows.sort((a,b) => {
    if(sort==='data_desc') return (parseDate(b.data)||0)-(parseDate(a.data)||0);
    if(sort==='data_asc')  return (parseDate(a.data)||0)-(parseDate(b.data)||0);
    if(sort==='valor_desc') return b.valor-a.valor;
    if(sort==='valor_asc')  return a.valor-b.valor;
    if(sort==='nome_asc') {
      const na=(a.socio||a.fornecedor||'').toLowerCase();
      const nb=(b.socio||b.fornecedor||'').toLowerCase();
      return na.localeCompare(nb);
    }
    return 0;
  });

  const total = rows.reduce((s,r)=>s+r.valor,0);
  const acumulado = rows.reduce((s,r,i)=>{
    s.push((s[i-1]||0)+r.valor); return s;
  },[]);

  document.getElementById('drill-summary').innerHTML =
    '<span>'+rows.length+' lançamento'+(rows.length!==1?'s':'')+'</span>'
    +'<span style="color:#e6edf3;font-weight:600">Total: '+fmt(total)+'</span>'
    +(socio?'<span style="color:var(--accent)">Sócio: '+socio+'</span>':'');

  if(!rows.length) {
    document.getElementById('drill-rows').innerHTML = '<div style="text-align:center;padding:40px;color:#A1A1A6;font-size:13px">Nenhum resultado</div>';
    return;
  }

  document.getElementById('drill-rows').innerHTML = rows.map((r,ri) => {
    if(isDespesa) {
      return '<div style="border-bottom:1px solid #21262d;padding:12px 0">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">'
        +'<span style="background:#21262d;border-radius:4px;padding:2px 7px;font-size:10px;color:#6C8FB5">'+r.categoria+'</span>'
        +'<span style="font-size:10px;color:#A1A1A6">'+r.data+'</span>'
        +(r.obs?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#C4A55C;vertical-align:middle" title="Tem observação"></span>':'')
        +'</div>'
        +'<div style="font-size:14px;font-weight:700;color:#e6edf3;line-height:1.3;margin-bottom:2px">'+r.descricao+'</div>'
        +'<div style="font-size:11px;color:#A1A1A6">'+r.fornecedor+'</div>'
        +(r.obs?'<div id="drill-obs-'+ri+'" style="display:none;margin-top:6px;padding:8px;background:#0d1117;border-left:3px solid #C4A55C;border-radius:0 6px 6px 0;font-size:12px;color:#e6edf3;line-height:1.5">'+r.obs+'</div>':'')
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0;padding-top:2px">'
        +'<div style="font-family:\'DM Mono\',monospace;font-size:14px;font-weight:700;color:#BF6B60">'+fmt(r.valor)+'</div>'
        +(r.obs?'<button onclick="toggleDrillObs('+ri+')" style="background:transparent;border:none;color:#C4A55C;font-size:10px;cursor:pointer;margin-top:4px;font-family:\'DM Mono\',monospace">obs ↓</button>':'')
        +'</div></div></div>';
    } else {
      const color = _drillType==='aportes'?'#6D9E7F':'#C4A55C';
      const cumul = acumulado[ri];
      return '<div style="border-bottom:1px solid #21262d;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px">'
        +'<div>'
        +'<div style="font-size:13px;font-weight:600">'+( r.socio||'—')+'</div>'
        +'<div style="font-size:11px;color:#A1A1A6;margin-top:1px">'+r.data+(r.cat&&r.cat!=='Retirada Sócios'?' · '+r.cat:'')+'</div>'
        +'</div>'
        +'<div style="text-align:right">'
        +'<div style="font-family:\'DM Mono\',monospace;font-size:14px;font-weight:700;color:'+color+';white-space:nowrap">'+fmt(r.valor)+'</div>'
        +'<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:#A1A1A6;margin-top:1px">Acum: '+fmt(cumul)+'</div>'
        +'</div></div>';
    }
  }).join('');
};

window.toggleDrillObs = function(ri) {
  const el = document.getElementById('drill-obs-'+ri);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
};

document.getElementById('drillModal').addEventListener('click', function(e) {
  if(e.target===this) closeDrill();
});

/* ═══════════ Gráficos nas demais abas (camada sobre os renderizadores existentes) ═══════════
   Envolve cada render sem reescrevê-lo: injeta um cartão no topo da aba e desenha. */
(function(){
  function injetar(tabId, cardHtml, draw){
    const el = document.getElementById(tabId); if(!el) return;
    if (el.querySelector('[data-fxgraf]')) el.querySelector('[data-fxgraf]').remove();
    const box = document.createElement('div'); box.setAttribute('data-fxgraf','1');
    box.innerHTML = cardHtml; el.insertBefore(box, el.firstChild);
    try { draw(); } catch(e) { console.warn('gráfico:', e); }
  }
  function serieMensal(rows, campo, meses, campoData){
    const m={}; (rows||[]).forEach(r=>{ const d=parseDate(campoData? r[campoData] : (r.data||r.dataComp)); if(!d) return;
      const ym=d.getFullYear()*100+d.getMonth()+1; m[ym]=(m[ym]||0)+(campo? (r[campo]||0) : r.valor); });
    const hoje=new Date(), ymH=hoje.getFullYear()*100+hoje.getMonth()+1;
    const yms=Object.keys(m).map(Number).sort((a,b)=>a-b).filter(ym=>ym<ymH).slice(-(meses||18));
    return { labels: yms.map(_ymLabel), values: yms.map(ym=>m[ym]||0) };
  }
  function envolver(nome, fn){
    const orig = window[nome]; if (typeof orig !== 'function') return;
    window[nome] = function(){
      const r = orig.apply(this, arguments);
      if (r && typeof r.then === 'function') { r.then(()=>{ try{fn();}catch(e){} }); }
      else { setTimeout(()=>{ try{fn();}catch(e){} }, 30); }
      return r;
    };
  }

  // 💰 Despesas — evolução mensal + maiores categorias
  envolver('renderDespesas', function(){
    const s = serieMensal(_DESPESAS, null, 18);
    const porCat={}; (_DESPESAS||[]).forEach(r=>{ const c=r.categoria||'(sem categoria)'; porCat[c]=(porCat[c]||0)+r.valor; });
    const top=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,v])=>({nome:n, valor:v}));
    injetar('tab5',
      fxCard('Despesa por mês','g_desp_mes','<div class="legend"><span><i style="background:#BF6B60"></i>Despesa total</span></div>','Últimos 18 meses fechados, todas as categorias.')
      + fxCard('Maiores categorias','g_desp_cat','','Top 8 por valor acumulado.'),
      function(){
        fxLinhas(document.getElementById('g_desp_mes'), {labels:s.labels, cada:Math.ceil(s.labels.length/8),
          series:[{values:s.values, color:'#BF6B60', area:'rgba(191,107,96,.13)'}], alt:'despesa mensal'});
        fxBarrasH(document.getElementById('g_desp_cat'), top);
      });
  });

  // 🏪 Fornecedores — top 10 por volume
  envolver('renderFornecedores', function(){
    const map={}; (_DESPESAS||[]).forEach(r=>{ const f=r.fornecedor||'—'; if(f==='—') return; map[f]=(map[f]||0)+r.valor; });
    const top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>({nome:n.slice(0,38), valor:v}));
    injetar('tab10', fxCard('Top 10 fornecedores por volume','g_forn_top','','Peso financeiro de cada fornecedor — base para negociação.'),
      function(){ fxBarrasH(document.getElementById('g_forn_top'), top); });
  });

  // 🤝 Sociedade — aportes por sócio
  envolver('renderSociedade', function(){
    const map={}; (_APORTES||[]).forEach(a=>{ const s=a.socio||'—'; map[s]=(map[s]||0)+a.valor; });
    const itens=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({nome:n.slice(0,34), valor:v}));
    if(!itens.length) return;
    injetar('tab11', fxCard('Aporte acumulado por sócio','g_soc_ap','','Total aportado por cada sócio no empreendimento.'),
      function(){ fxBarrasH(document.getElementById('g_soc_ap'), itens); });
  });

  // 🏠 Gestão de Vendas — recebimento mensal
  envolver('renderGestaoVendas', function(){
    const vendas=(_RECEITAS||[]).filter(r=>r.tipo==='Venda'||r.tipo==='VendaDistratada'||r.tipo==='INCC');
    const s=serieMensal(vendas,'valReceb',18,'dataComp');
    if(!s.labels.length) return;
    injetar('tab7', fxCard('Recebimento de vendas por mês','g_gv_mes','<div class="legend"><span><i style="background:#6D9E7F"></i>Recebido</span></div>','Entradas de venda e INCC nos últimos 18 meses fechados.'),
      function(){ fxLinhas(document.getElementById('g_gv_mes'), {labels:s.labels, cada:Math.ceil(s.labels.length/8),
        series:[{values:s.values, color:'#6D9E7F', area:'rgba(109,158,127,.13)'}], alt:'recebimento mensal'}); });
  });

  // 📊 Consolidado — comparativo das três obras
  envolver('renderConsolidado', function(){
    const R = window._consolData; if(!R || !R.length) return;
    const itens = R.map(r=>({nome:r.nome, valor:r.tDesp||0, cor:r.cor}));
    injetar('tab8', fxCard('Despesa total por empreendimento','g_cons_obras','','Comparativo direto do volume financeiro das três obras.'),
      function(){ fxBarrasH(document.getElementById('g_cons_obras'), itens); });
    // as três curvas de caixa
    const alvoCx = document.getElementById('g_cx_comp');
    if (alvoCx) {
      const comC = R.filter(r=>r.caixa && r.caixa.length);
      const todos = [...new Set(comC.flatMap(r=>r.caixa.map(x=>x.ym)))].sort((a,b)=>a-b);
      if (todos.length) fxLinhas(alvoCx, {
        labels: todos.map(cxLabel), cada: Math.max(1, Math.ceil(todos.length/9)),
        series: comC.map(r=>{ const m={}; r.caixa.forEach(x=>m[x.ym]=x.saldo); let u=0;
          return { values: todos.map(ym=>{ if(m[ym]!==undefined) u=m[ym]; return u; }), color:r.cor }; }),
        alt:'saldo de caixa das três obras' });
    }
  });

  // 🍛 Alimentação — série mensal comparada das três obras
  envolver('renderAlimentacao', function(){
    if (window._aliRelMode) return;                 // no modo relatório o papel manda
    const R = window._analiseData; if(!R || !R.length) return;
    const hoje=new Date(), ymH=hoje.getFullYear()*100+hoje.getMonth()+1;
    const yms=[...new Set(R.flatMap(r=>Object.keys(r.fam.alimentacao).map(Number)))].sort((a,b)=>a-b).filter(ym=>ym<ymH).slice(-18);
    if(!yms.length) return;
    injetar('tab14',
      fxCard('Alimentação por mês — três obras','g_ali_mes',
        '<div class="legend">'+R.map(r=>'<span><i style="background:'+r.cor+'"></i>'+r.nome.split(' ')[0]+'</span>').join('')+'</div>',
        'Séries mensais lado a lado: os vales de uma obra com as outras pagando são as janelas investigadas abaixo.'),
      function(){ fxLinhas(document.getElementById('g_ali_mes'), {labels:yms.map(_ymLabel), cada:Math.ceil(yms.length/8),
        series:R.map(r=>({values:yms.map(ym=>r.fam.alimentacao[ym]||0), color:r.cor})), alt:'alimentação mensal das três obras'}); });
  });
})();

</script>

</body>
</html>
