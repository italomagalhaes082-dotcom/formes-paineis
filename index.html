<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title id="page-title">Painel Gerencial — Formes Engenharia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Firebase compat SDK v9 (cache-bust: v3) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyBBgPz_lodqkaii2z9t35BnegM3dWb4Ykw",
    authDomain: "paineis-resultado.firebaseapp.com",
    projectId: "paineis-resultado",
    storageBucket: "paineis-resultado.firebasestorage.app",
    messagingSenderId: "93768353583",
    appId: "1:93768353583:web:81f204cc57a7b35b8243da"
  };

  firebase.initializeApp(firebaseConfig);
  const _db = firebase.firestore();

  function rfDocId() {
    const emp = new URLSearchParams(location.search).get('emp') || 'liberty';
    return 'resultado_params_' + emp;
  }

  window.rfSyncSave = async function(data) {
    try {
      console.log('Saving to Firebase:', rfDocId(), data);
      await _db.collection('paineis_config').doc(rfDocId()).set(data);
      console.log('Firebase save OK');
    } catch(e) { console.error('Firebase save error:', e.code, e.message); }
  };

  // Real-time listener — atualiza instantaneamente em qualquer dispositivo
  let _rfUnsubscribe = null;

  window.rfSyncLoad = function() {
    if (_rfUnsubscribe) { _rfUnsubscribe(); _rfUnsubscribe = null; }
    const emp = new URLSearchParams(location.search).get('emp') || 'liberty';

    _rfUnsubscribe = _db.collection('paineis_config').doc(rfDocId())
      .onSnapshot(function(snap) {
        if (!snap.exists) { console.log('Firebase: doc nao existe ainda'); return; }
        const data = snap.data();
        console.log('Firebase snapshot recebido:', data);

        // 1. Atualiza localStorage com os valores do Firebase
        Object.entries(data).forEach(([k, v]) => {
          localStorage.setItem('rf_' + emp + '_' + k, String(v));
        });

        // 2. Atualiza inputs na tela
        Object.keys(data).forEach(k => {
          const el = document.getElementById('rf_' + k);
          if (!el || document.activeElement === el) return;
          const raw = parseFloat(data[k]) || 0;
          el.value = raw > 0
            ? (k.startsWith('pct') ? String(raw) : (window.fmtInputNum ? fmtInputNum(raw) : String(raw)))
            : '';
        });

        // 3. Recalcula resultado
        if (window.renderRFCalc) renderRFCalc();
      }, function(e) { console.error('Firebase listener error:', e.code, e.message); });

    console.log('Firebase onSnapshot listener iniciado para:', rfDocId());
  };

  window._rfFirebaseReady = true;
  console.log('Firebase ready — paineis-resultado');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#000000">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{/* linguagem visual aprovada (referência v3): preto puro, hairlines, Inter tabular */
        --bg:#000;--card:#0A0A0B;--card2:#121214;--surface-3:#1A1A1D;
        --border:rgba(255,255,255,.08);--hairline-strong:rgba(255,255,255,.14);
        --text:#F5F5F7;--muted:#A1A1A6;--text-3:#6E6E73;
        --accent:#6C8FB5;--positive:#6D9E7F;--negative:#BF6B60;--warning:#C4A55C;
        --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        --radius:14px;--radius-sm:9px;
        --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}

  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
       -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;letter-spacing:-.01em;
       padding-bottom:calc(80px + var(--safe-bot));-webkit-tap-highlight-color:transparent}
  ::-webkit-scrollbar{width:3px;height:3px}
  ::-webkit-scrollbar-thumb{background:#1A1A1D;border-radius:4px}

  /* ── LOADING ─────────────────────────────────────────── */
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
           min-height:100vh;gap:16px;padding:24px}
  .spinner{width:44px;height:44px;border:3px solid #21262d;border-top-color:#6C8FB5;
           border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);
                letter-spacing:1px;text-align:center}
  .error-box{background:#1c1116;border:1px solid #BF6B6040;border-radius:14px;
             padding:24px 20px;width:100%;max-width:420px;text-align:center}
  .error-box h3{color:#BF6B60;font-size:17px;margin-bottom:10px}
  .error-box p{font-size:14px;color:var(--muted);line-height:1.6}

  /* ── HEADER ──────────────────────────────────────────── */
  .header{background:var(--bg);border-bottom:1px solid var(--border);
          padding:calc(14px + var(--safe-top)) 16px 0;position:sticky;top:0;z-index:100}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;
              gap:8px;margin-bottom:12px}
  .header-eyebrow{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);
                  letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
  .header-title{font-size:20px;font-weight:800;letter-spacing:-0.3px;line-height:1.1}
  .header-title span{color:#6C8FB5;font-size:13px;font-weight:400;
                     display:block;margin-top:2px}
  .header-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);
               text-align:right;line-height:1.6}
  .refresh-btn{background:#21262d;color:var(--muted);border:1px solid var(--border);
               border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;
               font-family:'DM Mono',monospace;white-space:nowrap;min-height:36px;
               -webkit-appearance:none}

  /* ── TABS ────────────────────────────────────────────── */
  .tabs{display:flex;gap:2px;overflow-x:auto;padding:2px;background:var(--card2);
        border-radius:var(--radius-sm);
        -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;background:transparent;color:var(--muted);border:0;
       border-radius:7px;padding:9px 15px;font-size:13px;font-weight:500;cursor:pointer;
       font-family:var(--font);white-space:nowrap;min-height:40px;
       -webkit-appearance:none;transition:background .18s,color .18s}
  .tab.active{background:var(--surface-3);color:var(--text);font-weight:600}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── CONTENT ─────────────────────────────────────────── */
  .content{padding:16px}

  /* KPIs: 2 colunas no mobile */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 14px}
  .kpi-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);
             text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;line-height:1.3}
  .kpi-value{font-size:18px;font-weight:600;line-height:1;margin-bottom:3px;letter-spacing:-.01em}
  .kpi-sub{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;line-height:1.4}
  .kpi-delta{font-size:10px;font-weight:600;margin-top:3px}

  /* KPI destaque — ocupa linha inteira */
  .kpi-full{grid-column:1/-1}

  .section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
                 letter-spacing:2px;margin:24px 0 12px;border-bottom:1px solid var(--border);
                 padding-bottom:7px}

  /* Sócios: 1 coluna no mobile */
  .socio-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .socio-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .socio-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  .socio-name{font-weight:700;font-size:14px}
  .socio-val{font-family:'DM Mono',monospace;font-weight:600;font-size:16px;white-space:nowrap}
  .bar-bg{background:#21262d;border-radius:4px;height:8px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px}
  .socio-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:5px}

  /* Gráficos */
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
              padding:14px 10px;margin-bottom:4px}

  /* Tabelas — scroll horizontal com indicador visual */
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;
              overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch;
              position:relative}
  table{border-collapse:collapse;width:100%;min-width:400px}
  th{background:var(--card);color:var(--muted);font-size:10px;text-transform:uppercase;
     letter-spacing:1px;font-family:'DM Mono',monospace;padding:10px 12px;text-align:left;
     border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
  td{padding:10px 12px;font-size:12px;color:var(--text);border-bottom:1px solid #1c2128;
     font-family:'DM Mono',monospace;line-height:1.4}
  tr:last-child td{border-bottom:none}
  .badge{border-radius:5px;padding:3px 8px;font-size:10px;font-weight:600;white-space:nowrap}

  .info-box{background:var(--card2);border-radius:12px;padding:14px 14px;margin-top:12px;
            display:flex;gap:10px;font-size:12px;color:var(--muted);line-height:1.7}
  .info-box strong{color:var(--text)}

  /* CDI */
  .cdi-highlight{background:linear-gradient(135deg,#0d1f2d,#0d1117);
                 border:1px solid #6C8FB540;border-radius:16px;padding:20px 16px;margin-bottom:4px}
  .cdi-big{font-size:36px;font-weight:800;color:#6C8FB5;font-family:'Syne',sans-serif;line-height:1}
  .cdi-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);
             text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
  .cdi-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .cdi-pill{background:#21262d;border-radius:6px;padding:7px 11px;
            font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex:1;min-width:140px}
  .cdi-pill span{color:var(--text);font-weight:600;display:block;margin-top:2px;font-size:13px}

  /* Fases */
  .fases-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .fase-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .fase-title{font-size:13px;font-weight:700;margin-bottom:3px}
  .fase-periodo{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:6px}
  .fase-desc{font-size:12px;color:var(--text);line-height:1.5}

  .tab-content{display:none}.tab-content.active{display:block}
  /* ── dispositivo: mesma lógica da referência v3 ── */
  .device-note{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:8px;
               justify-content:flex-end;margin-top:4px;font-family:var(--font)}
  .device-note button{appearance:none;background:transparent;border:0;color:var(--accent);
               font:500 11px/1 var(--font);cursor:pointer;padding:2px 0}
  html[data-device="mobile"] .so-desktop{display:none !important}
  html[data-device="mobile"] .tab{font-size:12px;padding:9px 12px}
  html[data-device="mobile"] .table-wrap table{font-size:11px}
  html[data-device="desktop"] .so-mobile{display:none !important}
  #dashboard{display:none}

  /* ── HINTS / SEMÁFOROS / INTELIGÊNCIA ────────────────── */
  .hint-ico{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
            border-radius:50%;background:#21262d;border:1px solid #1A1A1D;color:#A1A1A6;
            font-size:9px;font-weight:700;margin-left:5px;cursor:pointer;vertical-align:middle;
            font-family:'DM Mono',monospace;flex-shrink:0}
  .hint-pop{position:absolute;z-index:500;background:#1c2128;border:1px solid #1A1A1D;
            border-radius:10px;padding:10px 12px;font-size:11px;color:#e6edf3;line-height:1.6;
            box-shadow:0 8px 24px #000a;font-family:'Syne',sans-serif}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .anom-badge{display:inline-block;background:#BF6B6020;color:#BF6B60;border-radius:4px;
              padding:1px 5px;font-size:9px;font-weight:700;margin-left:4px;white-space:nowrap;
              font-family:'DM Mono',monospace}
  .mini-bars{display:flex;gap:3px;align-items:flex-end}

  /* ── AUDITORIA ───────────────────────────────────────── */
  .aud-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
            margin-bottom:10px;overflow:hidden}
  .aud-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
            -webkit-tap-highlight-color:transparent}
  .aud-sev{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .aud-title{font-size:13px;font-weight:700;flex:1;min-width:0;line-height:1.35}
  .aud-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);
             background:#21262d;border-radius:10px;padding:3px 9px;white-space:nowrap}
  .aud-body{display:none;border-top:1px solid var(--border);padding:12px 14px}
  .aud-body.open{display:block}
  .aud-q{background:#1c2128;border-left:3px solid #C4A55C;border-radius:0 8px 8px 0;
         padding:10px 12px;font-size:12px;color:var(--text);line-height:1.65;margin-bottom:12px}
  .aud-q strong{color:#C4A55C}
  .aud-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
            padding:9px 0;border-bottom:1px solid #1c2128}
  .aud-item:last-child{border-bottom:none}
  .aud-item-t{font-size:12px;font-weight:600;line-height:1.4}
  .aud-item-s{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;line-height:1.5;word-break:break-word}
  .aud-item-v{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap;text-align:right}
  .forn-row{background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .forn-inner{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
  .forn-inner.open{display:block}

  /* ── DESKTOP (≥ 768px) ───────────────────────────────── */
  @media(min-width:768px){
    .header{padding:22px 24px 0}
    .header-title{font-size:24px}
    .header-title span{display:inline;margin-top:0}
    .content{padding:24px}
    .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    .kpi{padding:18px 20px}
    .kpi-value{font-size:22px}
    .kpi-full{grid-column:auto}
    .socio-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .fases-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    table{min-width:500px}
    .cdi-big{font-size:42px}
  }

/* ═══ Relatório: papel na tela e impressão A4 ═══ */
#tab13 .papel , #tab14 .papel { background:#fff; color:#1a1f24; border-radius:12px; padding:28px 30px; max-width:820px; margin:0 auto; font-family:'Space Grotesk',sans-serif; }
#tab13 .papel h1 , #tab14 .papel h1 { font-size:22px; margin:0 0 2px; } #tab13 .papel h2 , #tab14 .papel h2 { font-size:14px; margin:20px 0 8px; border-bottom:2px solid #1a1f24; padding-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
#tab13 .papel , #tab14 .papel { overflow:hidden; }
/* ── Tabelas densas: no celular rolam na horizontal em vez de espremer o texto ── */
@media (max-width:680px){
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap table{min-width:560px}
  .table-wrap td,.table-wrap th{white-space:nowrap}
  .table-wrap td .kpi-sub{white-space:normal;font-size:9px;line-height:1.2}
  td.num,th.num{font-size:10.5px}
}
/* subtexto dentro de célula: nunca compete com o número principal */
td .kpi-sub{font-size:9.5px;line-height:1.25;color:var(--text-3);margin-top:1px;font-weight:400}

/* ── Gráfico de caixa: rolagem horizontal e granularidade ── */
.cx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.cx-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cx-titulo{font-size:1.0625rem;font-weight:600;letter-spacing:-.02em}
.cx-gran{display:flex;gap:4px;background:var(--surface-3);border-radius:8px;padding:3px}
.cx-gran button{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:12px;
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.cx-gran button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cx-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;padding-bottom:4px}
.cx-scroll::-webkit-scrollbar{height:7px}
.cx-scroll::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:4px}
.cx-dica{font-size:10.5px;color:var(--text-3);margin-top:6px}
.chart-cx .fxg{stroke:rgba(255,255,255,.07)}
.chart-cx .fxzero{stroke:rgba(255,255,255,.34);stroke-width:1.4;stroke-dasharray:3 3}
@media (max-width:680px){
  .cx-card{padding:11px 9px}
  .cx-titulo{font-size:.95rem}
  .cx-gran button{font-size:11px;padding:5px 9px}
}
/* impressão: sem rolagem, a série inteira na largura da página */
@media print{
  .cx-scroll{overflow:visible !important}
  .cx-scroll > div{width:100% !important}
  .chart-cx{width:100% !important;max-height:200px}
  .chart-cx .fxg{stroke:#e1e7eb}
  .chart-cx .fxzero{stroke:#9aa4ac}
}

/* Rendimentos de aplicação — cabe na tela do celular sem rolagem lateral */
.rend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rend-tab table{width:100%;table-layout:fixed}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:10px}
.rend-tab td,.rend-tab th{padding:6px 5px}
@media (max-width:760px){
  .rend-grid{grid-template-columns:1fr 1fr}
  .rend-grid .kpi-value{font-size:1.05rem}
  .rend-grid .kpi-label{font-size:9px}
  .rend-grid .kpi-sub{font-size:9.5px}
  /* a coluna Carga sai: o percentual total já aparece no cartão de ganho líquido */
  .rend-tab .col-carga{display:none}
  .rend-tab table{font-size:10.5px}
  .rend-tab td,.rend-tab th{padding:5px 3px}
  .rend-tab{overflow-x:visible}
}
@media (max-width:400px){
  .rend-tab table{font-size:9.5px}
  .rend-tab td,.rend-tab th{padding:4px 2px}
}

/* ═══════════════════════════════════════════════════════════════════
   PAPEL UNIVERSAL — uma versão para celular, desktop e impressão.
   O conteúdo é clonado do painel (tema escuro) e reveste-se aqui:
   as variáveis de cor são redefinidas dentro do container, então tudo
   que usa var(--card), var(--border), var(--text) vira claro sozinho.
   Layout em INLINE-BLOCK, não em grid: grid não é suportado por vários
   motores de impressão e a página sairia com um cartão por linha.
   ═══════════════════════════════════════════════════════════════════ */
#btnRelPDF{white-space:nowrap}
@media (max-width:680px){ #btnRelPDF{font-size:11px;padding:6px 9px} }

#audRelOv .papel-auto{
  --bg:#fff; --card:#fff; --card2:#f8fafb; --surface-3:#eef2f5;
  --border:#dfe5ea; --hairline-strong:#c3ced6;
  --text:#111; --muted:#565e66; --text-3:#828b93;
  background:#fff;color:#111;border-radius:12px;padding:26px 30px;max-width:940px;margin:0 auto;
  font-family:'Inter',sans-serif;font-size:12px;line-height:1.45;
}
#audRelOv .papel-auto .rel-corpo{margin-top:12px}

/* ── cabeçalho do documento ── */
#audRelOv .papel-auto .rel-eyebrow{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8b939b;margin-bottom:4px}
#audRelOv .papel-auto h1{font-size:19px;line-height:1.2;margin:0 0 4px;letter-spacing:-.02em;font-weight:700;color:#111}
#audRelOv .papel-auto .rel-meta{font-size:10px;color:#565e66;padding-bottom:8px;border-bottom:2px solid #111}
#audRelOv .papel-auto .rel-rodape{margin-top:16px;padding-top:8px;border-top:1px solid #dfe5ea;font-size:8.5px;color:#98a0a8;line-height:1.5}
/* fecha os floats dos cartões de gráfico: sem isso sobra uma página em branco */

/* ── tabelas: densas, cabeçalho repetido, linha inteira por página ── */

#audRelOv .papel-auto tr{page-break-inside:avoid}
#audRelOv .papel-auto th{color:#6b737b;border-bottom:1.5px solid #111;background:transparent;
  font-size:7.5px;letter-spacing:.6px;padding:5px 5px;position:static !important}
#audRelOv .papel-auto td{color:#111;border-bottom:1px solid #eef1f4;padding:4.5px 5px;font-size:9.5px;
  word-break:normal;overflow-wrap:normal;hyphens:none}
/* Número é bloco indivisível: quebrar "R$ 1.381.800" em duas linhas destrói a leitura.
   Dígitos tabulares alinham as casas na vertical, coluna a coluna. */
#audRelOv .papel-auto td.num,#audRelOv .papel-auto th.num,
#audRelOv .papel-auto td[style*="text-align:right"],#audRelOv .papel-auto th[style*="text-align:right"]{
  white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* Em tabela larga, texto longo trunca com reticências em vez de empilhar e colidir
   com a linha de baixo. Em tabela normal há espaço e o texto pode quebrar por palavra. */
#audRelOv .papel-auto table{table-layout:fixed}
#audRelOv .papel-auto table.t-densa td:not(.num):not([style*="text-align:right"]),
#audRelOv .papel-auto table.t-muito-densa td:not(.num):not([style*="text-align:right"]){

/* cartões de gráfico lado a lado: um por linha desperdiça metade da página */
/* Sem float: float vazava para o conteúdo seguinte e espremia a página inteira em
   meia largura. O posicionamento lado a lado é feito no clone, e só quando há dois
   cartões irmãos — cartão sozinho ocupa a largura inteira. */
#audRelOv .papel-auto .cx-card{width:100% !important;float:none !important;display:block !important;clear:both;border-color:#e4eaee !important;padding:10px !important}
#audRelOv .papel-auto .cx-scroll{overflow:visible !important}

#audRelOv .papel-auto .rel-corpo > * > *:not(.fx-card){clear:both}

/* barras horizontais: o painel usa grid, que nem todo motor de impressão entende */
#audRelOv .papel-auto .hbar{display:block !important;padding:4px 0}
#audRelOv .papel-auto .hbar__name{display:inline-block;width:69%;font-size:10px;vertical-align:middle}
#audRelOv .papel-auto .hbar__val{display:inline-block;width:30%;text-align:right;font-size:10px;vertical-align:middle}
#audRelOv .papel-auto .hbar__track{display:block;width:100%;margin-top:3px;height:4px}
#audRelOv .papel-auto .chart line{stroke:#e1e7eb !important}

#audRelOv .papel-auto .hbar__name,#audRelOv .papel-auto .hbar__val{font-size:10px}

/* ── blocos de cartão diversos do painel ── */
#audRelOv .papel-auto .fases-grid{display:block;font-size:0}
#audRelOv .papel-auto .fases-grid > *{display:inline-block;vertical-align:top;width:32.2%;
  margin:0 1.5% 6px 0;font-size:11px;box-sizing:border-box}
#audRelOv .papel-auto .fases-grid > *:nth-child(3n){margin-right:0}
#audRelOv .papel-auto .fase-card{background:#f8fafb;border-radius:8px;padding:8px 10px}

/* ── celular: mesma versão, só respira menos. Restrito a TELA: o motor de
      impressão renderiza numa largura estreita e dispararia este bloco,
      jogando o relatório para duas colunas e desperdiçando a página. ── */
@media screen and (max-width:680px){
  #audRelOv{padding:8px}

  #audRelOv .papel-auto .chart-card,#audRelOv .papel-auto .fase-card{page-break-inside:avoid}

// parseVal: aceita número puro ou string em formato pt-BR ("110.000,00") ou americano
// Wrapper ciente de SINAL. O extrato traz despesa com valor negativo ("-1.000,00")
// e as regras de formato pt-BR abaixo ancoram em ^\d, então o menos fazia a string
// cair no ramo genérico e "-1.000,00" virava -1. As abas antigas nunca tiveram
// negativo, por isso o defeito só apareceu agora.
const parseVal = s => {
  if (s === null || s === undefined || s === "") return 0;
  if (typeof s === "number") return s;
  let raw = String(s).trim();
  let neg = false;
  if (/^\(.*\)$/.test(raw)) { neg = true; raw = raw.slice(1, -1).trim(); }   // (1.000,00)
  raw = raw.replace(/R\$\s*/g, "").trim();
  if (/^-/.test(raw))      { neg = true; raw = raw.replace(/^-\s*/, ""); }     // -1.000,00
  else if (/-$/.test(raw)) { neg = true; raw = raw.replace(/\s*-$/, ""); }     // 1.000,00-
  const abs = _parseValAbs(raw);
  return neg ? -abs : abs;
};
window.parseVal = parseVal;
const _parseValAbs = s => {
  if(s === null || s === undefined || s === "") return 0;
  // Número puro direto
  if(typeof s === "number") return s;
  let v = String(s).trim()
    .replace(/R\$\s*/g,"")
    .replace(/\s/g,"");
  if(!v) return 0;
  // Formato pt-BR: tem ponto como milhar E vírgula como decimal  ex: "110.000,00"
  // Detecta: dígitos, ponto, 3 dígitos, vírgula, dígitos
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) {
    v = v.replace(/\./g,"").replace(",",".");
    return parseFloat(v) || 0;
  }
  // Formato americano: vírgula como milhar, ponto como decimal  ex: "110,000.00"
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) {
    v = v.replace(/,/g,"");
    return parseFloat(v) || 0;
  }
  // Sem separador de milhar: "110000" ou "110000.50" ou "110000,50"
  v = v.replace(",",".");
  return parseFloat(v) || 0;
};

// ── HELPERS: TIR, SPARKLINE, TOOLTIPS, SEMÁFORO ─────────────────
// XIRR por bissecção — flows: [{dt: Date, v: Number}] (aportes negativos, retornos positivos)
function xirr(flows) {
  if (!flows || flows.length < 2) return null;
  const fs = [...flows].sort((a,b) => a.dt - b.dt);
  const t0 = fs[0].dt;
  const yrs = f => (f.dt - t0) / 31557600000; // 365.25 dias
  const npv = r => fs.reduce((s,f) => s + f.v / Math.pow(1+r, yrs(f)), 0);
  let lo = -0.9999, hi = 10, flo = npv(lo), fhi = npv(hi);
  if (isNaN(flo) || isNaN(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 120; i++) {
    const mid = (lo + hi) / 2, fm = npv(mid);
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

// Sparkline SVG inline (leve, sem Chart.js)
function sparkSVG(vals, color, w, h) {
  w = w || 120; h = h || 28;
  if (!vals || vals.length < 2) return '';
  const mx = Math.max(...vals), mn = Math.min(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v,i) =>
    ((i/(vals.length-1))*w).toFixed(1) + ',' + (h-2-((v-mn)/rg)*(h-4)).toFixed(1)
  ).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block;margin-top:7px;max-width:100%"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5"/></svg>';
}

// Normaliza nome do sócio — capitaliza, ignora linhas de total/título e aplica mapa de exibição
// ── Mapeamento de nomes ──────────────────────────────────────────
// Qualquer variação contendo essas substrings → nome canônico
// Ordem importa: verificado de cima para baixo, para no primeiro match
const NOME_MAP = CFG.nomesMap;

function normalizeSocio(nome) {
  if(!nome) return null;
  const n = nome.toUpperCase().trim();
  if(n.length < 3) return null;
  // Rejeita linhas de cabeçalho / totais
  const ignorar = ["NOME DO","RECEITA","RETIRADA","EQUILÍB","EQUILIB",
                   "DIFERENÇA","DIFERENCA","TOTAL","APORTE","AFAC",
                   "LIBERTY UNIQUE","SÓCIO","SOCIO","FORNECEDOR"];
  if(ignorar.some(x => n.includes(x))) return null;
  // Mapeamento por substring
  for(const { match, nome: nomeFinal } of NOME_MAP) {
    if(match.some(sub => n.includes(sub.toUpperCase()))) return nomeFinal;
  }
  // Fallback: capitaliza normalmente (nomes não mapeados)
  return nome.trim().split(" ")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
    .join(" ");
}

// Normaliza data — trata formato misto do Google Sheets
// Datas antigas: DD/MM/AAAA | Datas recentes: M/D/AAAA (americano)
// Regra: se o segundo número > 12, então primeiro=mês, segundo=dia (americano)
//        se o primeiro número > 12, então primeiro=dia, segundo=mês (brasileiro)
//        se ambos <= 12, assume DD/MM/AAAA (formato padrão da planilha)
function normalizeDate(s) {
  if(!s) return null;
  s = s.trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  let dia = parseInt(m[1]), mes = parseInt(m[2]);
  // se segundo número > 12 → formato americano M/D/AAAA
  if(mes > 12 && dia <= 12) { [dia, mes] = [mes, dia]; }
  if(dia < 1 || dia > 31 || mes < 1 || mes > 12) return null;
  return `${String(dia).padStart(2,"0")}/${String(mes).padStart(2,"0")}/${m[3]}`;
}

// ── FETCH DO GOOGLE SHEETS VIA API JSON ──────────────────────────
// Usa a API de visualização que retorna JSON estruturado com datas preservadas
const GVIZ_CACHE_TTL = 10 * 60 * 1000; // 10 minutos — botão ↻ força atualização

async function fetchSheet(aba, sheetId) {
  const sid = sheetId || SHEET_ID;
  const ck  = 'gviz_' + sid + '_' + (aba && aba.gid !== undefined ? 'gid' + aba.gid : aba);
  // Cache em sessionStorage: reabrir abas/painel fica quase instantâneo
  try {
    const hit = sessionStorage.getItem(ck);
    if (hit) {
      const obj = JSON.parse(hit);
      if (Date.now() - obj.t < GVIZ_CACHE_TTL) return obj.j;
    }
  } catch(e) {}
  // CSV em vez de JSON: o out:json TIPIFICA as colunas e devolve null para células
  // que não batem com o tipo inferido — em planilhas com datas mistas (texto + data),
  // isso silenciosamente descarta linhas. O CSV devolve o que está NA TELA, sempre.
  // Suporta busca por GID (aba = {gid:N}) — imune a nome/acento/conversão de arquivos .xlsx
  const seletor = (aba && typeof aba === 'object' && aba.gid !== undefined)
    ? `gid=${aba.gid}` : `sheet=${encodeURIComponent(aba)}`;
  // headers=1: declara UMA linha de cabeçalho. Sem o parâmetro o Google auto-detecta
  // e pode ABSORVER as primeiras linhas de dados como cabeçalho (comeu 6 aportes de 2021);
  // com headers=0 ele apaga o texto do cabeçalho em colunas numéricas. headers=1 resolve os dois.
  const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv&${seletor}&headers=1`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Erro ao buscar aba "${aba && aba.gid !== undefined ? "gid " + aba.gid : aba}": ${res.status}`);
  const text = await res.text();
  if (/^\s*</.test(text) && !text.includes('setResponse')) 
    throw new Error(`Aba "${aba && aba.gid !== undefined ? "gid " + aba.gid : aba}" não encontrada na planilha (resposta HTML)`);
  // compat: resposta antiga em JSON (mocks/testes) continua aceita
  const mjson = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
  const json = mjson ? JSON.parse(mjson[1]) : { csv: parseCSV(text) };
  try { sessionStorage.setItem(ck, JSON.stringify({ t: Date.now(), j: json })); } catch(e) {}
  // Sentinela de carga: guarda quantas linhas cada aba trouxe, para comparar com a
  // carga anterior. Filtro ativo na planilha faz o Google devolver só as linhas
  // visíveis, sem erro nenhum — o painel recebe um CSV válido e incompleto.
  try {
    const nLinhas = (json && json.csv) ? json.csv.length
                  : (json && json.table && json.table.rows) ? json.table.rows.length : 0;
    const nome = (aba && aba.gid !== undefined) ? ('gid'+aba.gid) : String(aba);
    window._cargaAtual = window._cargaAtual || {};
    window._cargaAtual[nome] = nLinhas;
  } catch(e) {}
  return json;
}

// ═══ Sentinela de integridade de carga ═══
// Compara o volume de cada aba com a última carga registrada e acusa quedas bruscas
// ou volumes implausíveis. Objetivo: nenhum número errado passar despercebido.
const CARGA_QUEDA_ALERTA = 0.25;    // queda de 25% ou mais dispara alerta
function cargaChave(){ return 'carga_' + SHEET_ID; }
function cargaBaseline(){ try { return JSON.parse(localStorage.getItem(cargaChave())||'{}'); } catch(e){ return {}; } }
function cargaAvaliar(){
  const atual = window._cargaAtual || {};
  const base = cargaBaseline();
  const avisos = [];
  Object.entries(atual).forEach(([aba, n]) => {
    const ant = base[aba];
    if (typeof ant === 'number' && ant > 20 && n < ant * (1 - CARGA_QUEDA_ALERTA)) {
      avisos.push({ aba, n, ant, tipo: 'queda',
        txt: 'A aba <strong>' + aba + '</strong> trouxe <strong>' + n.toLocaleString('pt-BR') +
             ' linhas</strong>, contra ' + ant.toLocaleString('pt-BR') + ' na carga anterior — queda de ' +
             Math.round((1 - n/ant)*100) + '%.' });
    }
    if (n === 0) avisos.push({ aba, n, tipo:'vazia', txt: 'A aba <strong>'+aba+'</strong> voltou <strong>vazia</strong>.' });
  });
  // plausibilidade: obra com casas vendidas precisa ter muitas parcelas de receita
  const nRec = (typeof _RECEITAS !== 'undefined' && _RECEITAS) ? _RECEITAS.length : null;
  const nAp  = (typeof _APORTES  !== 'undefined' && _APORTES)  ? _APORTES.length  : 0;
  if (nRec !== null && nRec < 100 && (CFG.nCasas||0) > 10) {
    avisos.push({ aba: CFG.abaReceitas, n: nRec, tipo:'implausivel',
      txt: 'Só <strong>' + nRec + ' receita(s)</strong> carregadas para um empreendimento de ' + CFG.nCasas +
           ' casas' + (nAp ? ' (mas ' + nAp + ' aportes vieram normalmente)' : '') + '.' });
  }
  return avisos;
}
function cargaGravarBaseline(){
  // só grava como referência uma carga que passou na avaliação — assim uma carga
  // truncada não vira o novo normal e apaga o alerta na próxima vez
  try {
    if (cargaAvaliar().length === 0 && Object.keys(window._cargaAtual||{}).length)
      localStorage.setItem(cargaChave(), JSON.stringify(window._cargaAtual));
  } catch(e) {}
}
// Deixa explícito de onde vêm os números — e o que muda quando o extrato entra.
// ═══════════════════════════════════════════════════════════════════
// CONTRATOS COMERCIAIS — a base de parcelas vista por contrato, não por lançamento
// Uma casa pode ter vários contratos ao longo do tempo: vendida, distratada, revendida.
// Somar todos superestima o contratado e cria um "a receber" que nunca vai entrar,
// porque o saldo de um contrato encerrado não é cobrável de ninguém.
// ═══════════════════════════════════════════════════════════════════
function contratosComerciais(){
  const com = (window._comercial && window._comercial.receitas) ? window._comercial.receitas
            : (typeof _RECEITAS!=='undefined' ? _RECEITAS : []);
  const venda = r => r.grupo === 'venda' || /Venda|INCC/i.test(r.tipo||'');
  // Um CONTRATO é uma CASA com um titular. Agrupar por casa e, dentro dela, por
  // titular — assim personalização, INCC e saldo de financiamento entram no
  // contrato da casa a que pertencem, em vez de virarem contratos fantasma.
  const casas = {};
  const semCasa = [];
  com.filter(venda).forEach(r=>{
    const casa = r.casa || extrairCasa(r.desc);
    if (!casa) { semCasa.push(r); return; }
    const cli = String(r.cliente||'—').trim();
    const c = (casas[casa] = casas[casa] || { casa, titulares:{} });
    const t = (c.titulares[cli] = c.titulares[cli] || { cliente:cli, orig:0, receb:0, parcelas:[], distratado:false, ultima:null });
    t.orig += (r.valOrig||0); t.receb += (r.valReceb||0); t.parcelas.push(r);
    if (/DISTRAT/i.test(r.desc||'')) t.distratado = true;
    const d = parseDate(r.dataComp); if (d && (!t.ultima || d > t.ultima)) t.ultima = d;
  });
  const unidades = Object.values(casas).map(c=>{
    const tits = Object.values(c.titulares);
    const ativosT = tits.filter(t=>!t.distratado);
    // titular vigente: entre os não distratados, o de maior valor contratado.
    // Os demais costumam ser acessórios (sinal de terceiro, ajuste) e são somados a ele.
    ativosT.sort((a,b)=>b.orig-a.orig);
    const vigente = ativosT[0] || null;
    const orig  = ativosT.reduce((s,t)=>s+t.orig,0);
    const receb = ativosT.reduce((s,t)=>s+t.receb,0);
    const parcelas = ativosT.flatMap(t=>t.parcelas);
    return { casa:c.casa, cliente: vigente ? vigente.cliente : '—',
             titulares: tits, nTitulares: tits.length,
             distratosNaCasa: tits.filter(t=>t.distratado).length,
             vendida: !!vigente, orig, receb, saldo: Math.max(0, orig-receb),
             parcelas, distratado: !vigente,
             ultima: vigente ? vigente.ultima : null };
  }).sort((a,b)=>a.casa-b.casa);

  // ═══ A apuração curada manda ═══
  // Quando existe a aba GESTAO VENDAS, ela é a autoridade sobre o que está vendido
  // e sobre o preço de cada unidade. A base de parcelas não sabe dizer que uma casa
  // voltou ao estoque quando a revenda ainda não começou a ser lançada.
  const gv = (typeof _GV !== 'undefined' && _GV && _GV.length) ? _GV : null;
  let curado = null;
  if (gv) {
    const disp = gv.filter(g=>/DISPON/i.test(String(g.status||'')));
    curado = {
      status: {}, valor: {},
      nDisponiveis: disp.length,
      vgvEstoque: disp.reduce((s,g)=>s+(g.valor||0),0),
      casasDisponiveis: disp.map(g=>g.casa).sort((a,b)=>a-b),
      total: gv.length
    };
    gv.forEach(g=>{ curado.status[g.casa] = String(g.status||''); curado.valor[g.casa] = g.valor||0; });
    unidades.forEach(u=>{
      const st = curado.status[u.casa];
      if (st !== undefined) {
        u.statusCurado = st;
        u.valorVenda = curado.valor[u.casa] || 0;
        u.vendida = !/DISPON/i.test(st);        // a curadoria decide
        u.distratado = !u.vendida;
      }
    });
  }
  const ativos     = unidades.filter(u=>u.vendida);
  const encerrados = unidades.filter(u=>!u.vendida);
  const casasAtivas = new Set(ativos.map(u=>u.casa));
  const nCasas = (curado ? curado.total : 0) || CFG.nCasas || unidades.length;
  const ticketMedio = ativos.length ? ativos.reduce((s,u)=>s+u.orig,0)/ativos.length : 0;
  const nEstoque = curado ? curado.nDisponiveis : Math.max(0, nCasas - casasAtivas.size);
  const estoqueVGV = curado ? curado.vgvEstoque : nEstoque*ticketMedio;
  return { todos:unidades, ativos, encerrados, casasAtivas, nCasas, nEstoque,
           ticketMedio, estoqueVGV, curado,
           semCasa, semCasaValor: semCasa.reduce((s,r)=>s+(r.valOrig||0),0) };
}

// ═══════════════════════════════════════════════════════════════════
// INCC-DI (FGV) — série mensal real, para corrigir o saldo devedor
// Fonte: FGV, via brasilindicadores. Atualizar aqui quando sair mês novo.
// ═══════════════════════════════════════════════════════════════════
const INCC_MENSAL = {
  2022: [0.71,0.38,0.86,0.95,2.28,2.14,0.86,0.09,0.09,0.12,0.36,0.09],
  2023: [0.46,0.05,0.30,0.14,0.59,0.71,0.10,0.17,0.34,0.20,0.07,0.31],
  2024: [0.27,0.13,0.28,0.52,0.86,0.71,0.72,0.70,0.58,0.68,0.40,0.50],
  2025: [0.83,0.40,0.39,0.52,0.58,0.69,0.91,0.52,0.17,0.30,0.27,0.21],
  2026: [0.72,0.28,0.54,1.00,0.88,0.78]
};
const INCC_FALLBACK = 0.55;   // média mensal recente, para meses ainda não divulgados
function inccMes(ano, mes){   // mes 1..12
  const a = INCC_MENSAL[ano];
  if (a && a[mes-1] !== undefined && a[mes-1] !== null) return a[mes-1];
  return INCC_FALLBACK;
}
function inccUltimoMes(){
  const anos = Object.keys(INCC_MENSAL).map(Number).sort((a,b)=>b-a);
  const a = anos[0];
  return { ano:a, mes: INCC_MENSAL[a].length };
}

// ═══════════════════════════════════════════════════════════════════
// SALDO DEVEDOR POR CASA, corrigido pelo INCC mês a mês
// O contrato de imóvel na planta corrige o SALDO todo mês pelo INCC e abate os
// pagamentos. Simular assim, e não aplicar um índice único no fim, é o que
// reproduz o que o cliente realmente deve.
// ═══════════════════════════════════════════════════════════════════
function saldoDevedorCasas(){
  const gv = (typeof _GV !== 'undefined' && _GV && _GV.length) ? _GV : null;
  if (!gv) return null;
  const C = contratosComerciais();
  const porCasa = {}; C.todos.forEach(u=>porCasa[u.casa]=u);
  const hoje = new Date();
  const ultimo = inccUltimoMes();
  const linhas = gv.filter(g=>!/DISPON/i.test(g.status||'')).map(g=>{
    const u = porCasa[g.casa];
    const valor = g.valor || 0;
    const dv = parseDate(g.dataVenda);
    // pagamentos do contrato vigente: só PRINCIPAL (INCC pago é correção, não amortiza o
    // principal contratado — ele quita a própria correção)
    const parc = u ? u.parcelas : [];
    const principais = parc.filter(p=>p.tipo==='Venda' && (p.valReceb||0)>0)
                           .map(p=>({ d:parseDate(p.dataComp), v:p.valReceb }))
                           .filter(p=>p.d).sort((a,b)=>a.d-b.d);
    const inccPago = parc.filter(p=>p.tipo==='INCC').reduce((s,p)=>s+(p.valReceb||0),0);
    const pagoPrincipal = principais.reduce((s,p)=>s+p.v,0);
    // simulação mês a mês desde a venda
    let saldo = valor, corrigido = 0, pagoAntesDaVenda = 0;
    if (dv && valor > 0) {
      let y = dv.getFullYear(), m = dv.getMonth()+1;
      const ym = (yy,mm) => yy*100+mm;
      const noMes = (yy,mm) => principais.filter(p=>ym(p.d.getFullYear(), p.d.getMonth()+1) === ym(yy,mm))
                                          .reduce((s,p)=>s+p.v,0);
      // Pagamentos ANTERIORES ao mês do contrato — sinal, reserva, entrada — abatem o
      // saldo desde o início. Sem isso, o saldo cheio corrigia por todo o período e a
      // correção estourava: era o que fazia a casa 31 acusar R$ 840 mil de INCC.
      pagoAntesDaVenda = principais.filter(p=>ym(p.d.getFullYear(), p.d.getMonth()+1) < ym(y,m))
                                   .reduce((s,p)=>s+p.v,0);
      saldo -= pagoAntesDaVenda;
      saldo -= noMes(y,m);
      let guarda = 0;
      while ((y < ultimo.ano || (y === ultimo.ano && m < ultimo.mes)) && guarda++ < 400) {
        m++; if (m > 12) { m = 1; y++; }
        if (saldo > 0) { const j = saldo * inccMes(y,m)/100; corrigido += j; saldo += j; }
        saldo -= noMes(y,m);
      }
    }
    const saldoNominal = Math.max(0, valor - pagoPrincipal);
    const saldoCorrigido = Math.max(0, saldo);
    const inccDevido = Math.max(0, saldoCorrigido - saldoNominal);
    return { casa:g.casa, cliente: (u && u.cliente) || g.cliente || '—', status:g.status||'',
             dataVenda:g.dataVenda, valor, pagoPrincipal, inccPago,
             saldoNominal, saldoCorrigido, inccDevido, corrigidoTotal: corrigido, pagoAntesDaVenda,
             pct: valor>0 ? pagoPrincipal/valor*100 : 0,
             meses: dv ? Math.max(0, Math.round((hoje-dv)/2629800000)) : null };
  }).sort((a,b)=>b.saldoCorrigido-a.saldoCorrigido);
  const tot = f => linhas.reduce((s,l)=>s+l[f],0);
  return { linhas, ultimo,
    totalVGV: tot('valor'), totalPago: tot('pagoPrincipal'), totalInccPago: tot('inccPago'),
    totalNominal: tot('saldoNominal'), totalCorrigido: tot('saldoCorrigido'), totalIncc: tot('inccDevido'),
    comSaldo: linhas.filter(l=>l.saldoCorrigido>1000).length };
}

// ═══════════════════════════════════════════════════════════════════
// INADIMPLÊNCIA — parcelas vencidas e não quitadas, de contratos ATIVOS
// ═══════════════════════════════════════════════════════════════════
function inadimplenciaDados(){
  const C = contratosComerciais();
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const abertas = [];
  C.ativos.forEach(c=>{
    c.parcelas.forEach(p=>{
      const falta = (p.valOrig||0) - (p.valReceb||0);
      if (falta <= 1) return;
      const dv = parseDate(p.dataVenc);
      const dias = dv ? Math.floor((hoje - dv)/86400000) : null;
      abertas.push({ casa:c.casa, cliente:c.cliente, desc:p.desc, venc:p.dataVenc,
                     orig:p.valOrig||0, pago:p.valReceb||0, falta, dias,
                     situacao:p.situacao||'', vencida: dias !== null && dias > 0 });
    });
  });
  const vencidas = abertas.filter(a=>a.vencida).sort((a,b)=>b.falta-a.falta);
  const aVencer  = abertas.filter(a=>!a.vencida).sort((a,b)=>parseDate(a.venc)-parseDate(b.venc));
  const faixa = (min,max) => vencidas.filter(a=>a.dias>=min && (max===null || a.dias<=max));
  const faixas = [
    { rot:'1 a 30 dias',    itens:faixa(1,30),   cor:'#C4A55C' },
    { rot:'31 a 60 dias',   itens:faixa(31,60),  cor:'#C09257' },
    { rot:'61 a 90 dias',   itens:faixa(61,90),  cor:'#BF6B60' },
    { rot:'mais de 90 dias',itens:faixa(91,null),cor:'#A8392C' },
  ].map(f=>Object.assign(f,{ v: f.itens.reduce((s,x)=>s+x.falta,0) }));
  // por cliente, para a régua de cobrança
  const porCli = {};
  vencidas.forEach(a=>{ const k=a.cliente+'|'+a.casa;
    const g=(porCli[k]=porCli[k]||{cliente:a.cliente, casa:a.casa, v:0, n:0, pior:0});
    g.v+=a.falta; g.n++; if(a.dias>g.pior) g.pior=a.dias; });
  const clientes = Object.values(porCli).sort((a,b)=>b.v-a.v);
  const totalVencido = vencidas.reduce((s,a)=>s+a.falta,0);
  const totalAVencer = aVencer.reduce((s,a)=>s+a.falta,0);
  // a base exporta parcela em aberto? se quase tudo vem quitado, ela não exporta
  const totalParcelas = C.ativos.reduce((s,c)=>s+c.parcelas.length,0);
  const pctAberto = totalParcelas ? abertas.length/totalParcelas*100 : 0;
  const baseSemAberto = abertas.length < 5 || pctAberto < 1;
  return { C, abertas, vencidas, aVencer, faixas, clientes, totalVencido, totalAVencer,
           totalParcelas, pctAberto, baseSemAberto };
}

// ═══════════════════════════════════════════════════════════════════
// EXTRATO VENDAS — a venda de cada casa vista pelo DINHEIRO que entrou
// Fonte exclusiva: EXTRATO GERAL. Enquanto a base de parcelas mostra o que o
// contrato previa (e traz a quitação contábil dos distratos como se fosse
// recebimento), o extrato mostra o que de fato passou pela conta. Valor de venda,
// status e data vêm da apuração curada, que o extrato não tem.
// ═══════════════════════════════════════════════════════════════════
// Custos que a revenda embutiu e precisam sair do ganho para o número ser real.
// A casa 16 foi revendida MOBILIADA: o ganho aparente inclui o mobiliário.
const REVENDA_CUSTOS = { 16: { valor: 450000, motivo: 'mobiliário incluído' } };

// Preço do contrato de cada comprador, derivado da base comercial: soma do valor
// ORIGINAL das parcelas daquele cliente naquela casa. Permite comparar o preço da
// venda anterior com o da revenda sem depender de coluna preenchida à mão.
function precoContratoPorPessoa(){
  const com = (window._comercial && window._comercial.receitas) ? window._comercial.receitas : [];
  const m = {};
  com.forEach(r=>{
    if (!(r.grupo === 'venda' || /Venda|INCC/i.test(r.tipo||''))) return;
    if (r.tipo === 'INCC') return;                     // correção não é preço
    const c = r.casa || extrairCasa(r.desc); if (!c) return;
    const k = c + '|' + String(r.cliente||'—').trim();
    (m[k] = m[k] || { casa:c, cliente:String(r.cliente||'—').trim(), valor:0, n:0 });
    m[k].valor += (r.valOrig || r.valReceb || 0); m[k].n++;
  });
  return m;
}

function extratoVendasDados(){
  const ex = window._extrato;
  if (!ex) return null;
  const gv = (typeof _GV !== 'undefined' && _GV && _GV.length) ? _GV : [];
  const porCasaGV = {}; gv.forEach(g=>porCasaGV[g.casa]=g);

  // ── recebimentos por casa, separados por natureza ──
  const casas = {};
  const zero = c => (casas[c] = casas[c] || { casa:c, venda:0, distratada:0, incc:0, person:0, outros:0,
                                              total:0, n:0, clientes:{}, primeiro:null, ultimo:null });
  const distPorPessoa = {};   // casa|cliente → recebido do distratado
  ex.receitas.forEach(r=>{
    if (!/CONCILIADO/i.test(r.situacao||'') && r.situacao) return;   // só dinheiro confirmado
    const c = extrairCasa(r.desc); if (!c) return;
    const g = zero(c); const v = r.valReceb||0;
    // TODO crédito da casa é registrado por pessoa, não só o marcado como distrato.
    // Sinal, reserva, pix, entrada e parcela avulsa entram — é o que permite parear a
    // devolução com o dinheiro que aquele comprador realmente pôs.
    {
      const nome = String(r.cliente||'—').trim();
      const kk = c + '|' + nome;
      const p = (distPorPessoa[kk] = distPorPessoa[kk] || { casa:c, cliente:nome, recebido:0, devolvido:0,
                                                            marcadoDistrato:false, primeiro:null, ultimo:null });
      p.recebido += v;
      if (r.tipo === 'VendaDistratada' || /DISTRAT/i.test(r.desc||'')) p.marcadoDistrato = true;
      const dd = parseDate(r.dataComp);
      if (dd) { if (!p.primeiro || dd < p.primeiro) p.primeiro = dd; if (!p.ultimo || dd > p.ultimo) p.ultimo = dd; }
    }
    if (r.tipo === 'Venda') g.venda += v;
    else if (r.tipo === 'VendaDistratada') g.distratada += v;
    else if (r.tipo === 'INCC') g.incc += v;
    else if (r.tipo === 'Personalizacao') g.person += v;
    else g.outros += v;
    g.total += v; g.n++;
    const cli = String(r.cliente||'—').trim();
    g.clientes[cli] = (g.clientes[cli]||0) + v;
    const d = parseDate(r.dataComp);
    if (d) { if (!g.primeiro || d < g.primeiro) g.primeiro = d; if (!g.ultimo || d > g.ultimo) g.ultimo = d; }
  });
  // ── devoluções de distrato por casa ──
  const devol = {};
  ex.despesas.forEach(r=>{
    if (!/CONCILIADO/i.test(r.situacao||'') && r.situacao) return;
    const d = _audNorm(r.descOriginal||r.descricao||''), cat = _audNorm(r.categoria||'');
    if (!/DISTRAT|PRE SINAL|PRÉ SINAL/.test(d) && !/DISTRATO/.test(cat)) return;
    const c = extrairCasa(r.descOriginal||r.descricao); if (!c) return;
    (devol[c] = devol[c] || { v:0, n:0, quem:[] });
    devol[c].v += r.valor; devol[c].n++;
    const quem = String(r.fornecedor||'—').trim();
    // Devolução paga a outra SPE do grupo não é devolução ao comprador: é reembolso
    // entre obras, porque o distratado havia pago na conta da obra vizinha.
    if (/^(BOSSA NOVA|JAZZ|LIBERTY|FORMES)/i.test(quem)) {
      (devol[c] = devol[c] || { v:0, n:0, quem:[] });
      devol[c].v += r.valor; devol[c].n++;
      const alvoSPE = Object.keys(distPorPessoa).filter(x=>x.startsWith(c+'|') && distPorPessoa[x].recebido>0)
                        .sort((a,b)=>distPorPessoa[b].recebido-distPorPessoa[a].recebido)[0];
      if (alvoSPE) { distPorPessoa[alvoSPE].devolvido += r.valor; distPorPessoa[alvoSPE].marcadoDistrato = true; }
      return;
    }
    // Devolução paga a outra SPE do grupo não é devolução ao comprador: é reembolso
    // entre obras, porque o distratado havia pago na conta da obra vizinha.
    if (/^(BOSSA NOVA|JAZZ|LIBERTY|FORMES)/i.test(quem)) {
      (devol[c] = devol[c] || { v:0, n:0, quem:[] });
      devol[c].v += r.valor; devol[c].n++;
      const alvoSPE = Object.keys(distPorPessoa).filter(x=>x.startsWith(c+'|') && distPorPessoa[x].recebido>0)
                        .sort((a,b)=>distPorPessoa[b].recebido-distPorPessoa[a].recebido)[0];
      if (alvoSPE) { distPorPessoa[alvoSPE].devolvido += r.valor; distPorPessoa[alvoSPE].marcadoDistrato = true;
                     distPorPessoa[alvoSPE].viaSPE = (distPorPessoa[alvoSPE].viaSPE||0) + r.valor; }
      return;
    }
    if (devol[c].quem.length < 3) devol[c].quem.push(quem);
    // casa a devolução no comprador distratado correspondente
    // Pareamento em três tentativas, da mais forte para a mais frouxa:
    // nome exato → primeiras palavras do nome → único crédito da casa sem devolução.
    const kk = c + '|' + quem;
    const marcar = alvo => { alvo.devolvido += r.valor; alvo.marcadoDistrato = true; };
    if (distPorPessoa[kk]) marcar(distPorPessoa[kk]);
    else {
      const nq = _audNorm(quem).split(/\s+/).slice(0,2).join(' ');
      const alt = Object.keys(distPorPessoa).filter(x=>x.startsWith(c+'|'))
        .find(x=>{ const n2=_audNorm(x.split('|')[1]).split(/\s+/).slice(0,2).join(' ');
                   return n2 && nq && (n2===nq || n2.startsWith(nq) || nq.startsWith(n2)); });
      if (alt) marcar(distPorPessoa[alt]);
      else {
        // sem nome compatível: se a casa tem um único crédito ainda sem devolução, é ele
        const candidatos = Object.keys(distPorPessoa).filter(x=>x.startsWith(c+'|') && distPorPessoa[x].devolvido===0 && distPorPessoa[x].recebido>0);
        if (candidatos.length === 1) marcar(distPorPessoa[candidatos[0]]);
        else distPorPessoa[kk] = { casa:c, cliente:quem, recebido:0, devolvido:r.valor,
                                   marcadoDistrato:true, semCredito:true, primeiro:null, ultimo:null };
      }
    }
  });

  // ── linha por casa: as 66 ──
  const nCasas = (gv.length || CFG.nCasas || 0);
  const listaCasas = gv.length ? gv.map(g=>g.casa) : Object.keys(casas).map(Number);
  const linhas = listaCasas.sort((a,b)=>a-b).map(c=>{
    const g = casas[c] || zero(c);
    const info = porCasaGV[c] || {};
    const dv = devol[c] || { v:0, n:0, quem:[] };
    const valorVenda = info.valor || 0;
    const disponivel = /DISPON/i.test(info.status||'');
    const clientes = Object.entries(g.clientes).sort((a,b)=>b[1]-a[1]);
    const principal = clientes.length ? clientes[0][0] : (info.cliente || '—');
    // caixa líquido da unidade: tudo que entrou menos o que voltou ao distratado
    const liquido = g.total - dv.v;
    const saldoContrato = disponivel ? 0 : Math.max(0, valorVenda - g.venda);
    return { casa:c, status:info.status||'—', dataVenda:info.dataVenda||'', valorVenda,
             cliente: info.cliente || principal, nClientes: clientes.length,
             venda:g.venda, distratada:g.distratada, incc:g.incc, person:g.person, outros:g.outros,
             totalRecebido:g.total, nLanc:g.n,
             devolvido:dv.v, nDevol:dv.n, liquido,
             saldoContrato, disponivel,
             pct: valorVenda>0 ? g.venda/valorVenda*100 : 0,
             primeiro:g.primeiro, ultimo:g.ultimo,
             nDist: info.nDist||0, ganhoRev: info.ganhoRev||0, comPerdidas: info.comPerdidas||0 };
  });

  // ── distratos: crédito, devolução e ganho na revenda ──
  const distratos = linhas.filter(l=>l.nDist>0 || l.distratada>0 || l.devolvido>0).map(l=>{
    const cst = REVENDA_CUSTOS[l.casa] || null;
    const custoRev = cst ? cst.valor : 0;
    // Cada comprador distratado da casa vira uma OCORRÊNCIA própria. Uma casa com dois
    // distratos aparece com duas linhas, uma sob a outra.
    const ocor = Object.values(distPorPessoa)
                       .filter(p=>p.casa===l.casa && (p.devolvido>0 || p.marcadoDistrato))
                       .sort((a,b)=>(a.primeiro||0)-(b.primeiro||0));
    const somaRec = ocor.reduce((s,o)=>s+o.recebido,0);
    const precos = precoContratoPorPessoa();
    ocor.forEach((o,i)=>{
      o.ordem = i+1;
      const pk = precos[l.casa + '|' + o.cliente];
      o.precoContrato = pk ? pk.valor : 0;
      o.retido = o.recebido - o.devolvido;
      // a comissão perdida vem por casa; rateia pelo que cada comprador pagou
      // A comissão perdida da casa é rateada pelo que cada comprador pagou, mas nunca
      // além do que ficou retido: comissão de venda vigente não é perda de distrato.
      const bruta = somaRec>0 ? l.comPerdidas*(o.recebido/somaRec) : (i===0 ? l.comPerdidas : 0);
      o.comPerdidas = Math.min(bruta, Math.max(0, o.retido));
      o.comExcedente = bruta - o.comPerdidas;
      o.resultado = o.retido - o.comPerdidas;
    });
    // Dois ganhos de naturezas diferentes, mantidos separados:
    //   RESULTADO DO DISTRATO — caixa retido: recebido − devolvido − comissão perdida
    //   GANHO DE REVENDA      — diferença de preço, líquida de custos embutidos
    const resultadoDistrato = ocor.length ? ocor.reduce((s,o)=>s+o.resultado,0)
                                         : (l.distratada - l.devolvido - l.comPerdidas);
    // Regra do negócio: não houve revenda abaixo do preço da venda anterior. Ganho
    // negativo na apuração indica preço anterior mal registrado, não prejuízo real —
    // então o valor é preservado para conferência mas não entra no total como perda.
    const ganhoBrutoAjust = Math.max(0, l.ganhoRev);
    const ganhoSuspeito = l.ganhoRev < 0;
    const ganhoRevLiq = ganhoBrutoAjust - custoRev;
    // Ganho DERIVADO: preço atual menos o preço do último contrato distratado.
    const ultimoDist = ocor.length ? ocor[ocor.length-1] : null;
    const precoAnteriorDer = ultimoDist ? ultimoDist.precoContrato : 0;
    const ganhoDerivadoCalc = (l.valorVenda && precoAnteriorDer) ? (l.valorVenda - precoAnteriorDer) : null;
    return { casa:l.casa, nDist: Math.max(l.nDist, ocor.length), ocorrencias: ocor,
      recebidoDistratado:l.distratada, devolvido:l.devolvido,
      retido: l.distratada - l.devolvido, comPerdidas:l.comPerdidas, resultadoDistrato,
      ganhoRevBruto:l.ganhoRev, ganhoSuspeito, custoRev, custoMotivo: cst?cst.motivo:'', ganhoRevLiq,
      total: resultadoDistrato + ganhoRevLiq,
      precoAnterior: precoAnteriorDer, precoAtual: l.valorVenda, ganhoDerivado: ganhoDerivadoCalc,
      statusAtual:l.status, valorAtual:l.valorVenda };
  }).sort((a,b)=>b.total-a.total);

  // INCC acumulado calculado pela simulação mês a mês do saldo devedor
  let sdMap = {};
  try { const sd = saldoDevedorCasas(); if (sd) sd.linhas.forEach(x=>sdMap[x.casa] = x.inccDevido||0); } catch(e) {}
  linhas.forEach(l=>{ l.inccCalc = sdMap[l.casa] || 0; });
  const T = f => linhas.reduce((s,l)=>s+(l[f]||0), 0);
  const TD = f => distratos.reduce((s,d)=>s+(d[f]||0), 0);
  return { linhas, distratos, nCasas,
    tot: { valorVenda:T('valorVenda'), venda:T('venda'), distratada:T('distratada'), incc:T('incc'),
           person:T('person'), outros:T('outros'), totalRecebido:T('totalRecebido'), inccCalc:T('inccCalc'),
           devolvido:T('devolvido'), liquido:T('liquido'), saldoContrato:T('saldoContrato') },
    totD: { receb:TD('recebidoDistratado'), devol:TD('devolvido'), retido:TD('retido'),
            comPerdidas:TD('comPerdidas'), resultadoDistrato:TD('resultadoDistrato'),
            ganhoRevBruto:TD('ganhoRevBruto'), custoRev:TD('custoRev'), ganhoRevLiq:TD('ganhoRevLiq'),
            total:TD('total'), n:distratos.reduce((s,d)=>s+d.nDist,0) } };
}

// Memória de cálculo por casa: mostra como cada número foi montado, com os
// lançamentos que o compõem. É o mesmo padrão de drill das outras abas.
window.evMemoria = function(casa, qual){
  const D = extratoVendasDados(); if (!D) return;
  const l = D.linhas.find(x=>x.casa===casa); if (!l) return;
  const ex = window._extrato || { receitas:[], despesas:[] };
  const conc = r => !r.situacao || /CONCILIADO/i.test(r.situacao);
  const recCasa = ex.receitas.filter(r=>extrairCasa(r.desc)===casa && conc(r));
  const despCasa = ex.despesas.filter(r=>extrairCasa(r.descOriginal||r.descricao)===casa && conc(r)
                    && /DISTRAT|DEVOL/i.test((r.descOriginal||'')+(r.categoria||'')));
  let itens = [], titulo = '', nota = '';
  if (qual === 'venda') {
    itens = recCasa.filter(r=>r.tipo==='Venda');
    titulo = 'CS ' + casa + ' · recebimento de venda';
    nota = 'Soma dos créditos do contrato vigente, conciliados com o banco. Valor de venda ' + fmt(l.valorVenda) + ' · recebido ' + fmt(l.venda) + ' · faltam ' + fmt(l.saldoContrato) + '.';
  } else if (qual === 'distratada') {
    itens = recCasa.filter(r=>r.tipo==='VendaDistratada');
    titulo = 'CS ' + casa + ' · recebido de compradores distratados';
    nota = 'Créditos de contratos que foram encerrados. Devolvido depois: ' + fmt(l.devolvido) + '.';
  } else if (qual === 'incc') {
    itens = recCasa.filter(r=>r.tipo==='INCC');
    titulo = 'CS ' + casa + ' · INCC';
    nota = 'Correção JÁ COBRADA do cliente: ' + fmt(l.incc) + '. A coluna INCC calculado (' + fmt(l.inccCalc) + ') é a correção ACUMULADA sobre o saldo devedor pela série mensal do INCC-DI desde a data da venda, esteja ela cobrada ou não.';
  } else if (qual === 'liquido') {
    itens = recCasa.concat(despCasa.map(d=>({ dataComp:d.data, cliente:d.fornecedor, desc:d.descOriginal, valReceb:-d.valor, tipo:'Devolução' })));
    titulo = 'CS ' + casa + ' · caixa líquido da unidade';
    nota = 'Tudo que entrou (' + fmt(l.totalRecebido) + ') menos o que voltou ao comprador distratado (' + fmt(l.devolvido) + ') = ' + fmt(l.liquido) + '.';
  } else if (qual === 'saldo') {
    itens = recCasa.filter(r=>r.tipo==='Venda');
    titulo = 'CS ' + casa + ' · saldo de contrato';
    nota = 'Valor de venda ' + fmt(l.valorVenda) + ' menos o principal recebido ' + fmt(l.venda) + ' = ' + fmt(l.saldoContrato) + '. Não inclui a correção do INCC, que aparece na coluna ao lado.';
  }
  const linhasDrill = itens.map(r=>({ data:r.dataComp, valor:r.valReceb, categoria:r.tipo||'—',
    descricao:r.desc, fornecedor:r.cliente, obs:'' }));
  window._evNota = nota;
  openDrillLista(titulo, linhasDrill, '#6C8FB5');
  // acrescenta a explicação no topo da janela
  setTimeout(()=>{ const c=document.getElementById('drill-rows');
    if (c && nota) { const d=document.createElement('div');
      d.style.cssText='background:var(--surface-3);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:11.5px;line-height:1.5;color:var(--text)';
      d.innerHTML='<strong>Como este número é montado.</strong> '+nota;
      c.parentNode.insertBefore(d, c); } }, 30);
};

function renderExtratoVendas(){
  const el = document.getElementById('tab20'); if (!el) return;
  const D = extratoVendasDados();
  if (!D) { el.innerHTML = '<div class="info-box" style="border:1px solid #C4A55C66"><span>ℹ</span><div>Esta aba lê exclusivamente a aba <strong>EXTRATO GERAL</strong> da planilha, que ainda não foi encontrada neste empreendimento. Assim que ela existir, a tabela é montada sozinha.</div></div>'; return; }
  const k=(l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c}">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
  const dt = d => d ? d.toLocaleDateString('pt-BR') : '—';
  const vendidas = D.linhas.filter(l=>!l.disponivel);

  el.innerHTML = `
    <div class="info-box" style="border:1px solid #6C8FB540;margin-bottom:12px"><span>🧾</span><div><strong>A venda de cada casa pelo dinheiro que entrou.</strong>
    Fonte exclusiva: aba <strong>EXTRATO GERAL</strong>, apenas lançamentos conciliados com o banco. A base de parcelas mostra o que o contrato previa e traz a quitação contábil dos distratos como se fosse recebimento; aqui só entra o que passou pela conta. Valor de venda, data e status vêm da apuração curada, que o extrato não tem.</div></div>

    <div class="kpi-grid">
      ${k('VGV das '+D.nCasas+' casas', fmt(D.tot.valorVenda), vendidas.length+' vendidas · '+(D.nCasas-vendidas.length)+' em estoque', '#6C8FB5')}
      ${k('Recebido de venda', fmt(D.tot.venda), (D.tot.valorVenda>0? (D.tot.venda/D.tot.valorVenda*100).toFixed(1):'0')+'% do VGV · dinheiro em conta', '#6D9E7F')}
      ${k('Saldo de contrato', fmt(D.tot.saldoContrato), 'a receber das casas vendidas', '#C09257')}

      Uma carteira de ${D.C.ativos.length} contratos ativos não tem como ter quase nada a receber: o que falta na planilha são <strong>as parcelas a vencer e as vencidas em aberto</strong>. Sem elas, esta aba não consegue montar a régua de cobrança.<br><br>
      <strong>O que pedir ao sistema:</strong> exportar as receitas <em>sem filtrar por situação</em> — incluindo as parcelas <em>Em aberto</em>, <em>A vencer</em> e <em>Vencidas</em>. Assim que vierem, esta aba passa a funcionar sozinha, sem nenhuma mudança.</div></div>` : ''}

    <div class="info-box" style="border:1px solid #6C8FB540;margin-bottom:12px"><span>📮</span><div><strong>Inadimplência de ${CFG.nome}.</strong>
    Considera apenas <strong>contratos ativos</strong>: ${D.C.ativos.length} de ${D.C.todos.length}. Os ${D.C.encerrados.length} contratos distratados ficam de fora — o saldo de um contrato encerrado não é cobrável de ninguém, e somá-lo criaria um valor a receber que nunca entra.</div></div>

// ═══ Projeção de recebíveis, refeita sobre o caixa real ═══
// Antes, "recebido" vinha da base de parcelas e trazia junto a quitação contábil dos
// distratos — o recebido aparecia maior e, por consequência, o A RECEBER aparecia
// menor do que realmente é. Com o extrato, o recebido é dinheiro; o contratado e o
// cronograma continuam vindo da base comercial. A diferença entre os dois é a
// projeção honesta do que ainda entra.
function projecaoRecebiveis(){
  const C = contratosComerciais();
  const ex = window._extrato;
  // Contratado considera SÓ contratos ativos. Somar contratos distratados criaria um
  // "a receber" que nunca entra — o saldo de um contrato encerrado não é cobrável.
  const contratado   = C.ativos.reduce((s,c)=>s+c.orig,0);
  const contratoTodos= C.todos.reduce((s,c)=>s+c.orig,0);
  const recebidoBase = C.ativos.reduce((s,c)=>s+c.receb,0);
  const aReceber     = C.ativos.reduce((s,c)=>s+c.saldo,0);
  const saldoEncerrados = C.encerrados.reduce((s,c)=>s+c.saldo,0);
  // caixa de venda efetivamente entrado, quando o extrato está disponível
  const soVenda = r => r.grupo === 'venda' || /Venda|INCC/i.test(r.tipo||'');
  const recebidoCaixa = ex ? ex.receitas.filter(soVenda).reduce((s,r)=>s+(r.valReceb||0),0) : recebidoBase;
  // vencido em aberto
  const hoje = new Date();
  let vencidoAberto = 0, nVencidas = 0;
  C.ativos.forEach(c=>c.parcelas.forEach(p=>{
    const falta=(p.valOrig||0)-(p.valReceb||0); if(falta<=1) return;
    const dv=parseDate(p.dataVenc); if(dv && dv<=hoje){ vencidoAberto+=falta; nVencidas++; }
  }));
  // ritmo de entrada, para estimar prazo
  const porMes = {};
  (ex? ex.receitas : []).filter(soVenda).forEach(r=>{ const d=parseDate(r.dataComp||r.data); if(!d) return;
    porMes[d.getFullYear()*100+(d.getMonth()+1)] = (porMes[d.getFullYear()*100+(d.getMonth()+1)]||0)+(r.valReceb||0); });
  const meses = Object.keys(porMes).map(Number).sort((a,b)=>a-b);
  const ymH = hoje.getFullYear()*100+(hoje.getMonth()+1);
  const u6 = meses.filter(m=>m<ymH).slice(-6);
  const ritmo = u6.length ? u6.reduce((s,m)=>s+porMes[m],0)/u6.length : 0;
  return { contratado, contratoTodos, recebidoBase, recebidoCaixa, aReceber, saldoEncerrados,
           vencidoAberto, nVencidas, ritmo,
           mesesParaZerar: ritmo>0 ? aReceber/ritmo : null,
           pctRecebido: contratado>0 ? recebidoBase/contratado*100 : 0,
           nEstoque: C.nEstoque, estoqueVGV: C.estoqueVGV, ticketMedio: C.ticketMedio,
           casasEstoque: C.curado ? C.curado.casasDisponiveis : [], fonteEstoque: C.curado ? 'apuração curada' : 'inferido das parcelas',
           nAtivos: C.ativos.length, nEncerrados: C.encerrados.length,
           aRealizar: aReceber + C.estoqueVGV };
}
window.projecaoRecebiveis = projecaoRecebiveis;

// Parser CSV (RFC 4180): aspas, vírgulas e quebras de linha dentro de campos
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Extrai valor de uma célula do JSON do Google Sheets
function cellVal(cell) {
  if(!cell || cell.v === null || cell.v === undefined) return "";
  // Datas formatadas no campo .f como DD/MM/AAAA
  if(cell.f && /^\d{2}\/\d{2}\/\d{4}$/.test(cell.f)) return cell.f;
  // Datas em formato Date(ano,mes,dia)
  if(cell.t === "d" || (typeof cell.v === "string" && cell.v.startsWith("Date("))) {
    const m = String(cell.v).match(/Date\((\d+),(\d+),(\d+)\)/);
    if(m) {
      const ano=m[1], mes=String(parseInt(m[2])+1).padStart(2,"0"), dia=String(m[3]).padStart(2,"0");
      return `${dia}/${mes}/${ano}`;
    }
  }
  // Número puro (tipo n ou typeof number)
  if(cell.t === "n" || typeof cell.v === "number") return cell.v;
  // String com valor numérico pt-BR ex: "110.000,00" → retorna como string para parseVal tratar
  return String(cell.f || cell.v || "").trim();
}

// Converte resposta JSON em array de arrays (linhas x colunas)
function parseSheet(json) {
  if (json?.csv) return json.csv;               // caminho novo (CSV, sem tipagem)
  if (!json?.table?.rows) return [];
  return json.table.rows.map(row =>
    (row.c || []).map(cell => cellVal(cell))
  );
}

// ── CÁLCULO CDI JUROS COMPOSTOS ────────────────────────────────
function calcCDI(aportes, retiradas) {
  const events = [
    ...aportes.map(r=>({...r,tipo:"aporte",dt:parseDate(r.data)})),
    ...retiradas.map(r=>({...r,tipo:"retirada",dt:parseDate(r.data)}))
  ].sort((a,b)=>a.dt-b.dt);

  const firstDt = events[0].dt;
  const months = [];
  let cy=firstDt.getFullYear(), cm=firstDt.getMonth()+1;
  while(true) {
    const key=`${cy}-${String(cm).padStart(2,"0")}`;
    months.push(key);
    if(key===CDI_MES_ATUAL) break;
    cm++; if(cm>12){cm=1;cy++;}
  }

  let capitalPuro=0, baseCorrigida=0;
  const rows=[];
  const evCopy = events.map(e=>({...e}));

  for(const key of months) {
    const [y,m]=key.split("-").map(Number);
    const endOfMonth=new Date(y,m,0);
    evCopy.forEach(e=>{
      if(e._ok) return;
      if(e.dt<=endOfMonth){
        const d=e.tipo==="aporte"?e.valor:-e.valor;
        capitalPuro+=d; baseCorrigida+=d; e._ok=true;
      }
    });
    const cdiMes=((CDI_MENSAL[key]||0)*CDI_FATOR_LIQUIDO)/100; // CDI líquido após IOF/IR
    const jurosDoMes=baseCorrigida>0?baseCorrigida*cdiMes:0;
    baseCorrigida+=jurosDoMes;
    rows.push({
      key, label:`${MESES[m-1]}/${y}`,
      capitalExposto:capitalPuro, baseCorrigida,
      cdiMes:CDI_MENSAL[key]||0, custoMes:jurosDoMes,
      custoCDI_acum:baseCorrigida-capitalPuro,
    });
  }
  return rows;
}

function renderDashboard() {

  const totalAp  = APORTES.reduce((s,r)=>s+r.valor,0);
  const totalRet = RETIRADAS.reduce((s,r)=>s+r.valor,0);
  const exposto  = totalAp-totalRet;
  const pct      = totalAp>0?(totalRet/totalAp)*100:0;

  const apBySocio={}, retBySocio={};
  APORTES.forEach(r=>apBySocio[r.socio]=(apBySocio[r.socio]||0)+r.valor);
  RETIRADAS.forEach(r=>retBySocio[r.socio]=(retBySocio[r.socio]||0)+r.valor);
  const apSocioList=Object.entries(apBySocio).sort((a,b)=>b[1]-a[1]);
  const retSocioList=Object.entries(retBySocio).sort((a,b)=>b[1]-a[1]);

  // trimestral
  const trimMap={};
  APORTES.forEach(r=>{
    const d=parseDate(r.data);
    const q=`${d.getFullYear()} T${Math.ceil((d.getMonth()+1)/3)}`;
    if(!trimMap[q]){trimMap[q]={periodo:q};apSocioList.forEach(([s])=>trimMap[q][s]=0);}
    trimMap[q][r.socio]=(trimMap[q][r.socio]||0)+r.valor;
  });
  const trimestral=Object.values(trimMap).sort((a,b)=>a.periodo.localeCompare(b.periodo));

  // fluxo
  const allEv=[...APORTES.map(r=>({...r,tipo:"aporte"})),...RETIRADAS.map(r=>({...r,tipo:"retirada"}))].sort((a,b)=>parseDate(a.data)-parseDate(b.data));
  let acum=0; const fluxoMap=new Map();
  allEv.forEach(e=>{acum+=e.tipo==="aporte"?e.valor:-e.valor;fluxoMap.set(e.data,acum);});
  const fluxo=[...fluxoMap.entries()];

  const allD=[...APORTES,...RETIRADAS].map(r=>parseDate(r.data)).filter(Boolean).sort((a,b)=>a-b);
  const range=allD.length?`${MESES[allD[0].getMonth()]}/${allD[0].getFullYear()} → ${MESES[allD[allD.length-1].getMonth()]}/${allD[allD.length-1].getFullYear()}`:"—";

  const cdiRows=calcCDI(APORTES,RETIRADAS);
  const custoCDI_total=cdiRows[cdiRows.length-1]?.custoCDI_acum||0;

  // ── INDICADORES ESTRATÉGICOS ─────────────────────────────────
  // Exposição máxima de capital e quando ocorreu
  let maxExp=0, maxExpData="—";
  fluxo.forEach(([d,v])=>{ if(v>maxExp){ maxExp=v; maxExpData=d; } });
  // Payback: data em que retiradas acumuladas cruzam aportes acumulados
  let paybackData=null;
  { let ca=0, cr=0;
    for(const e of allEv){
      if(e.tipo==="aporte") ca+=e.valor; else cr+=e.valor;
      if(ca>0 && cr>=ca){ paybackData=e.data; break; }
    } }
  // TIR (XIRR): aportes = saída de caixa do sócio; retiradas = entrada.
  // Se ainda há capital exposto, assume retorno pelo valor de face hoje (valor residual).
  const _cfs=[...APORTES.map(r=>({dt:parseDate(r.data),v:-r.valor})),
              ...RETIRADAS.map(r=>({dt:parseDate(r.data),v:r.valor}))];
  if(exposto>0) _cfs.push({dt:new Date(), v:exposto});
  const tirV=xirr(_cfs);
  const tirPct=tirV!==null?tirV*100:null;
  const cdiAnualLiq=14.25*CDI_FATOR_LIQUIDO; // referência: CDI líquido a.a.
  // Burn rate: média mensal de despesas dos últimos meses FECHADOS (exclui mês corrente parcial)
  const despMes={};
  _DESPESAS.forEach(r=>{ const d=parseDate(r.data); if(!d) return;
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    despMes[k]=(despMes[k]||0)+r.valor; });
  const _mkeys=Object.keys(despMes).sort();
  const _burnBase=_mkeys.length>1?_mkeys.slice(-7,-1):_mkeys;
  const burn=_burnBase.length?_burnBase.reduce((s,k)=>s+despMes[k],0)/_burnBase.length:0;
  // Sparkline do capital exposto (downsample para ~60 pontos)
  const _fxVals=fluxo.map(([,v])=>v);
  const _fxStep=Math.max(1,Math.ceil(_fxVals.length/60));
  const fxSpark=_fxVals.filter((_,i)=>i%_fxStep===0);
