// MÓDULO SOCIEDADE / PERMUTA — regras societárias por empreendimento
// ════════════════════════════════════════════════════════════════
function _casaQuit(quitadasOverride) {
  // Por casa: contratado, recebido, INCC — quitação detectada por CONTRATO
  // (casa+cliente), usando o contrato mais recente; casas com distrato+revenda
  // não contaminam a régua. Se houver lista de controle (override), ela manda.
  const m = {}, contratos = {};
  _RECEITAS.forEach(r => {
    if (!r.casa) return;
    const c = (m[r.casa] = m[r.casa] || { casa:r.casa, contratado:0, recebVenda:0, recebIncc:0, ultReceb:null });
    if (r.tipo === 'Venda' || r.tipo === 'VendaDistratada') {
      c.contratado += r.valOrig; c.recebVenda += r.valReceb;
      const k = r.casa + '|' + _audNorm(r.cliente);
      const ct = (contratos[k] = contratos[k] || { casa:r.casa, orig:0, rec:0, ini:null });
      ct.orig += r.valOrig; ct.rec += r.valReceb;
      const d = parseDate(r.dataComp);
      if (d && (!ct.ini || d < ct.ini)) ct.ini = d;
    }
    if (r.tipo === 'INCC') c.recebIncc += r.valReceb;
    if (r.valReceb > 0 && r.dataComp) {
      const d = parseDate(r.dataComp);
      if (d && (!c.ultReceb || d > c.ultReceb)) c.ultReceb = d;
    }
  });
  // contrato ativo = o de início mais recente de cada casa
  const ativo = {};
  Object.values(contratos).forEach(ct => {
    if (!ativo[ct.casa] || (ct.ini && ativo[ct.casa].ini && ct.ini > ativo[ct.casa].ini)) ativo[ct.casa] = ct;
  });
  Object.values(m).forEach(c => {
    const a = ativo[c.casa];
    c.quitadaDetect = !!(a && a.orig > 100000 && a.rec >= a.orig * 0.97);
    c.quitada = quitadasOverride ? quitadasOverride.includes(c.casa) : c.quitadaDetect;
  });
  if (quitadasOverride) quitadasOverride.forEach(n => {
    if (!m[n]) m[n] = { casa:n, contratado:0, recebVenda:0, recebIncc:0, quitada:true, quitadaDetect:false };
  });
  return m;
}

function renderSociedade() {
  const el = document.getElementById('tab11'); if (!el) return;
  const P = CFG.permuta;
  let html = '';

  // ── BLOCO PERMUTA (Bossa: Harmony · Liberty: Adalberto/Luiz/Eduardo) ──
  if (P) {
    const casas = _casaQuit(P.quitadas);
    const lista = P.casas ? P.casas.map(n => casas[n] || {casa:n, contratado:0, recebVenda:0, recebIncc:0, quitada:false, quitadaDetect:false})
                          : Object.values(casas).sort((a,b)=>a.casa-b.casa);
    // Devido por casa conforme a mecânica de cada contrato de permuta:
    const devidoCasa = c => {
      if (P.modo === 'bossa') {
        // progressivo: (recebido+INCC) − 6% do valor de venda − 7% do recebido
        const rec = c.recebVenda + c.recebIncc;
        return Math.max(0, rec * (1 - P.impostoPctReceb) - c.contratado * P.comissaoPctVenda);
      }
      if (P.modo === 'jazz') // 14,661% do valor de VENDA, na quitação/recebimento
        return c.quitada ? c.contratado * P.pct : 0;
      // liberty: 22% × 88% do valor de VENDA contratado, na quitação
      return c.quitada ? c.contratado * P.pct * (1 - P.deducao) : 0;
    };
    let devido = 0, inccRetido = 0;
    lista.forEach(c => { devido += devidoCasa(c); if (!P.incc) inccRetido += c.recebIncc; });
    const divergentes = lista.filter(c => c.quitada !== c.quitadaDetect && (c.quitada || c.quitadaDetect));
    const taxaLiq = P.deducao !== undefined ? P.pct * (1 - P.deducao) : P.pct;
    const pagos = _DESPESAS.filter(r => {
      const cU = _audNorm(r.categoria), fU = _audNorm(r.fornecedor);
      return cU.includes('PERMUTA') || P.payees.some(p => fU.includes(_audNorm(p)));
    });
    const pago = pagos.reduce((s,r)=>s+r.valor,0);
    const saldo = devido - pago;
    const nQuit = lista.filter(c=>c.quitada).length;
    const kpiS = (l,v,s,c,h)=>`<div class="kpi" style="border-top:2px solid ${c}"><div class="kpi-label">${l}${h?hintIcon(h):''}</div><div class="kpi-value" style="color:${c}">${v}</div>${s?`<div class="kpi-sub">${s}</div>`:''}</div>`;
    html += `
      <div class="section-title">${P.titulo}</div>
      <div class="info-box" style="border:1px solid ${CFG.cor}40;margin-bottom:14px"><span style="color:${CFG.cor};font-size:16px">📜</span><div><strong>Regra contratual:</strong> ${P.regra}</div></div>
      <div class="kpi-grid">
        ${kpiS(P.modo==='bossa'?'Devido (progressivo)':'Devido (casas quitadas)', fmt(devido),
          P.modo==='bossa' ? nQuit+' quitadas (controle) · fórmula: 93% do recebido − 6% da venda'
                           : nQuit+' casa(s) quitada(s) · '+(taxaLiq*100).toFixed(2)+'% do valor de venda', '#6C8FB5',
          P.modo==='bossa' ? 'Mecânica do controle Formes: para cada casa permutada, (recebido + INCC) × 93% (desconta 7% de impostos sobre o recebido) menos 6% do valor de venda (comissão + marketing + coordenação). Acumula progressivamente conforme os recebimentos.'
          : P.modo==='jazz' ? '14,661% do valor de VENDA contratado de cada casa 01–10, devido quando a casa quita/recebe.'
          : 'Por casa QUITADA: 22% × 88% do valor de VENDA contratado (5% comissão + 7% impostos deduzidos). Sem INCC.')}
        ${kpiS('Pago ao permutante', fmt(pago), pagos.length+' pagamento(s)', '#C4A55C',
          'Soma das despesas com categoria Permuta ou favorecido correspondente ao(s) permutante(s).')}
        ${kpiS('Saldo', fmt(Math.abs(saldo)), saldo>=0?'A pagar ao permutante':'⚠ PAGO ALÉM DO DEVIDO (antecipação)', saldo>=0?'#6D9E7F':'#BF6B60',
          'Devido acumulado (só casas quitadas) menos pago acumulado. Saldo negativo = pagamentos feitos antes da quitação das casas — a regra contratual prevê pagamento só após quitação.')}
        ${!P.incc ? kpiS('INCC retido p/ construtores', fmt(inccRetido*P.pct)+' <span style="font-size:11px">bruto</span>',
          'Líquido de deduções: '+fmt(inccRetido*taxaLiq)+' · INCC recebido: '+fmt(inccRetido), '#8E7FA8',
          'Como a permuta é financeira SEM correção, os '+(P.pct*100).toFixed(0)+'% do INCC recebido que caberiam ao permutante ficam com os construtores. Mostrado bruto (22% × INCC) e líquido das mesmas deduções.') : ''}
      </div>
      ${typeof divergentes!=='undefined' && divergentes.length && P.quitadas ? `<div class="info-box" style="border:1px solid #C4A55C40;margin:12px 0"><span style="color:#C4A55C;font-size:16px">⚠</span><div><strong>Divergência controle × planilha:</strong> ${divergentes.map(c=>'CS '+String(c.casa).padStart(2,'0')).join(', ')} — o status de quitação do controle difere do que a planilha de receitas permite detectar (parcelas futuras não lançadas ou sem o nº da casa no descritivo). O painel segue o controle; padronizar os descritivos elimina a divergência.</div></div>`:''}
      <div class="section-title" style="margin-top:16px">Casa a Casa${P.casas?' ('+P.casas.length+' casas permutadas)':''}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Casa</th><th style="text-align:right">Contratado</th><th style="text-align:right">Recebido</th>${P.incc?'<th style="text-align:right">+INCC</th>':''}<th>Situação</th><th style="text-align:right">Devido</th></tr></thead>
        <tbody>${lista.map(c=>{
          const dev=devidoCasa(c);
          const pct=c.contratado>0?(c.recebVenda/c.contratado*100):0;
          return `<tr><td style="font-weight:700">CS ${String(c.casa).padStart(2,'0')}</td>
            <td style="text-align:right">${fmt(c.contratado)}</td>
            <td style="text-align:right">${fmt(c.recebVenda)}</td>
            ${P.incc?`<td style="text-align:right;color:#8E7FA8">${fmt(c.recebIncc)}</td>`:''}
            <td>${c.quitada?statusDot('#6D9E7F')+'Quitada':statusDot('#C4A55C')+pct.toFixed(0)+'%'}</td>
            <td style="text-align:right;font-weight:700;color:${dev>0?'#6C8FB5':'#A1A1A6'}">${dev>0?fmt(dev):'—'}</td></tr>`;}).join('')}
        </tbody></table></div>`;
    // pagamentos listados
    html += `<div class="section-title" style="margin-top:16px">Pagamentos Realizados</div>
      ${pagos.sort((a,b)=>parseDate(a.data)-parseDate(b.data)).map(r=>`<div class="aud-item">
        <div style="flex:1;min-width:0"><div class="aud-item-t">${r.fornecedor}</div><div class="aud-item-s">${r.data} · ${r.descricao}</div></div>
        <div class="aud-item-v" style="color:#C4A55C">${fmt(r.valor)}</div></div>`).join('')||'<div class="info-box">Nenhum pagamento registrado.</div>'}`;
  }

  // ── BLOCO IDPAX (Liberty): Hipótese A × Hipótese B ──
  if (CFG.idpax) {
    const X = CFG.idpax;
    const recTotal = _RECEITAS.reduce((s,r)=>s+r.valReceb,0) + _RENDIMENTOS.reduce((s,r)=>s+r.valor,0);
    const despTotal = _DESPESAS.reduce((s,r)=>s+r.valor,0);
    const custosObra = _DESPESAS.filter(r=>{
      const c=_audNorm(r.categoria);
      return !(c.includes('COMISS')||c.includes('IMPOST')||c.includes('DISTRAT')||c.includes('PERMUTA')||c.includes('MARKETING')||c.includes('ESCRIT')||c.includes('SALARIO')||c.includes('HONORAR')||c.includes('TAXAS')||c.includes('TARIF'));
    }).reduce((s,r)=>s+r.valor,0);
    const lucro = recTotal - despTotal;
    const fee = X.txAdmObra * X.parteInvestidor * custosObra + X.txIncorp * X.parteInvestidor * recTotal;
    const lucroIdpax = lucro * X.pctLucroIdpax;
    const A = { italo: lucroIdpax/2 + fee, dpp: lucroIdpax/2 - fee, am: lucro*0.5 };
    const B = { italo: lucroIdpax*0.75,   dpp: lucroIdpax*0.25,   am: lucro*0.5 };
    const linha = (nome,a,b,cor)=>`<tr><td style="font-weight:700;color:${cor}">${nome}</td>
      <td style="text-align:right;font-weight:700">${fmt(a)}</td>
      <td style="text-align:right;font-weight:700">${fmt(b)}</td>
      <td style="text-align:right;color:${b-a>=0?'#6D9E7F':'#BF6B60'}">${(b-a>=0?'+':'')+fmt(b-a).replace('R$','')}</td></tr>`;
    html += `
      <div class="section-title" style="margin-top:22px">IDPAX — Hipótese A (taxas) × Hipótese B (75% do lucro)</div>
      <div class="info-box" style="border:1px solid #6C8FB540;margin-bottom:14px"><span style="color:#6C8FB5;font-size:16px">⚖️</span>
        <div><strong>Hipótese A:</strong> lucro IDPAX dividido 50/50; Daniel de Paula paga a Ítalo 15% de taxa de administração sobre sua parte dos custos de obra (25%) + 3% de incorporação sobre sua parte da receita (25%). <strong>Hipótese B:</strong> Ítalo fica com 75% do lucro IDPAX e não há taxas. As duas são alternativas — nunca acumulam.</div></div>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi" style="border-top:2px solid #6D9E7F"><div class="kpi-label">Receita realizada${hintIcon('Total recebido: vendas + INCC + outras receitas + rendimentos de aplicações.')}</div><div class="kpi-value" style="color:#6D9E7F">${fmt(recTotal)}</div></div>
        <div class="kpi" style="border-top:2px solid #BF6B60"><div class="kpi-label">Despesa realizada</div><div class="kpi-value" style="color:#BF6B60">${fmt(despTotal)}</div><div class="kpi-sub">Custos de obra: ${fmt(custosObra)}</div></div>
        <div class="kpi" style="border-top:2px solid #6C8FB5"><div class="kpi-label">Lucro realizado (caixa)${hintIcon('Receitas menos despesas REALIZADAS até hoje — não inclui contas a receber nem custos futuros. Use como base comparativa entre as hipóteses, não como lucro final do empreendimento.')}</div><div class="kpi-value" style="color:${lucro>=0?'#6C8FB5':'#BF6B60'}">${fmt(lucro)}</div></div>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table>
        <thead><tr><th>Sócio</th><th style="text-align:right">Hipótese A</th><th style="text-align:right">Hipótese B</th><th style="text-align:right">B − A</th></tr></thead>
        <tbody>
          ${linha('Ítalo (operador)', A.italo, B.italo, '#6C8FB5')}
          ${linha('Daniel de Paula (investidor)', A.dpp, B.dpp, '#C4A55C')}
          ${linha('Alves Mendes', A.am, B.am, '#6D9E7F')}
          <tr><td style="color:#A1A1A6">Taxas na Hipótese A</td><td style="text-align:right;color:#A1A1A6">${fmt(fee)}</td><td style="text-align:right;color:#A1A1A6">—</td><td></td></tr>
        </tbody></table></div>
      <div style="font-size:11px;color:#A1A1A6;margin-top:10px;line-height:1.6;font-family:'DM Mono',monospace">Os números se recalculam a cada atualização — quando o empreendimento encerrar, esta tabela mostra o resultado final de cada hipótese. Ponto de equilíbrio: a Hipótese B supera a A para Ítalo quando 25% do lucro IDPAX exceder as taxas (${fmt(fee)} hoje).</div>`;
  }

  // ── JAZZ (sem permuta/idpax): visão societária simples ──
  if (!P && !CFG.idpax) {
    const apS={}, rtS={};
    _APORTES.forEach(r=>apS[r.socio]=(apS[r.socio]||0)+r.valor);
    _RETIRADAS.forEach(r=>rtS[r.socio]=(rtS[r.socio]||0)+r.valor);
    html += `<div class="section-title">Sociedade — 50% Formes · 50% Alves Mendes</div>
      <div class="socio-grid">${[...new Set([...Object.keys(apS),...Object.keys(rtS)])].map(s=>`
        <div class="socio-card" style="border-left:3px solid ${CFG.cor}">
          <div class="socio-row"><span class="socio-name">${s}</span><span class="socio-val">${fmt((apS[s]||0)-(rtS[s]||0))} exposto</span></div>
          <div class="socio-pct">aportou ${fmt(apS[s]||0)} · retirou ${fmt(rtS[s]||0)}</div>
        </div>`).join('')}</div>`;
  }

  // ── RENDIMENTOS DE APLICAÇÕES (todas as obras) ──


  el.innerHTML = html || '<div class="info-box">Sem regras societárias configuradas para este empreendimento.</div>';
}

        </select>
        <select onchange="fornSetInnerOrd(this.value)" style="flex:1;min-width:150px;background:#161b22;border:1px solid #21262d;border-radius:8px;color:#e6edf3;font-size:12px;padding:8px 10px;outline:none;font-family:'DM Mono',monospace">

// ── Entrada com senha ─────────────────────────────────────────
function checkPwd() {
  const input = document.getElementById("pwdInput").value;
  if(input === SENHA) {
    // Verifica se biometria já foi cadastrada neste dispositivo
    if(localStorage.getItem(BIO_KEY) === "1") {
      unlockDashboard();
    } else if(window.PublicKeyCredential) {
      // Dispositivo suporta WebAuthn — oferece ativar biometria
      showBioModal();
    } else {
      unlockDashboard();
    }
  } else {
    const err = document.getElementById("pwdError");
    err.textContent = "Senha incorreta";
    document.getElementById("pwdInput").value = "";
    document.getElementById("pwdInput").focus();
    setTimeout(() => err.textContent = "", 2500);
  }
}

// ── Abre o dashboard ──────────────────────────────────────────
function unlockDashboard() {
  document.getElementById("passwordScreen").style.display = "none";
  document.getElementById("bioModal").style.display = "none";
  document.getElementById("loadingScreen").style.display = "flex";
  loadData();
}

// ── Apply config + auto-login logic ─────────────────────────
(function applyConfig() {
  // Set titles
  const pdwTitle = document.getElementById("pwd-title");
  const pwdSub   = document.getElementById("pwd-sub");
  const dashTitle = document.getElementById("dash-title");
  if(pdwTitle) pdwTitle.textContent = CFG.nome;
  if(pwdSub)   { pwdSub.textContent = "— " + CFG.subtitulo; pwdSub.style.color = CFG.cor; }
  if(dashTitle) dashTitle.innerHTML = CFG.nome + ` <span style="color:${CFG.cor}">— ${CFG.subtitulo}</span>`;
  const loginBtn = document.querySelector('#passwordScreen button[onclick="checkPwd()"]');
  if(loginBtn) loginBtn.style.background = CFG.cor;

  // 1. Auto-login via token from Ítalo Gestão
  const params = new URLSearchParams(location.search);
  if(params.get('token') === 'italogestao2026') {
    unlockDashboard();
    return;
  }

  // 2. Auto-offer biometry if already registered on this device
  if(localStorage.getItem(BIO_KEY) === '1' && window.PublicKeyCredential) {
    // Show biometry prompt automatically
    setTimeout(() => attemptBioLogin(), 300);
    return;
  }

  // 3. Focus password input
  setTimeout(() => document.getElementById("pwdInput")?.focus(), 100);
})();

async function attemptBioLogin() {
  try {
    const credIdB64 = localStorage.getItem(BIO_CRED_ID);
    if(!credIdB64) { return; }
    const credId = Uint8Array.from(atob(credIdB64), c=>c.charCodeAt(0));
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: RP_ID,
        allowCredentials: [{ type:'public-key', id: credId }],
        userVerification: 'preferred',
        timeout: 30000,
      }
    });
    if(assertion) unlockDashboard();
  } catch(e) {
    // Biometry failed or cancelled — show password screen normally
    console.log('Bio login failed:', e.message);
  }
}

function rfEmpKey(){ return new URLSearchParams(location.search).get('emp') || 'liberty'; }
// A chave dos parâmetros é o EMPREENDIMENTO, não o sheetId: trocar a planilha
// (como na migração do Jazz para a nativa) não pode apagar VGV, comissão e imposto.
function rfKey(k) { return 'rf_'+rfEmpKey()+'_'+k; }
// Planilhas já usadas por cada obra — para resgatar parâmetros salvos sob a chave antiga
const SHEETS_LEGADOS = { jazz: ['10ImatGNjspUtjVxgpTRl-p9jA42FvhwG'] };
function rfMigrarParametros() {
  try {
    const emp = rfEmpKey();
    const chaves = ['vgvTotal','vgvRealizado','pctComissao','pctImposto','pctPermuta','incc','pctObraExec'];
    const origens = [CFG.sheetId].concat(SHEETS_LEGADOS[emp]||[]);
    let migrados = 0;
    chaves.forEach(k=>{
      const destino = 'rf_'+emp+'_'+k;
      if (localStorage.getItem(destino) !== null) return;      // já tem valor: não sobrescreve
      for (const sid of origens) {
        const v = localStorage.getItem('rf_'+sid+'_'+k);
        if (v !== null && v !== '') { localStorage.setItem(destino, v); migrados++; break; }
      }
    });
    if (migrados) console.log('Parâmetros do Resultado Final resgatados da chave antiga:', migrados);
  } catch(e) { console.warn('migração de parâmetros:', e); }
}
function areaTotalCfg(c) { return (c&&c.areaTotal) || ((c&&c.nCasas||0)*(c&&c.areaCasa||0)); }
// % de obra de QUALQUER empreendimento: parâmetro salvo do Resultado Final ou padrão da config
function pctObraDe(key) {
  const c = EMPREENDIMENTOS[key]; if (!c) return 0;
  let salvo = parseFloat(localStorage.getItem('rf_'+key+'_pctObraExec'));
  if (!(salvo>0)) salvo = parseFloat(localStorage.getItem('rf_'+c.sheetId+'_pctObraExec'));
  return (salvo>0? salvo : (c.pctObraDefault||0));
}
function rfGet(k,def) { return localStorage.getItem(rfKey(k)) ?? String(def??''); }
function rfSet(k,v) { localStorage.setItem(rfKey(k),v); }

function rfInput(key,label,value,placeholder,isPct) {
  const raw = parseFloat(rfGet(key,0))||0;
  const display = raw > 0 ? (isPct ? String(raw) : fmtInputNum(raw)) : '';

  return '<div>'
    +'<div style="font-size:10px;font-family:DM Mono,monospace;color:#A1A1A6;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">'+label+(isPct?' <span style="color:#A1A1A6;font-size:9px">%</span>':'')+'</div>'

    +' value="'+display+'"'

    +' style="width:100%;background:#0d1117;border:1px solid #1A1A1D;border-radius:8px;color:#e6edf3;font-family:DM Mono,monospace;font-size:13px;padding:9px 12px;outline:none"'

}

function fmtInputNum(v) {
  if(!v) return '';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

window.rfOnFocus = function(input) {
  const raw = rfParseNum(input.value);
  if(raw > 0) input.value = String(raw).replace('.',',');
  input.select();
};

window.rfOnBlur = function(key, input, isPct) {
  const raw = rfParseNum(input.value);
  rfSet(key, raw);
  if(!isPct && raw > 0) input.value = fmtInputNum(raw);
  renderRFCalc(); // Only update result, not inputs
};

window.rfOnInput = function(key, val) {
  const raw = rfParseNum(val);
  rfSet(key, raw);
  renderRFCalc(); // Only update result, not inputs
};

function rfRow(label,value,color,bold,highlight,clickable) {
  const bg = highlight ? 'background:#21262d;border-radius:6px;padding:6px 8px;margin:2px 0;' : '';
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;'+bg+'">'
    +'<span style="font-size:'+(bold?'13':'12')+'px;font-weight:'+(bold?'700':'400')+';color:'+(bold?'#e6edf3':'#A1A1A6')+';'+(clickable?'text-decoration:underline dotted;':'')+'">'+label+'</span>'
    +'<span style="font-family:DM Mono,monospace;font-size:'+(bold?'14':'13')+'px;font-weight:'+(bold?'700':'600')+';color:'+color+'">'+value+'</span>'
    +'</div>';
}

function rfParseNum(val) {
  if(!val) return 0;
  // Handle pt-BR format: 1.234.567,89
  const s = String(val).trim().replace(/\s/g,'');
  if(s.includes(',')) {
    return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
  }
  return parseFloat(s.replace(/,/g,'')) || 0;
}

window.rfSave = function(key,val) {
  rfSet(key, rfParseNum(val));
};

    if (el && el.value) {

  await rfSyncSave(data);
  rfStatusMsg('✓ Salvo em ' + new Date().toLocaleTimeString('pt-BR'), '#6D9E7F');
};

function rfFirebaseSync() {
  if (!window._rfFirebaseReady) return;
  const emp = new URLSearchParams(location.search).get('emp') || 'liberty';
  const keys = ['vgvTotal','pctComissao','pctImposto','pctPermuta','incc','pctObraExec'];
  const data = {};
  keys.forEach(k => {
    const v = localStorage.getItem('rf_' + emp + '_' + k);
    if (v) data[k] = v;
  });
  if (Object.keys(data).length > 0) window.rfSyncSave(data);
}

function renderRFCalc() {
  const el = document.getElementById('rf-calc-container');
  if (!el) return;

  if (!window._rfMigrado) { rfMigrarParametros(); window._rfMigrado = true; }

  const vgvTotal    = parseFloat(rfGet('vgvTotal',0))||0;
  const vgvReal     = parseFloat(rfGet('vgvRealizado',0))||0;
  const pctCom      = parseFloat(rfGet('pctComissao',0))||0;
  const pctImp      = parseFloat(rfGet('pctImposto',0))||0;
  const pctPerm     = parseFloat(rfGet('pctPermuta',0))||0;
  // Permuta já paga — calculada automaticamente das despesas (categoria Permuta)
  const permPago = _DESPESAS
    .filter(r => (r.categoria||'').toLowerCase().includes('permut'))
    .reduce((s,r) => s+r.valor, 0);
  const incc        = parseFloat(rfGet('incc',0))||0;
  const pctObraExec = parseFloat(rfGet('pctObraExec', CFG.pctObraDefault||0))||0;

  // ── Já saiu do caixa (das despesas lançadas) ─────────────────
  const comissaoPaga = _DESPESAS
    .filter(r => (r.categoria||'').toLowerCase().includes('comiss'))
    .reduce((s,r) => s+r.valor, 0);
  const impostoPago = _DESPESAS
    .filter(r => { const c=(r.categoria||'').toLowerCase(); return c.includes('imposto')||c.includes('tribut'); })
    .reduce((s,r) => s+r.valor, 0);

  // ── PERMUTA ───────────────────────────────────────────────────
  // Permuta bruta = VGV × %
  const permutaBruta   = vgvTotal * (pctPerm/100);
  // Permuta líquida = bruta − comissão − imposto sobre a parte do permutante
  const permutaLiq     = permutaBruta * (1 - pctCom/100 - pctImp/100);
  // permPago já é líquido (comissão e imposto já descontados)
  // Permuta líquida ainda a pagar = líquida total − já paga (líquida)
  const permutaAPagar  = Math.max(0, permutaLiq - permPago);

  // ── RECEITA ───────────────────────────────────────────────────
  // Deduz da receita apenas o que AINDA FALTA PAGAR (líquido)
  const comissaoTotal  = vgvTotal * (pctCom/100);
  const impostoTotal   = vgvTotal * (pctImp/100);
  const comissaoAPagar = Math.max(0, comissaoTotal - comissaoPaga);
  const impostoAPagar  = Math.max(0, impostoTotal  - impostoPago);

  // Outras receitas: bonificação, rateio, reembolso, tarifas — não entram no VGV
  // (não são venda, logo não geram comissão nem imposto), mas são dinheiro que
  // entrou no empreendimento e impactam o resultado final.
  const outrasReceitas = (_RECEITAS||[]).filter(r=>r.grupo==='outras')
                          .reduce((s,r)=>s+(r.valReceb||0),0);
  const recuperacaoCusto = (_RECEITAS||[]).filter(r=>r.grupo==='outras' && r.recupera)
                          .reduce((s,r)=>s+(r.valReceb||0),0);

  const receitaLiq = vgvTotal - comissaoAPagar - impostoAPagar - permutaAPagar + incc + outrasReceitas;

  // ── CUSTOS JÁ PAGOS ───────────────────────────────────────────
  // TUDO que saiu do caixa — obra, comissões, impostos, permuta
  // Sem nenhum ajuste — o que está pago está pago
  const custoObra  = _DESPESAS.filter(r=>isCustoObra(r.categoria)).reduce((s,r)=>s+r.valor,0);
  const custoTotal = _DESPESAS.reduce((s,r)=>s+r.valor,0);
  const outraDesp  = custoTotal - custoObra;

  // ── PROJEÇÃO ─────────────────────────────────────────────────
  const obraProj      = pctObraExec>0 ? custoObra/(pctObraExec/100) : 0;
  const obraAIncorrer = pctObraExec>0 ? obraProj - custoObra : 0;

  // ── RESULTADO ────────────────────────────────────────────────
  const resultadoAtual = receitaLiq - custoTotal;
  const resultadoProj  = pctObraExec>0 ? resultadoAtual - obraAIncorrer : null;

  // ── HELPERS ──────────────────────────────────────────────────

  // Aviso de parâmetro faltando: sem VGV/percentuais o cálculo vira "custo puro"
  // e o resultado despenca para negativo — isso precisa ser explícito, nunca silencioso.
  const _faltando = [];
  if (!(vgvTotal>0)) _faltando.push('VGV total');
  if (!(pctCom>0))   _faltando.push('% de comissão');
  if (!(pctImp>0))   _faltando.push('% de imposto');
  const _avisoParams = _faltando.length
    ? '<div style="background:rgba(191,107,96,.08);border:1px solid rgba(191,107,96,.45);border-radius:14px;padding:14px 16px;margin-bottom:14px">'
      +'<div style="font-weight:600;color:#BF6B60;margin-bottom:4px">⚠ Parâmetros não preenchidos: '+_faltando.join(' · ')+'</div>'
      +'<div style="font-size:12px;color:var(--muted);line-height:1.5">Sem eles o painel soma apenas os custos e o resultado aparece negativo — não é prejuízo, é parâmetro ausente. '
      +'Preencha nos campos acima; comissões e impostos a pagar voltam a ser calculados sobre o VGV.</div></div>'
    : '';

  el.innerHTML =
    _avisoParams
    + '<div style="background:#161b22;border:1px solid #21262d;border-radius:14px;padding:18px;margin-bottom:14px">'

    // ── 1. RECEITA ───────────────────────────────────────────
    +rfSec('1. Receita','#6C8FB5')
    +rfResultRow('VGV Total Bruto', fmt(vgvTotal), '#e6edf3', false, 'Valor total de todas as unidades do empreendimento')


    // Comissões
    +rfResultRow('(−) Comissões a pagar',
      '− '+fmt(comissaoAPagar), '#BF6B60', false,
      'Total previsto: '+fmt(comissaoTotal)+' · Já pago: '+fmt(comissaoPaga)+' · Falta: '+fmt(comissaoAPagar))

    // Impostos
    +rfResultRow('(−) Impostos e taxas a pagar',
      '− '+fmt(impostoAPagar), '#BF6B60', false,
      'Total previsto: '+fmt(impostoTotal)+' · Já pago: '+fmt(impostoPago)+' · Falta: '+fmt(impostoAPagar))

    // Permuta — bloco dedicado
    +'<div style="background:#1e2630;border-radius:8px;padding:12px;margin:10px 0">'
    +'<div style="font-size:10px;color:#A1A1A6;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Permuta com o terreno</div>'
    +rfResultRow('Valor bruto da permuta ('+pctPerm+'% do VGV)', fmt(permutaBruta), '#A1A1A6', false, 'Parte bruta que cabe ao permutante')
    +rfResultRow('(−) Comissão e imposto sobre a permuta', '− '+fmt(permutaBruta*(pctCom/100+pctImp/100)), '#A1A1A6', false, pctCom+'% comissão + '+pctImp+'% imposto sobre a parte do permutante')
    +rfResultRow('= Permuta líquida total', fmt(permutaLiq), '#A1A1A6', true, 'Valor líquido total devido ao permutante')
    +'<div style="height:1px;background:#1A1A1D;margin:8px 0"></div>'
    +rfResultRow('Permuta já paga (líquida)', fmt(permPago), '#6D9E7F', false, 'Já transferido ao permutante — valor líquido')
    +rfResultRow('(−) Permuta líquida a pagar', '− '+fmt(permutaAPagar), '#BF6B60', true, 'Obrigação futura com o permutante — deduzida da receita')
    +'</div>'

    +(incc>0 ? rfResultRow('(+) INCC — correção monetária', '+ '+fmt(incc), '#6D9E7F', false, 'Sem incidência de comissão, imposto ou permuta') : '')
    +(outrasReceitas>0 ? rfResultRow('(+) Outras receitas', fmt(outrasReceitas), '#6D9E7F', false,
        'Créditos que não são venda — bonificação de fornecedor, rateio entre obras, reembolso, tarifas recuperadas. Não entram no VGV (não geram comissão nem imposto), mas entraram no caixa e somam ao resultado.'
        + (recuperacaoCusto>0 ? ' Deste total, ' + fmt(recuperacaoCusto) + ' é recuperação de custo (reembolso de material e de fornecedor): o resultado fica correto, mas o custo de obra continua registrado pelo valor bruto, então o custo por m² não desconta essa devolução.' : '')) : '')
    +rfResultRow('= Receita Líquida', fmt(receitaLiq), '#6C8FB5', true)

    // ── 2. CUSTOS JÁ PAGOS ───────────────────────────────────
    +rfSec('2. Custos já pagos','#BF6B60')
    +rfNote('Tudo que saiu do caixa — sem ajustes. Inclui obra, comissões pagas, impostos pagos e permuta já paga.')
    +'<div onclick="openDrill(&quot;custo_obra&quot;)" style="cursor:pointer">'
    +rfResultRow('Custo de obra ↗', fmt(custoObra), '#BF6B60', false, 'Materiais, mão de obra e demais itens de construção · clique para detalhar')
    +'</div>'
    +rfResultRow('Outras saídas de caixa', fmt(outraDesp), '#A1A1A6', false,
      'Comissões pagas: '+fmt(comissaoPaga)
      +' · Impostos pagos: '+fmt(impostoPago)
      +' · Permuta paga: '+fmt(permPago)
      +' · Demais despesas: '+fmt(Math.max(0, outraDesp-comissaoPaga-impostoPago-permPago)))
    +rfResultRow('= Total já pago', fmt(custoTotal), '#BF6B60', true)

    // ── 3. PROJEÇÃO ──────────────────────────────────────────
    +(pctObraExec>0

    +(function(){

      const tRet=_RETIRADAS.reduce((s,r)=>s+r.valor,0);
      if (!tAp) return '';
      const exposto = tAp - tRet;
      // fluxo do sócio: aportes(-) e retiradas(+) nas datas reais; terminal = exposto devolvido + resultado projetado
      const fluxos=[];
      _APORTES.forEach(a=>{ const d=parseDate(a.data); if(d) fluxos.push({d, v:-a.valor}); });
      _RETIRADAS.forEach(r2=>{ const d=parseDate(r2.data); if(d) fluxos.push({d, v:+r2.valor}); });
      // conclusão estimada: hoje + meses restantes pelo ritmo médio de execução
      const mesesDecorridos = fluxos.length ? Math.max(6,(new Date()-Math.min(...fluxos.map(f=>+f.d)))/(30.44*86400000)) : 24;
      const ritmo = pctObraExec>0 ? pctObraExec/mesesDecorridos : 2;
      const mesesRest = pctObraExec>0 ? Math.max(1, Math.ceil((100-pctObraExec)/Math.max(0.5,ritmo))) + 3 : 12; // +3 meses p/ vender/receber
      const fimEst = new Date(); fimEst.setMonth(fimEst.getMonth()+mesesRest);

      const t0=+fluxos[0].d;
      const vpl = tx => fluxos.reduce((s,f)=> s + f.v/Math.pow(1+tx, (+f.d-t0)/(30.44*86400000)), 0);
      let lo=-0.05, hi=0.15, tirM=null;

          'Taxa interna de retorno do fluxo real do sócio: aportes (saídas) e retiradas (entradas) nas datas em que ocorreram, mais o recebimento final estimado (capital exposto + resultado projetado) em '+fimEst.toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'})+' (conclusão estimada pelo ritmo de execução + 3 meses de cauda). Compare com CDI ~'+cdiEq+'% a.a.: acima, o empreendimento paga o risco; abaixo, renda fixa teria sido melhor.')
        +rfResultRow('ROI projetado', roi.toFixed(1)+'%', roi>0?'#6D9E7F':'#BF6B60', false,
          'Resultado projetado ('+fmt(resultadoProj)+') ÷ total aportado ('+fmt(tAp)+'). Retorno simples sobre o capital investido, sem considerar o tempo.')
        +rfResultRow('Múltiplo do capital (MOIC)', moic.toFixed(2)+'×', moic>1?'#6D9E7F':'#BF6B60', false,
          'Tudo que volta ao sócio (retiradas já feitas + exposto + resultado projetado) ÷ aportes. 1,00× = empatou; 1,50× = cada real aportado vira um e cinquenta.')
        +(margemVGV!==null? rfResultRow('Margem líquida sobre o VGV', margemVGV.toFixed(1)+'%', margemVGV>15?'#6D9E7F':margemVGV>8?'#C4A55C':'#BF6B60', false,
          'Resultado projetado ÷ VGV. Referência de incorporação residencial: 15–25% saudável; abaixo de 8% acende alerta.') : '')
        +rfResultRow('Acompanhe mês a mês', '↻', '#A1A1A6', false,
          'Estes indicadores recalculam a cada atualização com os números do momento — a série deles ao longo dos meses mostra se o empreendimento está melhorando ou piorando a rota.');
    })()

    // ── CUSTO POR M² DE OBRA ─────────────────────────────────
    +(function(){
      const areaTotal = areaTotalCfg(CFG);
      if (!areaTotal || !custoObra) return '';
      const m2Pago = custoObra/areaTotal;
      const m2Exec = pctObraExec>0 ? custoObra/(areaTotal*pctObraExec/100) : null;

        +(m2Exec!==null ? rfResultRow('Custo/m² do que já foi executado', fmt(m2Exec)+'/m²', '#8E7FA8', false,

        +(m2Proj!==null ? rfResultRow('Custo/m² PROJETADO ao final', fmt(m2Proj)+'/m²', '#C4A55C', false,

        +rfResultRow('Custo/m² pago até hoje (área total)', fmt(m2Pago)+'/m²', '#A1A1A6', false,

let _RECEITAS = [];
let _VENDAS   = [];

// Extrai número da casa da descrição
// Padrões: "7/13 - CASA 05", "3/13 - DISTRA 13", "2/2 - CASA 27", "1/25 - CASA 01"
function extrairCasa(desc) {
  if (!desc) return null;
  const d = String(desc).toUpperCase();
  // Padrão "CASA XX"
  let m = d.match(/CASA\s+(\d+)/);
  if (m) return parseInt(m[1]);
  // Padrão "CS XX" — usado em personalização, correção de INCC e saldo de
  // financiamento. Sem isso, esses lançamentos ficam sem casa e o painel os
  // trata como se fossem contratos de venda distintos.
  m = d.match(/\bCS\s*\.?\s*(\d{1,3})\b/);
  if (m) return parseInt(m[1]);
  // Padrão "DISTRA XX" — "3/13 - DISTRA 13" significa casa 13
  m = d.match(/DISTRA[A-Z]*\s+(\d+)/);
  if (m) return parseInt(m[1]);
  // Padrão "X/X - 13" (só número após traço)
  m = d.match(/\d+\/\d+\s*-\s*(\d+)$/);
  if (m) return parseInt(m[1]);
  return null;
}

// Extrai número da casa de texto de despesa
// Padrões: "DEVOLUÇÃO DISTRATO CASA 13", "DISTRATO CASA 5", "REEMB CASA 13"
function extrairCasaDespesa(desc) {
  if (!desc) return null;
  const d = String(desc).toUpperCase();
  let m = d.match(/CASA\s*(\d+)/);
  if (m) return parseInt(m[1]);
  // "DISTRAT" seguido de número
  m = d.match(/DISTRAT[A-Z]*\s*[#-]?\s*(\d+)/);
  if (m) return parseInt(m[1]);
  // Número isolado no final: "DEVOLUÇÃO 13"
  m = d.match(/DEVOLU[ÇC][ÃA]O.*?(\d+)/i);
  if (m) return parseInt(m[1]);
  return null;
}

// Categorias a excluir das receitas de vendas
function isReceitaExcluir(origem, desc) {
  const o = (origem||'').toUpperCase();
  const d = (desc||'').toUpperCase();
  if (o.includes('AFAC') || d.includes('AFAC')) return true;
  if (o.includes('APORTE') || d.includes('APORTE')) return true;
  if (o.includes('LANÇAMENTO FINANCEIRO') && !d.includes('VENDA') && !d.includes('CASA')) return true;
  return false;
}

function isIncc(desc) {
  return /INCC|CORREÇÃO|CORRECAO/i.test(desc||'');
}

function isDistrato(desc) {
  return /DISTRATO|RESILIÇÃO|RESILICAO|RESCISÃO|RESCISAO/i.test(desc||'');
}

let _REC_APORTES = [];
let _RENDIMENTOS = [];
function parseReceitasRows(allRows) {
  // Retorna {receitas, aportes, rendimentos} — colunas detectadas pelo cabeçalho
  window._censoReceitas = { brutas: allRows.length, porAnoAportes: {}, primeirasLinhas: allRows.slice(1,4).map(r=>String(r&&r[3]||'').slice(0,12)) };
  window._recDescartadas = [];   // regra de descarte removida: nada mais é ignorado
  const M = detectCols(allRows, "rec");
  const rows = allRows.slice(M.hdr + 1);
  const receitas=[], aportes=[], rendimentos=[];
  rows.forEach(r => {
    const cliente  = String(r[M.quem] || '').trim();
    const dataComp = normalizeDate(String(r[M.data] || '').trim());
    const dataVenc = M.dataVenc>=0 ? normalizeDate(String(r[M.dataVenc] || '').trim()) : '';
    const desc     = String(r[M.desc] || '').trim();
    const origem   = M.origem>=0 ? String(r[M.origem] || '').trim() : '';
    const situacao = M.situ>=0 ? String(r[M.situ]|| '').trim() : '';
    const valOrig  = Math.abs(parseVal(r[M.valOrig]));
    const valReceb = Math.abs(parseVal(r[M.valReceb])) || Math.abs(parseVal(r[M.valTot]));
    const catRaw   = String(r[M.cat]|| '').trim();
    const catU     = catRaw.toUpperCase();
    const descU    = desc.toUpperCase();
    const oriU     = origem.toUpperCase();
    if (!dataComp || !parseDate(dataComp)) {
      window._cargaDrop = window._cargaDrop || [];
      if (window._cargaDrop.length < 12 && (cliente || desc || valReceb>0))
        window._cargaDrop.push({aba:'RECEITAS', motivo:'data ilegível: "'+String(r[M.data]||'').slice(0,18)+'"', quem:(cliente||desc).slice(0,30), val:valReceb});
      window._cargaDropN = (window._cargaDropN||0)+1;
      return;
    }

    if (catU.includes('AFAC') || catU.includes('APORTE') || oriU.includes('AFAC') || descU.startsWith('AFAC') || descU.startsWith('APORTE')) {
      const socio = normalizeSocio(cliente) || normalizeSocio(catRaw) || normalizeSocio(desc) || (cliente ? "(" + cliente.split(" ")[0] + ")" : null);
      if (socio && valReceb > 0) {
        aportes.push({ socio, data: dataComp, valor: valReceb });
        const ano = dataComp.slice(-4);
        const c = (window._censoReceitas.porAnoAportes[ano] = window._censoReceitas.porAnoAportes[ano] || {n:0,v:0});
        c.n++; c.v += valReceb;
      }
      return;
    }
    if (catU.includes('RENDIMENTO') || descU.startsWith('RENDIMENTO APLICA')) {
      if (valReceb > 0) rendimentos.push({ data: dataComp, valor: valReceb, desc });
      return;
    }
    // Nenhum crédito é descartado: todo lançamento entra e é classificado.
    // A regra antiga ignorava "Lançamento Financeiro" sem casa no descritivo e
    // derrubava INCC, personalização, bonificação e reembolso — receita de verdade,
    // que impacta o resultado do empreendimento.
    const casa = extrairCasa(desc);
    const tipo = isIncc(desc) || catU.includes('INCC') || catU.includes('IGPM') ? 'INCC'
               : descU.includes('DISTR') ? 'VendaDistratada'
               : descU.includes('COMISSÃO') || descU.includes('COMISSAO') ? 'Comissao'
               : catU.includes('PERSONALIZ') || descU.includes('PERSONALIZ') ? 'Personalizacao'
               : catU.includes('REEMBOLS') || descU.includes('REEMBOLS') || descU.includes('RESSARC') ? 'Reembolso'
               : catU.includes('BONIFICA') || descU.includes('BONIFICA') ? 'Bonificacao'
               : catU.includes('RATEIO') || descU.includes('RATEIO') ? 'Rateio'
               : oriU.includes('VENDA') || catU === 'VENDAS' || (casa && !isIncc(desc)) ? 'Venda'
               : 'OutraReceita';
    // Dois grupos, conforme a regra do negócio: o que é ligado à VENDA compõe o VGV e
    // as análises comerciais; o resto não entra no VGV mas entra no resultado da obra.
    const GRUPO_VENDA = ['Venda','INCC','VendaDistratada','Personalizacao'];
    const grupo = GRUPO_VENDA.includes(tipo) ? 'venda' : 'outras';
    // Recuperação de custo: subconjunto de "outras" que devolve dinheiro de despesa já paga
    const recupera = (tipo === 'Reembolso') || catU.includes('AQUISICAO DE MATERIA') || catU.includes('AQUISIÇÃO DE MATERIA');
    // Parcela FINAL de contrato distratado ("N/N - DISTRATO CASA X"): o sistema quita o
    // saldo devedor para encerrar o contrato e exporta como "recebido", mas NÃO houve
    // entrada de dinheiro. Confirmado pela direção em 03/08. Marcada aqui para sair do
    // caixa e do recebido, com rastro na Auditoria.
    const _mParc = String(desc||'').match(/^\s*(\d+)\s*\/\s*(\d+)\s*-/);
    const baixaSemCaixa = !!_mParc && _mParc[1] === _mParc[2] && /DISTRAT/i.test(desc||'');
    if (valOrig > 0 || valReceb > 0)
      receitas.push({ cliente, dataComp, dataVenc, desc, origem, situacao, valOrig, valReceb, casa, tipo, grupo, recupera, baixaSemCaixa, cat: catRaw, conta: String((r[M.conta!==undefined?M.conta:24])||'').trim() });
  });
  return { receitas, aportes, rendimentos };
}

let _GV = null, _GV_MOTIVO = '';
async function loadGestaoVendas(force) {
  if (!CFG.abaGestaoVendas) return null;
  if (_GV && _GV.length && !force) return _GV;
  const nomes = [];
  if (CFG.gestaoVendasGid !== undefined) nomes.push({gid: CFG.gestaoVendasGid});
